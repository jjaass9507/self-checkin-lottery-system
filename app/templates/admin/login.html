{% extends "base.html" %}

{% block title %}後台驗證{% endblock %}

{% block styles %}
<style>
    .login-wrapper {
        min-height: calc(100vh - 120px);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .login-card {
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px 36px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        position: relative;
        overflow: hidden;
    }
    .login-card::before {
        content: '';
        position: absolute;
        top: -60%; left: -60%;
        width: 220%; height: 220%;
        background: radial-gradient(circle, rgba(253,185,49,0.07) 0%, transparent 60%);
        animation: rotate 12s linear infinite;
        pointer-events: none;
    }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .lock-icon {
        font-size: 3rem;
        background: linear-gradient(to bottom, #FDB931, #FFD700);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 10px rgba(253,185,49,0.4));
        display: block;
        text-align: center;
        margin-bottom: 8px;
    }
    .login-title {
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: 1rem;
        letter-spacing: 3px;
        color: rgba(255,255,255,0.7);
        margin-bottom: 30px;
    }
    .password-input {
        background: rgba(255,255,255,0.07) !important;
        border: 2px solid rgba(255,255,255,0.15) !important;
        color: #fff !important;
        text-align: center;
        font-size: 1.3rem;
        letter-spacing: 4px;
        border-radius: 12px;
        height: 56px;
    }
    .password-input:focus {
        background: rgba(255,255,255,0.12) !important;
        border-color: #FDB931 !important;
        box-shadow: 0 0 0 0.2rem rgba(253,185,49,0.25) !important;
    }
    .password-input::placeholder { color: rgba(255,255,255,0.25); letter-spacing: 2px; }
    .btn-enter {
        background: linear-gradient(90deg, #FDB931 0%, #FFD700 100%);
        border: none;
        color: #1a1a1a;
        font-weight: 800;
        font-size: 1.05rem;
        padding: 14px;
        border-radius: 12px;
        transition: all 0.2s;
        position: relative;
        z-index: 1;
    }
    .btn-enter:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(253,185,49,0.35);
        color: #000;
    }
    .back-link { color: rgba(255,255,255,0.4); font-size: 0.85rem; text-decoration: none; transition: color 0.2s; }
    .back-link:hover { color: #FDB931; }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <i class="bi bi-shield-lock-fill lock-icon"></i>
        <div class="login-title">ADMIN ACCESS</div>

        <form method="POST">
            <div class="mb-4">
                <input type="password" name="password"
                       class="form-control password-input"
                       placeholder="● ● ● ● ● ●"
                       required autofocus>
            </div>
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-enter">
                    <i class="bi bi-unlock-fill me-2"></i>驗證進入
                </button>
            </div>
        </form>

        <div class="text-center">
            <a href="{{ url_for('checkin.index') }}" class="back-link">
                <i class="bi bi-arrow-left me-1"></i>返回前台
            </a>
        </div>
    </div>
</div>
{% endblock %}
