<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台 - 取消紀錄</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8f9fa; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('admin.index') }}">
                <i class="bi bi-shield-lock-fill me-2"></i> 報到抽獎系統 - 後台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('admin.import_page') }}">
                            <i class="bi bi-cloud-upload-fill me-1"></i> 匯入名單
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('admin.prizes') }}">
                            <i class="bi bi-gift-fill me-1"></i> 獎項設定
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('admin.logs_page') }}">
                            <i class="bi bi-journal-text me-1"></i> 操作紀錄
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('checkin.dashboard') }}">
                            <i class="bi bi-bar-chart-fill me-1"></i> 報到儀表板
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="card shadow-sm border-secondary">
            <div class="card-header bg-secondary text-white">
                <h4 class="mb-0"><i class="bi bi-journal-text me-2"></i>取消報到操作日誌</h4>
            </div>
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">時間</th>
                            <th scope="col">操作者工號</th>
                            <th scope="col">被取消人員</th>
                            <th scope="col">被取消工號</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for log, person in logs %}
                        <tr>
                            <td>{{ log.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</td>
                            <td class="text-danger fw-bold">{{ log.cancelled_by }}</td>
                            <td>{{ person.name }}</td>
                            <td>{{ person.employee_id }}</td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="4" class="text-center p-4 text-muted">目前尚無任何取消紀錄</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
