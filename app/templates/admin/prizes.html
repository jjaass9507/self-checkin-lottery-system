{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>獎項管理</h2>
    
    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addPrizeModal">
        <i class="bi bi-plus-lg"></i> 新增獎項
    </button>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>類型</th>
                        <th>名稱</th>
                        <th>數量</th>
                        <th>排序</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for prize in prizes %}
                    <tr>
                        <td>
                            {% if prize.prize_type == 'tail' %}
                                <span class="badge bg-info text-dark">尾數獎</span>
                            {% else %}
                                <span class="badge bg-warning text-dark">公獎</span>
                            {% endif %}
                        </td>
                        <td class="fw-bold">{{ prize.name }}</td>
                        <td>{{ prize.quantity }}</td>
                        <td>{{ prize.display_order }}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-secondary me-1" 
                                onclick="openEditModal('{{ prize.id }}', '{{ prize.name }}', '{{ prize.prize_type }}', '{{ prize.quantity }}', '{{ prize.display_order }}')"
                                title="編輯">
                                <i class="bi bi-pencil"></i>
                            </button>
                            
                            <form method="POST" action="{{ url_for('admin.reset_prize') }}" class="d-inline" onsubmit="return confirm('【警告】\n確定要清除「{{ prize.name }}」的所有中獎紀錄嗎？\n\n這將會：\n1. 刪除該獎項的已抽出號碼\n2. 將該獎項得主恢復為未中獎狀態\n\n此操作無法復原！');">
                                <input type="hidden" name="prize_name" value="{{ prize.name }}">
                                <input type="hidden" name="prize_type" value="{{ prize.prize_type }}">
                                <button type="submit" class="btn btn-sm btn-outline-warning me-1" title="清除中獎紀錄(重抽)">
                                    <i class="bi bi-arrow-counterclockwise"></i>
                                </button>
                            </form>

                            <form method="POST" action="{{ url_for('admin.manage_prizes') }}" class="d-inline" onsubmit="return confirm('確定要刪除「{{ prize.name }}」這個獎項設定嗎？\n(這不會刪除已中獎的紀錄)');">
                                <input type="hidden" name="action" value="delete">
                                <input type="hidden" name="prize_id" value="{{ prize.id }}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="刪除獎項"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="prizeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('admin.manage_prizes') }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">新增獎項</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="action" id="formAction" value="add">
                    <input type="hidden" name="prize_id" id="prizeId">
                    
                    <div class="mb-3">
                        <label class="form-label">獎項類型</label>
                        <select class="form-select" name="prize_type" id="prizeType">
                            <option value="tail">尾數獎</option>
                            <option value="public">公獎</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">獎項名稱</label>
                        <input type="text" class="form-control" name="name" id="prizeName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">數量 (公獎用)</label>
                        <input type="number" class="form-control" name="quantity" id="prizeQuantity" value="1" min="1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">排序 (數字越小越前)</label>
                        <input type="number" class="form-control" name="display_order" id="prizeOrder" value="0">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">儲存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    var prizeModal;
    document.addEventListener('DOMContentLoaded', function() {
        prizeModal = new bootstrap.Modal(document.getElementById('prizeModal'));
        
        // 綁定新增按鈕 (因為共用同一個 Modal)
        document.querySelector('[data-bs-target="#addPrizeModal"]').addEventListener('click', function() {
            document.getElementById('modalTitle').innerText = "新增獎項";
            document.getElementById('formAction').value = "add";
            document.getElementById('prizeId').value = "";
            document.getElementById('prizeName').value = "";
            document.getElementById('prizeType').value = "tail";
            document.getElementById('prizeQuantity').value = "1";
            document.getElementById('prizeOrder').value = "0";
            prizeModal.show();
        });
    });

    function openEditModal(id, name, type, qty, order) {
        document.getElementById('modalTitle').innerText = "編輯獎項";
        document.getElementById('formAction').value = "edit";
        document.getElementById('prizeId').value = id;
        document.getElementById('prizeName').value = name;
        document.getElementById('prizeType').value = type;
        document.getElementById('prizeQuantity').value = qty;
        document.getElementById('prizeOrder').value = order;
        prizeModal.show();
    }
</script>
{% endblock %}
