<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中獎名單輪播</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ocean.css') }}?v=20261118">
    <style>
        :root { --card-base-size: 30px; /* JS 會依人數動態調整 */ }
        body { overflow: hidden; }
        .screen { height: 100vh; display: flex; flex-direction: column; position: relative; }

        header { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding: 28px 20px 14px; }
        .main-title { font: 600 16px var(--num-font); letter-spacing: .6em; color: var(--foam); }
        #current-prize-title { font: 900 64px/1.2 'Noto Sans TC', sans-serif; margin-top: 8px; letter-spacing: .06em; max-width: 92vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .5s; }
        .dots { display: flex; gap: 8px; margin-top: 12px; height: 6px; }
        .dot { width: 10px; height: 6px; border-radius: 3px; background: rgba(190, 245, 255, .3); transition: width .4s, background-color .4s; }
        .dot.on { width: 34px; background: linear-gradient(90deg, #7EF0E0, #FFE3A3); }

        main { flex: 1; min-height: 0; display: flex; gap: 28px; padding: 12px 36px 34px; transition: opacity .5s; }
        main.fade-out { opacity: 0; }
        .split-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; border-radius: 28px; padding: 16px 18px; }
        .col-header { flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 14px; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid rgba(190, 245, 255, .14); }
        .col-code { font: 800 30px var(--num-font); letter-spacing: .1em; }
        .col-label { font-size: 18px; color: var(--muted); letter-spacing: .24em; }
        .card-container { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: .5em; padding: 10px 0 2px; font-size: var(--card-base-size); }

        .card-in { animation: rise-big .8s cubic-bezier(.2, .9, .25, 1.15) both; }
        .winner-card {
            width: 10em; padding: .65em .5em; border-radius: .8em;
            background: rgba(8, 50, 80, .72); border: 1px solid rgba(190, 245, 255, .28);
            box-shadow: 0 .5em 1em rgba(0, 8, 22, .35), inset 0 1px 0 rgba(255, 255, 255, .2);
            display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden;
            animation: bob 6s ease-in-out infinite;
        }
        .winner-card > div { position: relative; }
        .winner-name { font-size: 1.45em; font-weight: 900; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .winner-biz { font-size: .45em; color: #9FD8FF; margin-left: .3em; }
        .winner-id { font: 400 .75em var(--num-font); color: var(--muted); margin: .15em 0; }
        .winner-number { font: 800 1em var(--num-font); color: var(--gold); text-shadow: 0 0 .6em rgba(242, 196, 109, .6); }
        .winner-card.bonus-highlight { background: rgba(242, 196, 109, .2); border-color: rgba(255, 227, 163, .9); box-shadow: 0 0 1em rgba(242, 196, 109, .45), inset 0 1px 0 rgba(255, 255, 255, .3); }

        .progress-bar-container { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(4, 30, 52, .6); overflow: hidden; }
        /* 用 scaleX 取代 width 動畫，進度條不再每幀重排版面 */
        .progress-bar { height: 100%; width: 100%; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, #7EF0E0, #FFE3A3); box-shadow: 0 0 12px rgba(126, 240, 224, .7); }
    </style>
</head>
<body>
<ocean-scene palette="abyss" intensity="1.1" bubbles="70" interactive="false"></ocean-scene>

<div class="screen ocean-layer">
    <header>
        <div class="main-title">CONGRATULATIONS</div>
        <div id="current-prize-title" class="shimmer-text gold">讀取中...</div>
        <div class="dots" id="dots"></div>
    </header>

    <main id="main-content">
        <section class="split-pane glass-soft" id="pane-hr">
            <div class="col-header"><span class="col-code">HR</span><span class="col-label">行政</span></div>
            <div id="list-hr" class="card-container"></div>
        </section>
        <section class="split-pane glass-soft" id="pane-fac">
            <div class="col-header"><span class="col-code">FAC</span><span class="col-label">廠務</span></div>
            <div id="list-fac" class="card-container"></div>
        </section>
    </main>

    <div class="progress-bar-container">
        <div class="progress-bar" id="page-progress"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/ocean-fx.js') }}?v=20261118"></script>
<script>
    const mainContent = document.getElementById('main-content');
    const titleEl = document.getElementById('current-prize-title');
    const listHrEl = document.getElementById('list-hr');
    const listFacEl = document.getElementById('list-fac');
    const progressBar = document.getElementById('page-progress');
    const dotsEl = document.getElementById('dots');

    let winnersGroups = {}; // 存放分組後的資料 { "三獎": [winners...] }
    let groupKeys = [];     // 存放獎項名稱的順序
    let currentIndex = 0;
    const intervalTime = 10000;
    let timer = null;
    let firstRender = true;

    function esc(v) {
        return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // 初始化
    fetchData();
    setInterval(fetchData, 60000);

    async function fetchData() {
        try {
            const res = await fetch("{{ url_for('lottery.api_winners_all') }}");
            const json = await res.json();

            if (json.success) {
                processData(json.data);
                renderDots();
                if (!timer && groupKeys.length > 0) {
                    renderCurrentGroup();
                    startLoop();
                } else if (groupKeys.length === 0) {
                    titleEl.innerText = "目前無中獎名單";
                }
            }
        } catch (e) { console.error(e); }
    }

    function processData(data) {
        const grouped = {};
        // 保持由舊到新，這樣獎項輪播順序才符合時間軸 (A獎 -> B獎)
        const sortedData = [...data].reverse();

        sortedData.forEach(w => {
            const key = w.prize_name;
            if (!grouped[key]) grouped[key] = [];

            // 同一人重複出現時，若新紀錄是「加碼」則覆蓋，以顯示加碼樣式
            const existingIndex = grouped[key].findIndex(item => item.employee_id === w.employee_id);
            if (existingIndex === -1) {
                grouped[key].push(w);
            } else if (w.is_addon) {
                grouped[key][existingIndex] = w;
            }
        });

        winnersGroups = grouped;
        groupKeys = Object.keys(grouped);
    }

    function renderDots() {
        if (dotsEl.children.length !== groupKeys.length) {
            dotsEl.innerHTML = groupKeys.map(() => '<span class="dot"></span>').join('');
        }
    }

    function renderCurrentGroup() {
        if (groupKeys.length === 0) {
            titleEl.innerText = "目前無中獎名單";
            return;
        }

        mainContent.classList.add('fade-out');
        titleEl.style.opacity = 0;

        setTimeout(() => {
            if (currentIndex >= groupKeys.length) currentIndex = 0;
            const currentPrizeName = groupKeys[currentIndex];
            const winners = winnersGroups[currentPrizeName];

            // 公獎不顯示尾號提示
            const isPublic = winners.length > 0 && winners[0].prize_type === 'public';
            let titleText = currentPrizeName;
            if (!isPublic) {
                // 標題只顯示個位數
                const uniqueTails = [...new Set(winners.map(w => String(w.tail_number).slice(-1)))].sort();
                if (uniqueTails.length > 0) titleText += ` (尾號 ${uniqueTails.join(', ')})`;
            }

            titleEl.innerText = titleText;
            titleEl.style.opacity = 1;
            [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i === currentIndex));

            // 依照抽獎編號排序
            winners.sort((a, b) => a.lottery_number.localeCompare(b.lottery_number));

            const hr = [], fac = [];
            winners.forEach(w => (w.site && w.site.toUpperCase().includes('HR') ? hr : fac).push(w));
            listHrEl.innerHTML = hr.map(createCard).join('');
            listFacEl.innerHTML = fac.map(createCard).join('');

            mainContent.classList.remove('fade-out');
            fitCardsToScreen();
            resetProgressBar();

            if (!firstRender && window.OceanFX) OceanFX.burst(innerWidth / 2, innerHeight / 2, { count: 60, gold: .5, power: 9 });
            firstRender = false;

            currentIndex = (currentIndex + 1) % groupKeys.length;
        }, 500);
    }

    function createCard(winner, i) {
        const delay = Math.min(i * 0.06, 1.5).toFixed(2);
        const bob = (-(i * 0.7) % 6).toFixed(2);
        const bonus = winner.is_addon;
        return `<div class="card-in" style="animation-delay:${delay}s">
            <div class="winner-card${bonus ? ' bonus-highlight' : ''}" style="animation-delay:${bob}s">
                ${bonus ? '<span class="sweep soft"></span>' : ''}
                <div class="winner-name">${esc(winner.name)}${winner.is_business_trip ? '<span class="winner-biz">(公差)</span>' : ''}</div>
                <div class="winner-id">${esc(winner.employee_id)}</div>
                <div class="winner-number">NO.${esc(winner.lottery_number)}</div>
            </div>
        </div>`;
    }

    function startLoop() {
        if (timer) clearInterval(timer);
        timer = setInterval(renderCurrentGroup, intervalTime);
    }

    function resetProgressBar() {
        progressBar.style.transition = 'none';
        progressBar.style.transform = 'scaleX(0)';
        void progressBar.offsetWidth;
        progressBar.style.transition = `transform ${intervalTime}ms linear`;
        progressBar.style.transform = 'scaleX(1)';
    }

    // 二分搜尋最大可容納字級（約 7 次版面計算）
    function fitCardsToScreen() {
        const root = document.documentElement.style;
        const over = el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;
        const overflow = () => over(listHrEl) || over(listFacEl);
        let lo = 8, hi = 64;
        root.setProperty('--card-base-size', hi + 'px');
        if (!overflow()) return;
        while (hi - lo > 1) {
            const mid = Math.floor((lo + hi) / 2);
            root.setProperty('--card-base-size', mid + 'px');
            if (overflow()) hi = mid; else lo = mid;
        }
        root.setProperty('--card-base-size', lo + 'px');
    }

    let resizeTimer = null;
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitCardsToScreen, 150); });
</script>
</body>
</html>
