<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>榮譽榜 - 中獎名單輪播</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-base-size: 1.2rem;
        }
        
        body {
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            height: 100vh;
            color: #fff;
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
            display: flex; flex-direction: column;
        }

        header {
            padding: 15px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            display: flex; flex-direction: column; align-items: center;
        }
        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            margin: 0;
            opacity: 0.7;
        }
        
        #current-prize-title {
            font-size: 3.5rem;
            font-weight: 900;
            margin-top: 5px;
            background: linear-gradient(to right, #ffd700, #ffec8b, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow { from { text-shadow: 0 0 20px rgba(255,215,0,0.4); } to { text-shadow: 0 0 40px rgba(255,215,0,0.8); } }

        main {
            flex-grow: 1;
            padding: 20px 40px;
            display: flex;
            gap: 40px;
            overflow: hidden;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }
        
        .fade-out { opacity: 0; }

        .split-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-radius: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .col-header {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            padding-bottom: 10px;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }
        .col-header.hr { color: #ff9ff3; text-shadow: 0 0 10px #ff9ff3; }
        .col-header.fac { color: #54a0ff; text-shadow: 0 0 10px #54a0ff; }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            justify-content: center;
            gap: 0.8em;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .winner-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 0.6em;
            width: 11em; 
            padding: 0.6em;
            font-size: var(--card-base-size); 
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0.5em 1em rgba(0,0,0,0.3);
            position: relative;
        }
        
        .winner-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 4px; background: linear-gradient(to bottom, #f12711, #f5af19);
            border-top-left-radius: 0.6em; border-bottom-left-radius: 0.6em;
        }

        /* (新增) 加碼獎項的高亮樣式：紫色漸層 + 金色邊框 + 發光 */
        .winner-card.bonus-highlight {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: #fff !important;
            border: 3px solid #ffd700 !important;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            transform: scale(1.05);
            z-index: 10;
        }

        /* 加碼卡片內的數字改為金色 */
        .winner-card.bonus-highlight .winner-number { 
            color: #ffd700; 
        }

        /* 移除原本卡片左側的紅橘色裝飾線，避免顏色衝突 */
        .winner-card.bonus-highlight::before { 
            content: none; 
        }


        .winner-name { font-size: 1.4em; font-weight: 700; margin-bottom: 0.2em; color: #fff; }
        .winner-id { font-size: 0.9em; color: #ccc; margin-bottom: 0.2em; }
        
        .winner-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1em;
            color: #ffd700;
            font-weight: bold;
        }

        .progress-bar-container {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 5px; background: #333;
        }
        .progress-bar {
            height: 100%; background: #00ffea; width: 0%;
        }
        
        /* 避免標題過長時跑版 */
        #current-prize-title {
            max-width: 90vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <header>
        <div class="main-title">CONGRATULATIONS</div>
        <div id="current-prize-title">讀取中...</div>
    </header>

    <main id="main-content">
        <div class="split-pane">
            <div class="col-header hr">HR 行政</div>
            <div id="list-hr" class="card-container"></div>
        </div>
        
        <div class="split-pane">
            <div class="col-header fac">FAC 廠務</div>
            <div id="list-fac" class="card-container"></div>
        </div>
    </main>

    <div class="progress-bar-container">
        <div class="progress-bar" id="page-progress"></div>
    </div>

    <script>
        const mainContent = document.getElementById('main-content');
        const titleEl = document.getElementById('current-prize-title');
        const listHrEl = document.getElementById('list-hr');
        const listFacEl = document.getElementById('list-fac');
        const progressBar = document.getElementById('page-progress');
        
        let winnersGroups = {}; // 存放分組後的資料 { "三獎": [winners...] }
        let groupKeys = [];     // 存放獎項名稱的順序
        let currentIndex = 0;
        const intervalTime = 10000; 
        let timer = null;

        // 初始化
        fetchData();
        setInterval(fetchData, 60000); 

        async function fetchData() {
            try {
                const res = await fetch("{{ url_for('lottery.api_winners_all') }}");
                const json = await res.json();
                
                if (json.success) {
                    processData(json.data);
                    
                    if (!timer && groupKeys.length > 0) {
                        renderCurrentGroup();
                        startLoop();
                    }
                }
            } catch (e) { console.error(e); }
        }

        function processData(data) {
            const grouped = {};
            // 保持由舊到新，這樣獎項輪播順序才符合時間軸 (A獎 -> B獎)
            const sortedData = [...data].reverse(); 

            sortedData.forEach(w => {
                const key = w.prize_name;
                
                if (!grouped[key]) grouped[key] = [];
                
                // 檢查此人是否已在該獎項名單中
                //findIndex 回傳索引，若無則回傳 -1
                const existingIndex = grouped[key].findIndex(item => item.employee_id === w.employee_id);
                
                if (existingIndex === -1) {
                    // 1. 如果沒出現過，直接加入
                    grouped[key].push(w);
                } else {
                    // 2. 如果出現過 (重複中獎紀錄)，檢查是否為「加碼」
                    // 如果原本是「一般」，但現在這筆是「加碼」，我們希望能顯示加碼的樣式 (紫色)
                    // 所以要用這筆資料「覆蓋」掉原本的舊資料
                    if (w.is_addon) {
                        grouped[key][existingIndex] = w;
                    }
                }
            });

            winnersGroups = grouped;
            groupKeys = Object.keys(grouped);
        }

        function renderCurrentGroup() {
            if (groupKeys.length === 0) {
                titleEl.innerText = "目前無中獎名單";
                return;
            }

            mainContent.classList.add('fade-out');
            titleEl.style.opacity = 0;

            setTimeout(() => {
                // 2. 取出當前獎項
                const currentPrizeName = groupKeys[currentIndex];
                const winners = winnersGroups[currentPrizeName];

                // ---【修正重點 2：標題只顯示個位數】---
                // 收集該獎項的所有尾號，並強制只取最後一位 (slice(-1))
                const uniqueTails = [...new Set(winners.map(w => {
                    const t = String(w.tail_number);
                    return t.slice(-1); 
                }))].sort();
                
                // 組合標題
                let titleText = currentPrizeName;
                if (uniqueTails.length > 0) {
                    titleText += ` (尾號 ${uniqueTails.join(', ')})`;
                }
                titleEl.innerText = titleText;
                titleEl.style.opacity = 1;
                
                listHrEl.innerHTML = '';
                listFacEl.innerHTML = '';
                
                document.documentElement.style.setProperty('--card-base-size', '1.2rem');

                // (*** 排序邏輯：依照抽獎編號排序 ***)
                winners.sort((a, b) => {
                    return a.lottery_number.localeCompare(b.lottery_number);
                });

                // 3. 產生卡片
                winners.forEach(w => {
                    const card = createCard(w);
                    if (w.site && w.site.toUpperCase().includes('HR')) {
                        listHrEl.appendChild(card);
                    } else {
                        listFacEl.appendChild(card);
                    }
                });

                mainContent.classList.remove('fade-out');
                setTimeout(fitCardsToScreen, 50);
                resetProgressBar();

                currentIndex = (currentIndex + 1) % groupKeys.length;

            }, 500);
        }

        function createCard(winner) {
            const div = document.createElement('div');
            div.className = 'winner-card';
            
            // (新增) 判斷是否為加碼 (is_addon)，若是則加上高亮樣式類別
            if (winner.is_addon) {
                div.classList.add('bonus-highlight');
            }

            // 處理公差顯示文字
            let nameDisplay = winner.name;
            if (winner.is_business_trip) {
                nameDisplay += ' <span style="font-size:0.6em; color:#54a0ff;">(公差)</span>';
            }

            div.innerHTML = `
                <div class="winner-name">${nameDisplay}</div>
                <div class="winner-id">${winner.employee_id}</div>
                <div class="winner-number">NO.${winner.lottery_number}</div>
            `;
            return div;
        }

        function startLoop() {
            if (timer) clearInterval(timer);
            timer = setInterval(renderCurrentGroup, intervalTime);
        }

        function resetProgressBar() {
            progressBar.style.transition = 'none';
            progressBar.style.width = '0%';
            void progressBar.offsetWidth; 
            progressBar.style.transition = `width ${intervalTime}ms linear`;
            progressBar.style.width = '100%';
        }

        function fitCardsToScreen() {
            const containerHr = listHrEl;
            const containerFac = listFacEl;
            let size = 1.2; 
            const minSize = 0.5;
            
            for (let i = 0; i < 40; i++) {
                const overflowHr = containerHr.scrollHeight > containerHr.clientHeight;
                const overflowFac = containerFac.scrollHeight > containerFac.clientHeight;
                if (!overflowHr && !overflowFac) break;
                size -= 0.05;
                if (size < minSize) { size = minSize; break; }
                document.documentElement.style.setProperty('--card-base-size', `${size}rem`);
            }
        }
        
        window.addEventListener('resize', fitCardsToScreen);

    </script>
</body>
</html>
