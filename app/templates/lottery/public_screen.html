<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公獎 - 終極大抽獎</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --card-base-size: 1rem; }
        /* 修改後的公獎背景樣式 */
        body {
            /* 使用深紅到亮紅的放射漸層，並帶一點金色的光輝感 */
            background: radial-gradient(circle at center, #ff4b2b, #ff416c, #8b0000); 
            background-attachment: fixed;
            height: 100vh; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 為了搭配紅色背景，建議將控制區的背景調深 */
        .controls { 
            padding: 10px; 
            text-align: center; 
            background: rgba(0, 0, 0, 0.6); /* 增加遮罩感 */
            backdrop-filter: blur(5px); 
            flex-shrink: 0; 
        }

        /* 標題的光暈可以調成偏金黃色 */
        .main-title { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 2.2rem; 
            text-shadow: 0 0 20px rgba(255, 215, 0, 1); /* 金色強光 */
            margin: 0; 
        }
        
        .prize-select-group { position: relative; width: 400px; max-width: 90vw; }
        .prize-select {
            background: transparent; 
            border: none; 
            border-bottom: 2px solid #ffd700;
            color: #ffd700; 
            text-align: center; 
            font-size: 2rem; 
            font-weight: bold;
            width: 100%; 
            padding: 5px 10px;
            cursor: pointer;
            text-align-last: center; 
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFD700%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 15px auto;
        }
        .prize-select:focus { outline: none; background-color: rgba(255, 215, 0, 0.1); }
        .prize-select option { background-color: #1a2a6c; color: #fff; font-size: 1.2rem; }

        /* 卡片顯示區 */
        .digit-stage { display: flex; justify-content: center; gap: 15px; margin: 10px 0; flex-shrink: 0; }
        .digit-card {
            width: 120px; height: 160px; background: rgba(0,0,0,0.5);
            border: 4px solid #FFD700; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; transition: all 0.3s; box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        /* 當輸入數字時亮起 */
        .digit-card.active { border-color: #00ffea; box-shadow: 0 0 30px #00ffea; background: rgba(0,0,0,0.8); transform: scale(1.05); }
        .digit-value { font-family: 'Orbitron', sans-serif; font-size: 5rem; font-weight: 900; color: #fff; }
        .digit-label { position: absolute; top: 8px; font-size: 0.8rem; color: #aaa; text-transform: uppercase; }

        .result-area {
            flex-grow: 1; margin: 0 auto 10px auto; width: 95%;
            background: rgba(255,255,255,0.05); border-radius: 15px; padding: 10px;
            overflow: hidden; display: flex; flex-wrap: wrap; justify-content: center; 
            align-content: flex-start; gap: 0.5em; border: 1px solid rgba(255,255,255,0.1);
        }
        .candidate-card {
            background: linear-gradient(135deg, #ffffff 0%, #e6e6e6 100%); color: #333;
            width: 12em; padding: 0.8em; font-size: var(--card-base-size); 
            border-radius: 0.5em; text-align: center; box-shadow: 0 0.2em 0.5em rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease; height: fit-content; display: flex; flex-direction: column; justify-content: center;
        }
        .candidate-card h4 { margin: 0; font-weight: bold; font-size: 1.2em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .candidate-card span { font-family: 'Orbitron'; color: #d63031; font-weight: bold; font-size: 1.4em; display: block; margin-top: 0.2em; }
        .candidate-info { font-size: 0.8em; color: #666; margin-top: 0.2em; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .controls { padding: 10px; text-align: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); flex-shrink: 0; }
        .input-wrapper { max-width: 500px; margin: auto; }
        .available-hints { color: #00ffea; font-size: 1rem; margin-top: 5px; min-height: 20px; font-weight: 500; text-shadow: 0 0 5px rgba(0, 255, 234, 0.5); }
        .hint-badge { display: inline-block; padding: 2px 8px; border: 1px solid #00ffea; border-radius: 4px; margin: 0 2px; color: #fff; background: rgba(0, 255, 234, 0.2); }
        .modal-content { border: 2px solid #FFD700; background: #222; color: #fff;}
        .info-bar { width: 100%; text-align: center; color: #fff; margin-bottom: 5px; font-weight: bold; font-size: 1.2rem; flex-shrink: 0; }
    </style>
</head>
<body>

    <header>
        <h1 class="main-title">PUBLIC PRIZE DRAW</h1>
        <div class="prize-select-group">
            <select id="prize-select" class="prize-select">
                <option value="" disabled selected>載入獎項中...</option>
            </select>
        </div>
    </header>

    <div class="digit-stage">
        <div class="digit-card" id="card-100"><div class="digit-label">Hundred</div><div class="digit-value">?</div></div>
        <div class="digit-card" id="card-10"><div class="digit-label">Ten</div><div class="digit-value">?</div></div>
        <div class="digit-card" id="card-1"><div class="digit-label">Unit</div><div class="digit-value">?</div></div>
    </div>
    
    <div class="info-bar" id="count-info"></div>

    <div class="result-area" id="result-list">
        <div class="text-center w-100 text-white-50 mt-5" style="font-size: 1.5rem;">
            等待開始抽獎...
        </div>
    </div>

    <div class="controls">
        <div class="input-wrapper">
            <div class="input-group input-group-lg">
                <span class="input-group-text bg-dark text-white border-secondary">輸入號碼</span>
                <input type="text" class="form-control bg-dark text-white border-secondary text-center fw-bold" 
                       style="font-size: 1.5rem;" id="digit-input" placeholder="000-999" maxlength="3">
                <button class="btn btn-warning fw-bold px-4" id="btn-reveal">揭曉</button>
            </div>
            <div class="available-hints" id="hint-area">請輸入 3 位數抽獎編號</div>
        </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning"><i class="bi bi-trophy-fill me-2"></i>中獎確認</h5>
                </div>
                <div class="modal-body text-center">
                    <h5 class="text-info mb-3" id="final-prize-display"></h5>
                    <h2 class="fw-bold mb-3" id="final-winner-name"></h2>
                    <h4 class="text-muted" id="final-winner-id"></h4>
                    <div class="display-3 text-warning fw-bold my-4" style="font-family: 'Orbitron'" id="final-winner-num"></div>
                </div>
                <div class="modal-footer border-secondary justify-content-center">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消 (重抽)</button>
                    <button type="button" class="btn btn-warning btn-lg px-5 fw-bold" id="btn-confirm-save">確認並存檔</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentCandidates = []; 
        let finalWinner = null;

        const inputEl = document.getElementById('digit-input');
        const btnReveal = document.getElementById('btn-reveal');
        const listEl = document.getElementById('result-list');
        const hintArea = document.getElementById('hint-area');
        const countInfoEl = document.getElementById('count-info');
        const prizeSelect = document.getElementById('prize-select');

        const card100 = document.getElementById('card-100');
        const card10 = document.getElementById('card-10');
        const card1 = document.getElementById('card-1');

        const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));
        const btnSave = document.getElementById('btn-confirm-save');

        // 初始化
        loadPublicPrizes();
        inputEl.focus();
        window.addEventListener('resize', fitCardsToScreen);

        // (新增) 監聽輸入框：即時將數字同步到上方卡片
        inputEl.addEventListener('input', (e) => {
            // 限制只能輸入數字
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
            const val = e.target.value;

            // 更新卡片文字
            card100.querySelector('.digit-value').innerText = val[0] || '?';
            card10.querySelector('.digit-value').innerText = val[1] || '?';
            card1.querySelector('.digit-value').innerText = val[2] || '?';
            
            // 更新卡片亮起特效
            card100.classList.toggle('active', !!val[0]);
            card10.classList.toggle('active', !!val[1]);
            card1.classList.toggle('active', !!val[2]);
        });

        // 監聽 Enter
        inputEl.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') btnReveal.click();
        });
        
        // 選單變更時重置
        prizeSelect.addEventListener('change', function() {
            resetScreen();
        });

        function resetScreen() {
            currentCandidates = [];
            finalWinner = null;
            
            // 重置卡片
            card100.querySelector('.digit-value').innerText = '?';
            card10.querySelector('.digit-value').innerText = '?';
            card1.querySelector('.digit-value').innerText = '?';
            document.querySelectorAll('.digit-card').forEach(c => c.classList.remove('active'));
            
            listEl.innerHTML = '<div class="text-center w-100 text-white-50 mt-5" style="font-size: 1.5rem;">等待開始抽獎...</div>';
            countInfoEl.innerText = '';
            
            inputEl.value = '';
            inputEl.disabled = false;
            btnReveal.disabled = false;
            btnReveal.innerText = "揭曉";
            hintArea.innerText = "請輸入 3 位數抽獎編號";
            
            inputEl.focus();
        }

        async function loadPublicPrizes() {
            try {
                const res = await fetch("{{ url_for('lottery.api_get_prizes', type='public') }}");
                const data = await res.json();
                
                prizeSelect.innerHTML = '<option value="" disabled selected>請選擇獎項</option>';
                
                if (data.success && data.prizes.length > 0) {
                    data.prizes.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.name;
                        if (p.remaining > 0) {
                            opt.innerText = `${p.name} (剩 ${p.remaining} / ${p.quantity})`;
                        } else {
                            opt.innerText = `${p.name} (已全數抽出)`;
                            opt.disabled = true;
                            opt.style.color = "#aaa";
                        }
                        prizeSelect.appendChild(opt);
                    });
                } else {
                    prizeSelect.innerHTML = '<option disabled>(未設定公獎)</option>';
                }
            } catch (e) { 
                console.error(e);
                prizeSelect.innerHTML = '<option disabled>載入失敗</option>';
            }
        }

        // (核心修改) 揭曉按鈕邏輯
        btnReveal.addEventListener('click', async () => {
            if (!prizeSelect.value) {
                alert("請先選擇要抽出的「公獎獎項」！");
                prizeSelect.focus();
                return;
            }

            const val = inputEl.value;
            // 強制檢查 3 碼
            if (val.length !== 3) {
                alert("請輸入完整的 3 位數號碼！");
                inputEl.focus();
                return;
            }

            hintArea.innerHTML = '<span class="text-muted small">查詢中...</span>';

            try {
                // 直接送出完整 3 碼給後端 API
                const res = await fetch("{{ url_for('lottery.api_public_search') }}", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ digits: val })
                });
                const data = await res.json();

                if (data.success) {
                    if (data.count === 0) {
                        hintArea.innerHTML = '<span class="text-danger">❌ 查無此號</span>';
                        alert(`輸入 ${val} 找不到符合資格的人員！`);
                        inputEl.select(); // 選取文字方便重打
                        return;
                    }

                    // 找到人，顯示並鎖定
                    currentCandidates = data.candidates;
                    renderCandidates(data.candidates);
                    finishDraw(); // 進入結算流程
                } else {
                    alert(data.message);
                }
            } catch (e) { alert("API 錯誤"); }
        });

        function renderCandidates(list) {
            listEl.innerHTML = '';
            if (list.length > 0) {
                countInfoEl.innerHTML = `目前符合人數：<span class="text-warning">${list.length}</span> 人`;
            } else {
                countInfoEl.innerHTML = '';
            }

            document.documentElement.style.setProperty('--card-base-size', '1rem');

            list.forEach(p => {
                const div = document.createElement('div');
                div.className = 'candidate-card';
                
                // (*** 修改：加入公差標示 ***)
                let bizTag = '';
                if (p.is_business_trip) {
                    bizTag = '<span style="color:#d63031; font-size:0.7em; margin-left:5px;">(公差)</span>';
                }

                div.innerHTML = `
                    <h4>${p.name}${bizTag}</h4>
                    <div class="candidate-info">${p.site || '未知單位'}</div>
                    <span>${p.lottery_number}</span>
                    <div class="candidate-info">${p.employee_id}</div>
                `;
                listEl.appendChild(div);
            });
            setTimeout(fitCardsToScreen, 0);
        }

        function fitCardsToScreen() {
            const container = listEl;
            if (container.children.length === 0) return;
            let size = 1.2; 
            const minSize = 0.3; 
            
            for (let i = 0; i < 40; i++) {
                if (container.scrollHeight <= container.clientHeight) break; 
                size -= 0.05; 
                if (size < minSize) { size = minSize; break; }
                document.documentElement.style.setProperty('--card-base-size', `${size}rem`);
            }
        }

        function finishDraw() {
            inputEl.disabled = true;
            btnReveal.disabled = true;
            btnReveal.innerText = "抽獎完成";
            hintArea.innerHTML = '<span class="text-success">🎉 鎖定中獎者</span>';
            
            // 確保卡片保持亮起
            document.querySelectorAll('.digit-card').forEach(c => c.classList.add('active'));

            if (currentCandidates.length === 1) {
                finalWinner = currentCandidates[0];
                setTimeout(() => { showConfirmModal(finalWinner); }, 800);
            } else if (currentCandidates.length > 1) {
                // 若有多人 (例如同號，雖然不常見)，預設選第一位
                alert(`注意：系統找到 ${currentCandidates.length} 位符合者，將自動選取第一位。`);
                finalWinner = currentCandidates[0];
                setTimeout(() => { showConfirmModal(finalWinner); }, 1000);
            }
        }

        function showConfirmModal(winner) {

            let nameDisplay = winner.name;
                    
            // (*** 修改：加入公差文字 ***)
            if (winner.is_business_trip) {
                nameDisplay += " (公差)";
            }
            document.getElementById('final-winner-name').innerText = winner.name;
            document.getElementById('final-winner-id').innerText = winner.employee_id;
            document.getElementById('final-winner-num').innerText = winner.lottery_number;
            document.getElementById('final-prize-display').innerText = `【 ${prizeSelect.value} 】`;
            confirmModal.show();
        }

        btnSave.addEventListener('click', async () => {
            if (!finalWinner) return;
            try {
                const res = await fetch("{{ url_for('lottery.api_public_confirm') }}", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        employee_id: finalWinner.employee_id,
                        prize_name: prizeSelect.value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    confirmModal.hide();
                    if(confirm("恭喜中獎！是否重新整理以進行下一輪？")) {
                        location.reload();
                    }
                } else {
                    alert(data.message);
                }
            } catch (e) {
                alert("儲存錯誤: " + e);
            }
        });
    </script>
</body>
</html>
