<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公獎 - 終極大抽獎</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at center, #1a2a6c, #b21f1f, #fdbb2d); 
            height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
        }
        
        /* Header 調整：容納輸入框 */
        header { 
            padding: 15px; text-align: center; flex-shrink: 0; 
            background: rgba(0,0,0,0.2);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .main-title { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; text-shadow: 0 0 20px rgba(255,215,0,0.8); margin: 0; }
        
        /* 獎項輸入框樣式 */
        .prize-input-group { position: relative; width: 300px; }
        #prize-name-input {
            background: transparent; border: none; border-bottom: 2px solid #ffd700;
            color: #ffd700; text-align: center; font-size: 1.5rem; font-weight: bold;
            width: 100%; padding: 5px;
        }
        #prize-name-input:focus { outline: none; border-bottom: 2px solid #fff; }
        #prize-name-input::placeholder { color: rgba(255, 215, 0, 0.5); }

        /* 數字顯示區 */
        .digit-stage {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-shrink: 0;
        }
        .digit-card {
            width: 150px; height: 200px;
            background: rgba(0,0,0,0.5);
            border: 4px solid #FFD700; 
            border-radius: 15px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .digit-card.active { 
            border-color: #00ffea; box-shadow: 0 0 30px #00ffea; background: rgba(0,0,0,0.8); transform: scale(1.05);
        }
        .digit-value { font-family: 'Orbitron', sans-serif; font-size: 6rem; font-weight: 900; color: #fff; }
        .digit-label { position: absolute; top: 10px; font-size: 1rem; color: #aaa; text-transform: uppercase; }

        /* 名單顯示區 */
        .result-area {
            flex-grow: 1; margin: 10px auto; width: 90%;
            background: rgba(255,255,255,0.1); border-radius: 20px; padding: 20px;
            overflow-y: auto; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .candidate-card {
            background: linear-gradient(135deg, #ffffff 0%, #e6e6e6 100%);
            color: #333; width: 220px; padding: 15px; border-radius: 10px; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); animation: fadeIn 0.5s ease; height: fit-content;
        }
        .candidate-card h4 { margin: 0; font-weight: bold; font-size: 1.2rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .candidate-card span { font-family: 'Orbitron'; color: #d63031; font-weight: bold; font-size: 1.5rem; display: block; margin-top: 5px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 控制區 */
        .controls { padding: 15px; text-align: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); flex-shrink: 0; }
        .input-wrapper { max-width: 500px; margin: auto; }
        
        /* 可用號碼提示 */
        .available-hints {
            color: #00ffea; font-size: 1.1rem; margin-top: 10px; min-height: 24px;
            font-weight: 500; text-shadow: 0 0 5px rgba(0, 255, 234, 0.5);
        }
        .hint-badge {
            display: inline-block; padding: 2px 8px; border: 1px solid #00ffea; border-radius: 4px;
            margin: 0 2px; color: #fff; background: rgba(0, 255, 234, 0.2);
        }

        /* Modal */
        .modal-content { border: 2px solid #FFD700; background: #222; color: #fff;}
        .winner-mode .digit-card { border-color: #FFD700; color: #FFD700; }
    </style>
</head>
<body>

    <header>
        <h1 class="main-title">PUBLIC PRIZE DRAW</h1>
        <div class="prize-input-group">
            <input type="text" id="prize-name-input" value="公獎" placeholder="請輸入獎項名稱">
            <i class="bi bi-pencil-fill position-absolute text-white-50" style="right: 5px; top: 10px; font-size: 0.8rem;"></i>
        </div>
    </header>

    <div class="digit-stage">
        <div class="digit-card" id="card-100">
            <div class="digit-label">Hundred</div>
            <div class="digit-value">?</div>
        </div>
        <div class="digit-card" id="card-10">
            <div class="digit-label">Ten</div>
            <div class="digit-value">?</div>
        </div>
        <div class="digit-card" id="card-1">
            <div class="digit-label">Unit</div>
            <div class="digit-value">?</div>
        </div>
    </div>

    <div class="result-area" id="result-list">
        <div class="text-center w-100 text-white-50 mt-5">
            <h3>等待開始抽獎...</h3>
        </div>
    </div>

    <div class="controls">
        <div class="input-wrapper">
            <div class="input-group input-group-lg">
                <span class="input-group-text bg-dark text-white border-secondary">輸入號碼</span>
                <input type="text" class="form-control bg-dark text-white border-secondary text-center fw-bold" 
                       style="font-size: 1.5rem;" id="digit-input" placeholder="0-9" maxlength="1">
                <button class="btn btn-warning fw-bold px-4" id="btn-reveal">揭曉</button>
            </div>
            
            <div class="available-hints" id="hint-area">
                正在讀取可用號碼...
            </div>
        </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning"><i class="bi bi-trophy-fill me-2"></i>中獎確認</h5>
                </div>
                <div class="modal-body text-center">
                    <h5 class="text-info mb-3" id="final-prize-display"></h5>
                    
                    <h2 class="fw-bold mb-3" id="final-winner-name"></h2>
                    <h4 class="text-muted" id="final-winner-id"></h4>
                    <div class="display-3 text-warning fw-bold my-4" style="font-family: 'Orbitron'" id="final-winner-num"></div>
                </div>
                <div class="modal-footer border-secondary justify-content-center">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消 (重抽)</button>
                    <button type="button" class="btn btn-warning btn-lg px-5 fw-bold" id="btn-confirm-save">確認並存檔</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentStep = 1; // 1=百, 2=十, 3=個
        let confirmedDigits = ""; 
        let currentCandidates = []; 
        let finalWinner = null;

        const inputEl = document.getElementById('digit-input');
        const btnReveal = document.getElementById('btn-reveal');
        const listEl = document.getElementById('result-list');
        const hintArea = document.getElementById('hint-area');
        const prizeNameInput = document.getElementById('prize-name-input');
        
        const card100 = document.getElementById('card-100');
        const card10 = document.getElementById('card-10');
        const card1 = document.getElementById('card-1');

        const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));
        const btnSave = document.getElementById('btn-confirm-save');

        // 初始化
        updateActiveCard();
        fetchAvailableDigits(""); // 初始載入百位數可用號碼
        inputEl.focus();

        inputEl.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') btnReveal.click();
        });
        
        inputEl.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        // --- (3) 核心功能：查詢可用號碼 ---
        async function fetchAvailableDigits(prefix) {
            hintArea.innerHTML = '<span class="text-muted small">查詢中...</span>';
            try {
                const res = await fetch("{{ url_for('lottery.api_public_available_digits') }}", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prefix: prefix })
                });
                const data = await res.json();
                
                if (data.success && data.digits) {
                    if (data.digits.length === 0) {
                        hintArea.innerHTML = '<span class="text-danger">⚠️ 無符合號碼 (請檢查前一位)</span>';
                    } else {
                        // 產生漂亮的提示
                        const badges = data.digits.map(d => `<span class="hint-badge">${d}</span>`).join('');
                        hintArea.innerHTML = `可抽號碼：${badges}`;
                    }
                }
            } catch (e) {
                console.error(e);
                hintArea.innerText = "無法取得號碼提示";
            }
        }

        btnReveal.addEventListener('click', async () => {
            const val = inputEl.value;
            if (val === "") return alert("請輸入號碼");

            const nextDigit = val;
            const tempSearchStr = confirmedDigits + nextDigit;

            try {
                const res = await fetch("{{ url_for('lottery.api_public_search') }}", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ digits: tempSearchStr })
                });
                const data = await res.json();

                if (data.success) {
                    if (data.count === 0) {
                        alert(`輸入 ${nextDigit} 後找不到符合的人！請參考下方的可抽號碼重抽。`);
                        inputEl.value = '';
                        inputEl.focus();
                        return;
                    }

                    // 成功推進
                    confirmedDigits += nextDigit;
                    currentCandidates = data.candidates;
                    
                    updateDigitDisplay(nextDigit);
                    renderCandidates(data.candidates);

                    if (currentStep < 3) {
                        currentStep++;
                        inputEl.value = '';
                        updateActiveCard();
                        inputEl.focus();
                        // (4) 成功後，立刻查詢下一位的可用號碼
                        fetchAvailableDigits(confirmedDigits);
                    } else {
                        finishDraw();
                    }

                } else {
                    alert(data.message);
                }
            } catch (e) {
                alert("API 錯誤");
            }
        });

        function updateActiveCard() {
            document.querySelectorAll('.digit-card').forEach(c => c.classList.remove('active'));
            if (currentStep === 1) card100.classList.add('active');
            else if (currentStep === 2) card10.classList.add('active');
            else if (currentStep === 3) card1.classList.add('active');
        }

        function updateDigitDisplay(digit) {
            if (currentStep === 1) card100.querySelector('.digit-value').innerText = digit;
            else if (currentStep === 2) card10.querySelector('.digit-value').innerText = digit;
            else if (currentStep === 3) card1.querySelector('.digit-value').innerText = digit;
        }

        function renderCandidates(list) {
            listEl.innerHTML = '';
            if(list.length === 0) return;

            // 顯示剩餘人數
            const info = document.createElement('div');
            info.className = "w-100 text-center text-white mt-3 mb-3 fw-bold";
            info.innerHTML = `<h3>目前符合人數：<span class="text-warning">${list.length}</span> 人</h3>`;
            listEl.appendChild(info);

            list.forEach(p => {
                const div = document.createElement('div');
                div.className = 'candidate-card';
                div.innerHTML = `
                    <h4>${p.name}</h4>
                    <div class="text-muted small mb-1">${p.site || '未知單位'}</div>
                    <span>${p.lottery_number}</span>
                    <div class="text-muted small mt-1" style="font-size:0.8rem">${p.employee_id}</div>
                `;
                listEl.appendChild(div);
            });
        }

        function finishDraw() {
            inputEl.disabled = true;
            btnReveal.disabled = true;
            btnReveal.innerText = "抽獎完成";
            hintArea.innerHTML = '<span class="text-success">🎉 鎖定中獎者</span>';
            
            if (currentCandidates.length === 1) {
                finalWinner = currentCandidates[0];
                setTimeout(() => { showConfirmModal(finalWinner); }, 800);
            } else if (currentCandidates.length > 1) {
                alert(`注意：仍有 ${currentCandidates.length} 人符合！系統自動選取第一位。`);
                finalWinner = currentCandidates[0];
                setTimeout(() => { showConfirmModal(finalWinner); }, 1000);
            }
        }

        function showConfirmModal(winner) {
            document.getElementById('final-winner-name').innerText = winner.name;
            document.getElementById('final-winner-id').innerText = winner.employee_id;
            document.getElementById('final-winner-num').innerText = winner.lottery_number;
            // 顯示當前輸入的獎項名稱
            document.getElementById('final-prize-display').innerText = `【 ${prizeNameInput.value} 】`;
            confirmModal.show();
        }

        btnSave.addEventListener('click', async () => {
            if (!finalWinner) return;

            try {
                const res = await fetch("{{ url_for('lottery.api_public_confirm') }}", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        employee_id: finalWinner.employee_id,
                        // (5) 傳送使用者輸入的獎項名稱
                        prize_name: prizeNameInput.value 
                    })
                });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    confirmModal.hide();
                    if(confirm("恭喜中獎！是否重新整理以進行下一輪？")) {
                        location.reload();
                    }
                } else {
                    alert(data.message);
                }
            } catch (e) {
                alert("儲存錯誤: " + e);
            }
        });
    </script>
</body>
</html>
