<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公獎 - 終極大抽獎</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        body {
            /* 背景改為比較大氣的深藍紅漸層 */
            background: radial-gradient(circle at center, #1a2a6c, #b21f1f, #fdbb2d); 
            height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
        }
        
        header { padding: 20px; text-align: center; flex-shrink: 0; }
        .main-title { font-family: 'Orbitron', sans-serif; font-size: 3rem; text-shadow: 0 0 20px rgba(255,215,0,0.8); margin: 0; }
        #prize-title { color: #ffd700; font-weight: bold; margin-top: 10px; }

        /* 數字顯示區 */
        .digit-stage {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-shrink: 0;
        }
        .digit-card {
            width: 150px; height: 200px;
            background: rgba(0,0,0,0.5);
            /* (*** 修正這裡：原本 #gold 是錯的，改成 gold 或 #FFD700 ***) */
            border: 4px solid #FFD700; 
            border-radius: 15px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        
        /* 當前輸入焦點的特效 */
        .digit-card.active { 
            border-color: #00ffea; 
            box-shadow: 0 0 30px #00ffea; 
            background: rgba(0,0,0,0.8); 
            transform: scale(1.05);
        }
        
        .digit-value { font-family: 'Orbitron', sans-serif; font-size: 6rem; font-weight: 900; color: #fff; }
        .digit-label { position: absolute; top: 10px; font-size: 1rem; color: #aaa; text-transform: uppercase; }

        /* 名單顯示區 */
        .result-area {
            flex-grow: 1;
            margin: 10px auto;
            width: 90%;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            overflow-y: auto; /* 允許垂直捲動 */
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-start;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .candidate-card {
            background: linear-gradient(135deg, #ffffff 0%, #e6e6e6 100%);
            color: #333;
            width: 220px; /* 稍微加寬 */
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease;
            height: fit-content;
        }
        .candidate-card h4 { margin: 0; font-weight: bold; font-size: 1.2rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .candidate-card span { font-family: 'Orbitron'; color: #d63031; font-weight: bold; font-size: 1.5rem; display: block; margin-top: 5px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 控制區 */
        .controls { padding: 20px; text-align: center; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); flex-shrink: 0; }
        .input-group-lg { max-width: 500px; margin: auto; }
        
        /* 最終中獎確認視窗的特效 */
        .modal-content { border: 2px solid #FFD700; }
        .winner-mode .digit-card { border-color: #FFD700; color: #FFD700; }
    </style>
</head>
<body>

    <header>
        <h1 class="main-title">PUBLIC PRIZE DRAW</h1>
        <div class="h3" id="prize-title">公獎</div>
    </header>

    <div class="digit-stage">
        <div class="digit-card" id="card-100">
            <div class="digit-label">Hundred</div>
            <div class="digit-value">?</div>
        </div>
        <div class="digit-card" id="card-10">
            <div class="digit-label">Ten</div>
            <div class="digit-value">?</div>
        </div>
        <div class="digit-card" id="card-1">
            <div class="digit-label">Unit</div>
            <div class="digit-value">?</div>
        </div>
    </div>

    <div class="result-area" id="result-list">
        <div class="text-center w-100 text-white-50 mt-5">
            <h3>等待開始抽獎...</h3>
        </div>
    </div>

    <div class="controls">
        <div class="input-group input-group-lg mb-3">
            <span class="input-group-text bg-dark text-white border-secondary">目前輸入</span>
            <input type="text" class="form-control bg-dark text-white border-secondary text-center fw-bold" 
                   style="font-size: 1.5rem;"
                   id="digit-input" placeholder="請輸入 0-9" maxlength="1">
            <button class="btn btn-warning fw-bold px-4" id="btn-reveal">揭曉此位數</button>
        </div>
        <div class="text-white-50 small">
            流程：輸入百位數 → 揭曉 → 輸入十位數 → 揭曉 → 輸入個位數 → 揭曉 (鎖定中獎者)
        </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning"><i class="bi bi-trophy-fill me-2"></i>確認中獎者</h5>
                </div>
                <div class="modal-body text-center text-white">
                    <h2 class="fw-bold mb-3" id="final-winner-name"></h2>
                    <h4 class="text-muted" id="final-winner-id"></h4>
                    <div class="display-3 text-warning fw-bold my-4" style="font-family: 'Orbitron'" id="final-winner-num"></div>
                    <div class="alert alert-info py-2"><small>確認後將寫入資料庫，避免重複中獎</small></div>
                </div>
                <div class="modal-footer border-secondary justify-content-center">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消 (重抽)</button>
                    <button type="button" class="btn btn-warning btn-lg px-5 fw-bold" id="btn-confirm-save">確認寫入紀錄</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentStep = 1; // 1=百, 2=十, 3=個
        let confirmedDigits = ""; // 目前已確認的數字字串
        let currentCandidates = []; // 目前符合的名單
        let finalWinner = null;

        const inputEl = document.getElementById('digit-input');
        const btnReveal = document.getElementById('btn-reveal');
        const listEl = document.getElementById('result-list');
        const card100 = document.getElementById('card-100');
        const card10 = document.getElementById('card-10');
        const card1 = document.getElementById('card-1');
        const prizeTitleEl = document.getElementById('prize-title'); // 如果要動態改獎項名

        const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));
        const btnSave = document.getElementById('btn-confirm-save');

        // 初始化焦點
        updateActiveCard();
        inputEl.focus();

        inputEl.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') btnReveal.click();
        });

        // 限制只能輸入數字
        inputEl.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        btnReveal.addEventListener('click', async () => {
            const val = inputEl.value;
            if (val === "") return alert("請輸入 0-9 的數字");

            // 鎖定當前數字
            const nextDigit = val;
            const tempSearchStr = confirmedDigits + nextDigit;

            // 呼叫 API 搜尋
            try {
                const res = await fetch("{{ url_for('lottery.api_public_search') }}", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ digits: tempSearchStr })
                });
                const data = await res.json();

                if (data.success) {
                    if (data.count === 0) {
                        alert(`數字 ${tempSearchStr}... 沒有人符合！請重新輸入或確認號碼。`);
                        inputEl.value = '';
                        inputEl.focus();
                        return;
                    }

                    // 成功：更新狀態
                    confirmedDigits += nextDigit;
                    currentCandidates = data.candidates;
                    
                    // 更新 UI 顯示數字
                    updateDigitDisplay(nextDigit);
                    
                    // 更新名單
                    renderCandidates(data.candidates);

                    // 準備下一步
                    if (currentStep < 3) {
                        currentStep++;
                        inputEl.value = '';
                        inputEl.placeholder = (currentStep === 2) ? "輸入十位數" : "輸入個位數";
                        updateActiveCard();
                        inputEl.focus();
                    } else {
                        // 結束了 (個位數揭曉)
                        finishDraw();
                    }

                } else {
                    alert(data.message);
                }
            } catch (e) {
                console.error(e);
                alert("搜尋 API 發生錯誤");
            }
        });

        function updateActiveCard() {
            // 移除所有 active
            document.querySelectorAll('.digit-card').forEach(c => c.classList.remove('active'));
            
            if (currentStep === 1) card100.classList.add('active');
            else if (currentStep === 2) card10.classList.add('active');
            else if (currentStep === 3) card1.classList.add('active');
        }

        function updateDigitDisplay(digit) {
            if (currentStep === 1) card100.querySelector('.digit-value').innerText = digit;
            else if (currentStep === 2) card10.querySelector('.digit-value').innerText = digit;
            else if (currentStep === 3) card1.querySelector('.digit-value').innerText = digit;
        }

        function renderCandidates(list) {
            listEl.innerHTML = '';
            
            if(list.length === 0) {
                listEl.innerHTML = '<div class="text-white-50 w-100 text-center mt-5">沒有符合條件的人員</div>';
                return;
            }

            list.forEach(p => {
                const div = document.createElement('div');
                div.className = 'candidate-card';
                div.innerHTML = `
                    <h4>${p.name}</h4>
                    <div class="text-muted small mb-1">${p.site || '未知單位'}</div>
                    <span>${p.lottery_number}</span>
                    <div class="text-muted small mt-1" style="font-size:0.8rem">${p.employee_id}</div>
                `;
                listEl.appendChild(div);
            });
            
            // 顯示剩餘人數
            const info = document.createElement('div');
            info.className = "w-100 text-center text-white mt-3 fw-bold";
            info.style.textShadow = "0 2px 4px rgba(0,0,0,0.5)";
            info.innerHTML = `<h3>目前符合人數：<span class="text-warning">${list.length}</span> 人</h3>`;
            listEl.prepend(info); // 放最上面
        }

        function finishDraw() {
            inputEl.disabled = true;
            btnReveal.disabled = true;
            btnReveal.innerText = "抽獎完成";
            
            // 邏輯判斷
            if (currentCandidates.length === 1) {
                finalWinner = currentCandidates[0];
                setTimeout(() => {
                    showConfirmModal(finalWinner);
                }, 800);
            } else if (currentCandidates.length > 1) {
                alert(`注意：目前號碼 ${confirmedDigits} 仍有 ${currentCandidates.length} 人符合！\n\n系統將自動選出第一位，或請您重新整理頁面重抽。`);
                // 這裡暫時取第一個當作 Demo
                finalWinner = currentCandidates[0];
                setTimeout(() => { showConfirmModal(finalWinner); }, 1000);
            }
        }

        function showConfirmModal(winner) {
            document.getElementById('final-winner-name').innerText = winner.name;
            document.getElementById('final-winner-id').innerText = winner.employee_id;
            document.getElementById('final-winner-num').innerText = winner.lottery_number;
            confirmModal.show();
        }

        btnSave.addEventListener('click', async () => {
            if (!finalWinner) return;

            try {
                const res = await fetch("{{ url_for('lottery.api_public_confirm') }}", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        employee_id: finalWinner.employee_id,
                        prize_name: "公獎" 
                    })
                });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    confirmModal.hide();
                    // 重新整理
                    if(confirm("恭喜中獎！是否重新整理頁面以進行下一輪？")) {
                        location.reload();
                    }
                } else {
                    alert(data.message);
                }
            } catch (e) {
                alert("儲存錯誤: " + e);
            }
        });

    </script>
</body>
</html>
