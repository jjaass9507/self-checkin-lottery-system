<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公獎抽獎</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ocean.css') }}?v=20261118">
    <style>
        :root { --card-base-size: 16px; /* JS 會依人數動態調整 */ }
        body { overflow: hidden; }
        .screen { height: 100vh; display: flex; flex-direction: column; }

        header { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 26px 20px 0; }
        .title { font: 800 18px var(--num-font); letter-spacing: .4em; }
        .prize-select { min-width: 460px; max-width: 92vw; height: 62px; padding: 0 26px; text-align: center; text-align-last: center; border-radius: 999px; background: rgba(242, 196, 109, .1); border: 1px solid rgba(255, 227, 163, .55); color: var(--gold); font: 900 30px 'Noto Sans TC', sans-serif; outline: none; cursor: pointer; }
        .prize-select:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(242, 196, 109, .18); }
        .prize-select option:disabled { color: #6b8796; }

        .digit-stage { flex-shrink: 0; display: flex; justify-content: center; gap: 34px; margin: 26px 0 10px; }
        .digit-card { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .porthole { position: relative; width: 200px; height: 200px; border-radius: 50%; padding: 12px; background: conic-gradient(from 40deg, #6f5420, #FFE3A3, #a37a2f, #FFF1C9, #7d5f25, #E9C98A, #6f5420); box-shadow: 0 20px 50px rgba(0, 0, 0, .5); transition: box-shadow .3s; }
        .digit-card.active .porthole { box-shadow: 0 0 34px rgba(126, 240, 224, .35), 0 20px 50px rgba(0, 0, 0, .5); }
        .digit-card.locked .porthole { box-shadow: 0 0 60px rgba(242, 196, 109, .6), 0 20px 50px rgba(0, 0, 0, .5); }
        .rivet { position: absolute; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFF6DA, #8a6a2c); }
        .glass-eye { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 28%, rgba(255, 255, 255, .28), rgba(18, 80, 122, .6) 32%, #031427 78%); box-shadow: inset 0 10px 30px rgba(0, 0, 0, .6), inset 0 -8px 20px rgba(126, 240, 224, .18); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .digit-value { font: 800 96px/1 var(--num-font); color: rgba(190, 245, 255, .25); transition: color .2s, text-shadow .2s; }
        .digit-card.active .digit-value { color: #fff; text-shadow: 0 0 24px rgba(126, 240, 224, .7); }
        .digit-card.rolling .digit-value { color: #fff; text-shadow: 0 0 12px rgba(190, 245, 255, .9); opacity: .85; }
        .digit-card.locked .digit-value { color: #fff; text-shadow: 0 0 30px rgba(242, 196, 109, .9); }
        .digit-label { font: 600 11px var(--num-font); letter-spacing: .4em; color: var(--dim); }

        .info-bar { flex-shrink: 0; text-align: center; font-size: 18px; color: var(--muted); min-height: 26px; }
        .info-bar b { color: var(--gold); }

        .result-area { flex: 1; min-height: 0; margin: 8px auto 14px; width: 94%; border-radius: 26px; padding: 16px; overflow: hidden; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 1em; font-size: var(--card-base-size); }
        .waiting { font-size: 22px; color: rgba(190, 245, 255, .45); letter-spacing: .4em; }
        .candidate-card { width: 16.25em; padding: 1.375em; border-radius: 1.5em; background: rgba(60, 52, 30, .55); border: 1px solid rgba(255, 227, 163, .7); text-align: center; box-shadow: 0 0 2.5em rgba(242, 196, 109, .3); animation: rise-big .8s cubic-bezier(.2, .9, .25, 1.15) both; }
        .c-name { font: 900 1.875em 'Noto Sans TC', sans-serif; }
        .c-biz { font-size: .47em; color: #9FD8FF; margin-left: 6px; }
        .c-site { font-size: .875em; color: var(--muted); margin-top: 4px; }
        .c-num { font: 800 2.5em var(--num-font); color: var(--gold); margin-top: 6px; text-shadow: 0 0 20px rgba(242, 196, 109, .6); }
        .c-eid { font: 400 .8125em var(--num-font); color: var(--muted); }

        .controls { flex-shrink: 0; margin: 0 auto 18px; width: min(620px, 92%); display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .input-pill { width: 100%; display: flex; height: 70px; padding: 6px; border-radius: 999px; background: rgba(4, 30, 52, .75); border: 1px solid rgba(190, 245, 255, .26); }
        .input-pill:focus-within { border-color: var(--aqua); }
        .input-pill .lbl { display: flex; align-items: center; padding: 0 20px; font-size: 15px; color: var(--muted); white-space: nowrap; }
        #digit-input { flex: 1; min-width: 0; border: 0; background: transparent; color: #fff; text-align: center; font: 800 30px var(--num-font); letter-spacing: .3em; outline: none; }
        #digit-input:disabled { color: var(--muted); }
        #btn-reveal { padding: 0 34px; border-radius: 999px; font-size: 20px; }
        .hint { font-size: 15px; color: var(--dim); }
        .hint.err { color: var(--error); }
        .hint.ok { color: var(--aqua-2); }

        /* 中獎確認 */
        .modal-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(1, 10, 22, .78); display: flex; align-items: center; justify-content: center; padding: 20px; perspective: 1200px; }
        .modal-frame { position: relative; width: 100%; max-width: 560px; border-radius: 34px; padding: 3px; background: conic-gradient(from 0deg, #6f5420, #FFE3A3, #7EF0E0, #FFF1C9, #a37a2f, #FFE3A3, #6f5420); box-shadow: 0 0 80px rgba(242, 196, 109, .35), 0 40px 100px rgba(0, 0, 0, .6); animation: pop .7s cubic-bezier(.2, .9, .25, 1.2) both; }
        .modal-inner { position: relative; overflow: hidden; border-radius: 31px; background: radial-gradient(120% 80% at 50% 0%, #0F4C72, #04182C 70%); text-align: center; }
        .modal-inner > * { position: relative; }
        .m-head { padding: 28px 24px 0; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--gold); font-weight: 900; font-size: 18px; letter-spacing: .3em; }
        .m-body { padding: 18px 32px 30px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .m-prize { font-size: 20px; color: var(--muted); }
        .m-name { font: 900 56px 'Noto Sans TC', sans-serif; margin-top: 10px; letter-spacing: .08em; }
        .m-biz { font-size: 20px; color: #9FD8FF; margin-left: 8px; letter-spacing: 0; }
        .m-id { font: 400 18px var(--num-font); color: var(--dim); }
        .m-num { font: 800 110px/1 var(--num-font); margin-top: 18px; background: linear-gradient(180deg, #FFF6DA, #F2C46D 55%, #B88A3A); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .m-foot { display: flex; gap: 12px; justify-content: center; padding: 18px 24px 26px; border-top: 1px solid rgba(190, 245, 255, .14); }
        .btn-ghost { height: 54px; padding: 0 24px; border-radius: 999px; border: 1px solid rgba(190, 245, 255, .35); background: transparent; color: var(--ink-2); font-size: 16px; cursor: pointer; white-space: nowrap; }
        #btn-confirm-save { height: 54px; padding: 0 36px; border-radius: 999px; font-size: 17px; letter-spacing: .1em; }

        @media (max-height: 820px) {
            .porthole { width: 150px; height: 150px; padding: 9px; }
            .digit-value { font-size: 72px; }
            .digit-stage { margin-top: 16px; }
        }
    </style>
</head>
<body>
<ocean-scene palette="abyss" intensity="1.1" bubbles="70"></ocean-scene>

<div class="screen ocean-layer">
    <header>
        <span class="title shimmer-text">PUBLIC PRIZE DRAW</span>
        <select id="prize-select" class="prize-select">
            <option value="" disabled selected>載入獎項中...</option>
        </select>
    </header>

    <div class="digit-stage">
        <div class="digit-card" id="card-100"><div class="porthole"><div class="glass-eye"><span class="digit-value">?</span></div></div><span class="digit-label">HUNDRED</span></div>
        <div class="digit-card" id="card-10"><div class="porthole"><div class="glass-eye"><span class="digit-value">?</span></div></div><span class="digit-label">TEN</span></div>
        <div class="digit-card" id="card-1"><div class="porthole"><div class="glass-eye"><span class="digit-value">?</span></div></div><span class="digit-label">UNIT</span></div>
    </div>

    <div class="info-bar" id="count-info"></div>

    <div class="result-area glass-soft" id="result-list">
        <div class="waiting">等待開始抽獎…</div>
    </div>

    <div class="controls">
        <div class="input-pill">
            <span class="lbl">輸入號碼</span>
            <input type="text" id="digit-input" placeholder="000-999" maxlength="3" inputmode="numeric" autocomplete="off">
            <button class="btn-gold" id="btn-reveal" type="button"><span class="sweep"></span><span id="reveal-label">揭曉</span></button>
        </div>
        <div class="hint" id="hint-area">請輸入 3 位數抽獎編號</div>
    </div>
</div>

<div class="modal-backdrop" id="confirm-modal" hidden>
    <div class="modal-frame">
        <div class="modal-inner">
            <span class="sweep faint"></span>
            <div class="m-head"><i class="bi bi-trophy-fill"></i>中獎確認</div>
            <div class="m-body">
                <div class="m-prize" id="final-prize-display"></div>
                <div class="m-name"><span id="final-winner-name"></span><span class="m-biz" id="final-winner-biz" hidden>(公差)</span></div>
                <div class="m-id" id="final-winner-id"></div>
                <div class="m-num" id="final-winner-num"></div>
            </div>
            <div class="m-foot">
                <button type="button" class="btn-ghost" id="btn-redraw">取消 (重抽)</button>
                <button type="button" class="btn-gold" id="btn-confirm-save">確認並存檔</button>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/ocean-fx.js') }}?v=20261118"></script>
<script>
    let currentCandidates = [];
    let finalWinner = null;

    const inputEl = document.getElementById('digit-input');
    const btnReveal = document.getElementById('btn-reveal');
    const revealLabel = document.getElementById('reveal-label');
    const listEl = document.getElementById('result-list');
    const hintArea = document.getElementById('hint-area');
    const countInfoEl = document.getElementById('count-info');
    const prizeSelect = document.getElementById('prize-select');
    const cards = ['card-100', 'card-10', 'card-1'].map(id => document.getElementById(id));
    const digitEls = cards.map(c => c.querySelector('.digit-value'));

    const modal = document.getElementById('confirm-modal');
    const btnSave = document.getElementById('btn-confirm-save');
    const btnRedraw = document.getElementById('btn-redraw');
    const WAITING_HTML = '<div class="waiting">等待開始抽獎…</div>';

    // 舷窗上的鉚釘
    cards.forEach(c => {
        const ph = c.querySelector('.porthole');
        for (let i = 0; i < 10; i++) {
            const a = i / 10 * Math.PI * 2, r = document.createElement('span');
            r.className = 'rivet';
            r.style.left = (50 + Math.cos(a) * 47) + '%';
            r.style.top = (50 + Math.sin(a) * 47) + '%';
            ph.appendChild(r);
        }
    });

    function esc(v) {
        return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fx(opts) { if (window.OceanFX) OceanFX.burst(innerWidth / 2, innerHeight / 2, opts); }
    function setHint(text, kind) { hintArea.innerText = text; hintArea.className = 'hint' + (kind ? ' ' + kind : ''); }

    // 初始化
    loadPublicPrizes();
    inputEl.focus();
    let resizeTimer = null;
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitCardsToScreen, 150); });

    // 輸入框：即時將數字同步到上方舷窗
    inputEl.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
        const val = e.target.value;
        cards.forEach((c, i) => {
            digitEls[i].textContent = val[i] || '?';
            c.classList.toggle('active', !!val[i]);
        });
        if (hintArea.classList.contains('err')) setHint('請輸入 3 位數抽獎編號');
    });

    inputEl.addEventListener('keyup', (e) => { if (e.key === 'Enter') reveal(); });
    btnReveal.addEventListener('click', reveal);
    prizeSelect.addEventListener('change', resetScreen);

    let spinTimer = null, lockTimers = [];
    function stopSpin() { clearInterval(spinTimer); lockTimers.forEach(clearTimeout); lockTimers = []; }

    function resetScreen() {
        stopSpin();
        currentCandidates = [];
        finalWinner = null;
        modal.hidden = true;

        cards.forEach((c, i) => { digitEls[i].textContent = '?'; c.classList.remove('active', 'rolling', 'locked'); });
        listEl.innerHTML = WAITING_HTML;
        countInfoEl.innerText = '';

        inputEl.value = '';
        inputEl.disabled = false;
        btnReveal.disabled = false;
        revealLabel.innerText = "揭曉";
        setHint("請輸入 3 位數抽獎編號");
        inputEl.focus();
    }

    async function loadPublicPrizes() {
        const keep = prizeSelect.value;
        try {
            const res = await fetch("{{ url_for('lottery.api_get_prizes', type='public') }}");
            const data = await res.json();

            prizeSelect.innerHTML = '<option value="" disabled selected>請選擇獎項</option>';
            if (data.success && data.prizes.length > 0) {
                data.prizes.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.name;
                    if (p.remaining > 0) {
                        opt.innerText = `${p.name} (剩 ${p.remaining} / ${p.quantity})`;
                    } else {
                        opt.innerText = `${p.name} (已全數抽出)`;
                        opt.disabled = true;
                    }
                    prizeSelect.appendChild(opt);
                });
                const still = Array.from(prizeSelect.options).find(o => o.value === keep && !o.disabled);
                if (still) prizeSelect.value = keep;
            } else {
                prizeSelect.innerHTML = '<option disabled>(未設定公獎)</option>';
            }
        } catch (e) {
            console.error(e);
            prizeSelect.innerHTML = '<option disabled>載入失敗</option>';
        }
    }

    // 揭曉：查詢 → 三個舷窗一起轉動，由百位到個位依序定格 → 顯示中獎者 → 確認視窗
    async function reveal() {
        if (btnReveal.disabled) return;
        if (!prizeSelect.value) {
            setHint('請先選擇要抽出的「公獎獎項」！', 'err');
            prizeSelect.focus();
            return;
        }
        const val = inputEl.value;
        if (val.length !== 3) {
            setHint('請輸入完整的 3 位數號碼！', 'err');
            inputEl.focus();
            return;
        }

        setHint('查詢中…');
        btnReveal.disabled = true;

        try {
            const res = await fetch("{{ url_for('lottery.api_public_search') }}", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ digits: val })
            });
            const data = await res.json();

            if (!data.success) { setHint(data.message, 'err'); btnReveal.disabled = false; return; }
            if (data.count === 0) {
                setHint(`❌ 查無此號：輸入 ${val} 找不到符合資格的人員`, 'err');
                btnReveal.disabled = false;
                inputEl.select();
                return;
            }

            currentCandidates = data.candidates;
            inputEl.disabled = true;
            revealLabel.innerText = "抽獎完成";
            setHint('開獎中…', 'ok');
            spinThenLock(val, () => {
                renderCandidates(currentCandidates);
                setHint('🎉 鎖定中獎者', 'ok');
                fx({ count: 220, power: 14 });
                finishDraw();
            });
        } catch (e) {
            setHint('API 錯誤，請重試', 'err');
            btnReveal.disabled = false;
        }
    }

    function spinThenLock(val, done) {
        stopSpin();
        if (window.OceanFX && OceanFX.reducedMotion) {
            cards.forEach((c, i) => { digitEls[i].textContent = val[i]; c.classList.add('locked'); });
            return done();
        }
        let locked = 0;
        cards.forEach(c => { c.classList.remove('locked'); c.classList.add('rolling'); });
        spinTimer = setInterval(() => {
            for (let i = locked; i < 3; i++) digitEls[i].textContent = Math.floor(Math.random() * 10);
        }, 55);
        [900, 1600, 2400].forEach((ms, i) => lockTimers.push(setTimeout(() => {
            locked = i + 1;
            digitEls[i].textContent = val[i];
            cards[i].classList.remove('rolling');
            cards[i].classList.add('locked');
            if (i === 2) { clearInterval(spinTimer); done(); }
        }, ms)));
    }

    function renderCandidates(list) {
        countInfoEl.innerHTML = list.length ? `目前符合人數：<b>${list.length}</b> 人` : '';
        listEl.innerHTML = list.map(p => `
            <div class="candidate-card">
                <div class="c-name">${esc(p.name)}${p.is_business_trip ? '<span class="c-biz">(公差)</span>' : ''}</div>
                <div class="c-site">${esc(p.site || '未知單位')}</div>
                <div class="c-num">${esc(p.lottery_number)}</div>
                <div class="c-eid">${esc(p.employee_id)}</div>
            </div>`).join('') || WAITING_HTML;
        fitCardsToScreen();
    }

    // 二分搜尋最大可容納字級
    function fitCardsToScreen() {
        if (!listEl.querySelector('.candidate-card')) return;
        const root = document.documentElement.style;
        const overflow = () => listEl.scrollHeight > listEl.clientHeight + 1;
        let lo = 5, hi = 19;
        root.setProperty('--card-base-size', hi + 'px');
        if (!overflow()) return;
        while (hi - lo > 0.5) {
            const mid = (lo + hi) / 2;
            root.setProperty('--card-base-size', mid + 'px');
            if (overflow()) hi = mid; else lo = mid;
        }
        root.setProperty('--card-base-size', lo + 'px');
    }

    function finishDraw() {
        if (currentCandidates.length > 1) {
            // 若有多人 (例如同號，雖然不常見)，預設選第一位
            alert(`注意：系統找到 ${currentCandidates.length} 位符合者，將自動選取第一位。`);
        }
        finalWinner = currentCandidates[0];
        lockTimers.push(setTimeout(() => showConfirmModal(finalWinner), 1100));
    }

    function showConfirmModal(winner) {
        document.getElementById('final-winner-name').innerText = winner.name;
        document.getElementById('final-winner-biz').hidden = !winner.is_business_trip;
        document.getElementById('final-winner-id').innerText = winner.employee_id;
        document.getElementById('final-winner-num').innerText = winner.lottery_number;
        document.getElementById('final-prize-display').innerText = `【 ${prizeSelect.value} 】`;
        modal.hidden = false;
        btnSave.disabled = false;
        btnSave.focus();
    }

    btnRedraw.addEventListener('click', resetScreen);

    btnSave.addEventListener('click', async () => {
        if (!finalWinner || btnSave.disabled) return;
        btnSave.disabled = true;
        try {
            const res = await fetch("{{ url_for('lottery.api_public_confirm') }}", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    employee_id: finalWinner.employee_id,
                    prize_name: prizeSelect.value
                })
            });
            const data = await res.json();
            if (data.success) {
                fx({ count: 200, gold: .9, power: 13 });
                // 原地重置進行下一輪（不整頁重新整理，背景特效不必重新初始化）
                await loadPublicPrizes();
                resetScreen();
                setHint(`✅ ${data.message}`, 'ok');
            } else {
                alert(data.message);
                btnSave.disabled = false;
            }
        } catch (e) {
            alert("儲存錯誤: " + e);
            btnSave.disabled = false;
        }
    });
</script>
</body>
</html>
