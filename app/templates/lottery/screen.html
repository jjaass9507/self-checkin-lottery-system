<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運抽獎</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(270deg, #0f0c29, #302b63, #24243e);
            background-size: 600% 600%;
            animation: gradient-animation 20s ease infinite;
            color: #fff;
            text-align: center;
            font-family: 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        @keyframes gradient-animation { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        /* 標題區 */
        header { padding: 1rem; flex-shrink: 0; }
        .main-title { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 3.5rem; color: #fff; text-shadow: 0 0 10px #fff, 0 0 20px #f09; margin: 0; }
        #status-bar { color: #aaa; background: rgba(0,0,0,0.3); padding: 0.5rem 1rem; border-radius: 20px; display: inline-block; margin-top: 10px; border: 1px solid #555; }
        #pool-count { color: #00ffea; font-weight: bold; }

        /* 中獎顯示區 (核心修改：左右分欄) */
        main { 
            flex-grow: 1; 
            display: flex; 
            padding: 0 2rem; 
            gap: 2rem; 
            overflow: hidden; 
            position: relative;
        }
        
        .winner-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 1rem;
            overflow-y: auto; /* 允許捲動 */
        }

        .col-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            padding-bottom: 0.5rem;
        }
        .col-title.hr { color: #ff9ff3; }
        .col-title.fac { color: #54a0ff; }

        /* 卡片樣式 */
        .winner-card {
            background: linear-gradient(145deg, #fefde8, #f8d7a0);
            color: #333;
            padding: 0.8rem;
            margin-bottom: 0.8rem;
            border-radius: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            border: 2px solid #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.5);
        }
        
        /* (*** 加碼樣式 ***) */
        .winner-card.addon-card {
            background: linear-gradient(145deg, #ff9ff3, #feca57); /* 紫金配色 */
            border: 3px solid #ff0000;
            box-shadow: 0 0 15px #ff0000;
            transform: scale(1.05);
        }
        .winner-card small { font-size: 0.9rem; font-weight: 500; display: block; opacity: 0.8; }

        @keyframes pop-in { to { opacity: 1; transform: scale(1); } }

        /* 控制區 */
        footer { padding: 1.5rem; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); }
        .controls { max-width: 900px; margin: auto; }
        
        /* 輸入框組 */
        .digit-input-group { display: flex; gap: 10px; justify-content: center; align-items: flex-end; }
        .digit-box { text-align: center; }
        .digit-box label { display: block; color: #ccc; font-size: 0.8rem; margin-bottom: 5px; }
        .digit-box input { 
            width: 80px; height: 80px; 
            font-size: 2.5rem; text-align: center; 
            background: rgba(0,0,0,0.6); color: #fff; 
            border: 2px solid #555; border-radius: 10px;
        }
        .digit-box input:focus { border-color: #00ffea; box-shadow: 0 0 15px rgba(0,255,234,0.5); outline: none; }
        
        #draw-btn { 
            height: 80px; font-size: 1.8rem; font-weight: bold; 
            padding: 0 40px; border-radius: 10px;
            background: linear-gradient(to right, #f12711, #f5af19); border: none; 
        }
    </style>
</head>
<body>

    <header>
        <h1 class="main-title">LUCKY DRAW</h1>
        <div id="status-bar" class="h5">
            可抽獎人數： <span id="pool-count">...</span> | 
            已出號碼： <span id="drawn-history" style="font-size: 0.9em; max-width: 500px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; display: inline-block; white-space: nowrap;">...</span>
        </div>
    </header>

    <main>
        <div class="winner-column">
            <div class="col-title hr">HR 部門</div>
            <div id="list-hr"></div>
        </div>
        
        <div class="winner-column">
            <div class="col-title fac">FAC 部門</div>
            <div id="list-fac"></div>
        </div>
    </main>
    
    <footer>
        <div class="controls">
            <form id="draw-form" class="row g-3 align-items-end justify-content-center">
                <div class="col-md-3">
                    <label class="text-start d-block text-muted mb-1">獎項名稱</label>
                    <input type="text" class="form-control form-control-lg" id="prize-name" placeholder="例: 加碼獎" style="height: 80px; font-size: 1.5rem;" required>
                </div>

                <div class="col-md-6">
                    <div class="digit-input-group">
                        <div class="digit-box">
                            <label>百位 (選填)</label>
                            <input type="text" id="input-100" maxlength="1" pattern="[0-9]*" placeholder="-">
                        </div>
                        <div class="digit-box">
                            <label>十位 (選填)</label>
                            <input type="text" id="input-10" maxlength="1" pattern="[0-9]*" placeholder="-">
                        </div>
                        <div class="digit-box">
                            <label>個位 (必填)</label>
                            <input type="text" id="input-1" maxlength="1" pattern="[0-9]*" placeholder="0-9" required style="border-color: #f5af19;">
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <button type="submit" class="btn btn-warning w-100" id="draw-btn">
                        <i class="bi bi-gift-fill me-2"></i> 抽出
                    </button>
                </div>
            </form>
            
            <div class="text-center mt-3">
                <a href="{{ url_for('lottery.winners_list') }}" class="text-muted text-decoration-none me-3" target="_blank">
                    <i class="bi bi-card-checklist"></i> 中獎日誌
                </a>
                <a href="{{ url_for('admin.index') }}" class="text-muted text-decoration-none" target="_blank">
                    <i class="bi bi-gear-fill"></i> 後台管理
                </a>
            </div>
        </div>
    </footer>

    <script>
        const poolCountEl = document.getElementById('pool-count');
        const drawnHistoryEl = document.getElementById('drawn-history');
        const listHrEl = document.getElementById('list-hr');
        const listFacEl = document.getElementById('list-fac');
        const drawBtn = document.getElementById('draw-btn');
        
        // 輸入框
        const input100 = document.getElementById('input-100');
        const input10 = document.getElementById('input-10');
        const input1 = document.getElementById('input-1');
        const prizeInput = document.getElementById('prize-name');

        document.addEventListener('DOMContentLoaded', fetchData);

        // 自動跳格邏輯 (輸入百位跳十位，輸入十位跳個位)
        input100.addEventListener('input', (e) => { if(e.target.value) input10.focus(); });
        input10.addEventListener('input', (e) => { if(e.target.value) input1.focus(); });

        async function fetchData() {
            try {
                const response = await fetch("{{ url_for('lottery.api_get_data') }}");
                const data = await response.json();
                poolCountEl.innerText = data.available_count;
                drawnHistoryEl.innerText = data.drawn_numbers_list.join(", ") || "無";
                return data.drawn_numbers_list; // 回傳已抽號碼列表
            } catch (error) {
                console.error("Error:", error);
                return [];
            }
        }

        document.getElementById('draw-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 組合號碼
            const v100 = input100.value.trim();
            const v10 = input10.value.trim();
            const v1 = input1.value.trim();
            
            if (!v1) return alert("請至少輸入個位數");
            
            // 組合字串：如果有百位就全組，沒百位看有沒有十位
            let suffix = "";
            if (v100) suffix += v100;
            if (v10 || v100) suffix += v10; // 如果有百位，十位即使空也要補(雖然邏輯上怪怪的，但假設 user 會依序輸入)
            suffix += v1;
            
            // 簡單防呆：把中間的空字元處理掉 (例如輸入 百位:1, 個位:5 -> 15? 還是不允許? 這裡假設使用者會連續輸入)
            // 這裡直接串接，如果不連續 (如 1_5) 使用者自己負責，或者可以強迫輸入
            
            const prizeName = prizeInput.value.trim();
            if (!prizeName) return alert("請輸入獎項名稱");

            // 檢查重複
            const drawnList = await fetchData();
            // 注意：API回傳的可能是字串陣列
            if (drawnList.includes(suffix)) {
                return alert(`號碼 ${suffix} 已經抽過了！`);
            }

            if (!confirm(`確認要抽出：\n\n【 ${prizeName} 】\n\n號碼：【 ${suffix} 】\n\n確定嗎？`)) return;

            // 清空畫面
            drawBtn.disabled = true;
            listHrEl.innerHTML = '';
            listFacEl.innerHTML = '';

            try {
                const response = await fetch("{{ url_for('lottery.api_draw') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prize_name: prizeName, suffix: suffix })
                });
                
                const result = await response.json();

                if (result.success) {
                    // 根據 is_addon 決定樣式
                    const cardClass = result.is_addon ? 'winner-card addon-card' : 'winner-card';
                    const badgeText = result.is_addon ? '🔥 加碼中獎' : '🎉 中獎';

                    if (result.winners.length > 0) {
                        result.winners.forEach((winner, index) => {
                            setTimeout(() => {
                                const card = document.createElement('div');
                                card.className = cardClass;
                                card.innerHTML = `
                                    <div class="d-flex justify-content-between">
                                        <span>${winner.name}</span>
                                        <small>${winner.employee_id}</small>
                                    </div>
                                    <div class="d-flex justify-content-between mt-1">
                                        <small class="text-primary">${winner.site || '未知單位'}</small>
                                        <small class="fw-bold text-danger">NO.${winner.lottery_number}</small>
                                    </div>
                                `;
                                
                                // (*** 核心修改：分流顯示 ***)
                                if (winner.site === 'HR') {
                                    listHrEl.appendChild(card);
                                } else if (winner.site === 'FAC') {
                                    listFacEl.appendChild(card);
                                } else {
                                    // 若有其他單位，預設放右邊或另作處理，這裡暫放 FAC
                                    listFacEl.appendChild(card);
                                }
                            }, index * 200);
                        });
                    } else {
                        alert(`號碼 ${suffix} 沒有人中獎`);
                    }
                    
                    // 不清空輸入框，方便繼續加碼 (例如抽完 5，繼續輸入 3 變 35)
                } else {
                    alert(result.message);
                }
                
                await fetchData();

            } catch (error) {
                console.error(error);
                alert("伺服器錯誤");
            } finally {
                drawBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
