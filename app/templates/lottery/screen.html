<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運抽獎</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-base-size: 1.2rem; /* 用於動態調整大小 */
        }
        body {
            background: linear-gradient(270deg, #0f0c29, #302b63, #24243e);
            background-size: 600% 600%;
            animation: gradient-animation 20s ease infinite;
            color: #fff;
            font-family: 'Noto Sans TC', sans-serif;
            height: 100vh;
            overflow: hidden; /* 禁止捲動 */
            display: flex;
            flex-direction: column;
        }
        @keyframes gradient-animation { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        /* 頂部資訊 */
        header { 
            padding: 0.5rem 1.5rem; flex-shrink: 0; 
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.2);
        }
        .main-title { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 2.2rem; color: #fff; text-shadow: 0 0 10px #fff; margin: 0; }
        .status-info { color: #ccc; font-size: 0.9rem; text-align: right; }
        #pool-count { color: #00ffea; font-weight: bold; }

        /* 主顯示區 (左右分欄) */
        main { 
            flex-grow: 1; 
            display: flex; 
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            padding: 10px 20px;
            gap: 15px;
        }
        
        .split-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .col-header {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 2px solid rgba(255,255,255,0.15);
            flex-shrink: 0; 
        }
        .col-header.hr { color: #ff9ff3; }
        .col-header.fac { color: #54a0ff; }

        /* 卡片容器 (自動縮放區) */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            justify-content: center;
            gap: 0.5em;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 隱藏超出部分，靠JS縮小 */
        }

        /* 卡片本體 */
        .winner-card {
            background: linear-gradient(145deg, #fefde8, #f8d7a0);
            color: #333;
            border-radius: 8px;
            border: 2px solid #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            
            /* 關鍵：大小連動 CSS 變數 */
            width: 9em; 
            padding: 0.4em 0.2em;
            font-size: var(--card-base-size); 
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            animation: pop-in 0.4s ease forwards;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s ease; /* 變色動畫 */
        }
        
        .winner-name { font-weight: 800; font-size: 1.1em; line-height: 1.2; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 100%; }
        .winner-info { font-size: 0.7em; opacity: 0.8; margin-top: 2px; }
        .winner-num { font-family: 'Orbitron', sans-serif; font-weight: bold; color: #d63031; font-size: 0.9em; margin-top: 2px; }

        @keyframes pop-in { to { opacity: 1; transform: scale(1); } }

        /* (*** 加碼變色樣式 ***) */
        .winner-card.bonus-highlight {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: #fff !important;
            border: 3px solid #ffd700 !important;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.9);
            transform: scale(1.08);
            z-index: 10;
        }
        .winner-card.bonus-highlight .winner-num { color: #ffd700; }

        /* 底部控制區 */
        footer { 
            padding: 10px; 
            background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(10px); 
            flex-shrink: 0;
        }
        .controls { max-width: 1000px; margin: auto; }
        
        .digit-input-group { display: flex; gap: 8px; justify-content: center; align-items: flex-end; }
        .digit-box label { display: block; color: #ccc; font-size: 0.7rem; margin-bottom: 2px; text-align: center; }
        .digit-box input { 
            width: 60px; height: 60px; 
            font-size: 2rem; text-align: center; 
            background: rgba(0,0,0,0.5); color: #fff; 
            border: 2px solid #555; border-radius: 8px;
        }
        .digit-box input:focus { border-color: #00ffea; outline: none; }
        .btn-action { height: 60px; font-weight: bold; border-radius: 8px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <h1 class="main-title">LUCKY DRAW</h1>
        <div class="status-info">
            <div>可抽獎: <span id="pool-count">...</span></div>
            <div class="small text-muted" style="max-width: 400px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">已出: <span id="drawn-history">...</span></div>
        </div>
    </header>

    <main id="display-area">
        <div class="split-pane">
            <div class="col-header hr">HR <small style="font-size:0.5em">行政單位</small></div>
            <div id="list-hr" class="card-container"></div>
        </div>
        
        <div class="split-pane">
            <div class="col-header fac">FAC <small style="font-size:0.5em">廠務單位</small></div>
            <div id="list-fac" class="card-container"></div>
        </div>
    </main>
    
    <footer>
        <div class="controls">
            <form id="draw-form" class="row g-2 align-items-end justify-content-center">
                <div class="col-md-3">
                    <input type="text" class="form-control" id="prize-name" placeholder="輸入獎項名稱" style="height: 60px; font-size: 1.3rem; text-align:center;" required>
                </div>

                <div class="col-md-5">
                    <div class="digit-input-group">
                        <div class="digit-box">
                            <label>百 (選)</label>
                            <input type="text" id="input-100" maxlength="1" pattern="[0-9]*">
                        </div>
                        <div class="digit-box">
                            <label>十 (選)</label>
                            <input type="text" id="input-10" maxlength="1" pattern="[0-9]*">
                        </div>
                        <div class="digit-box">
                            <label>個 (必)</label>
                            <input type="text" id="input-1" maxlength="1" pattern="[0-9]*" required style="border-color: #f5af19;">
                        </div>
                    </div>
                </div>

                <div class="col-md-2">
                    <button type="button" class="btn btn-warning w-100 btn-action" id="btn-draw-normal">
                        <i class="bi bi-play-fill"></i> 抽出
                    </button>
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-outline-info w-100 btn-action" id="btn-draw-addon">
                        <i class="bi bi-stars"></i> 加碼抽出
                    </button>
                </div>
            </form>
        </div>
    </footer>

    <script>
        const listHrEl = document.getElementById('list-hr');
        const listFacEl = document.getElementById('list-fac');
        const btnDrawNormal = document.getElementById('btn-draw-normal');
        const btnDrawAddon = document.getElementById('btn-draw-addon');
        
        const input100 = document.getElementById('input-100');
        const input10 = document.getElementById('input-10');
        const input1 = document.getElementById('input-1');
        const prizeInput = document.getElementById('prize-name');

        // 輸入跳格
        input100.addEventListener('input', (e) => { if(e.target.value) input10.focus(); });
        input10.addEventListener('input', (e) => { if(e.target.value) input1.focus(); });

        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
            window.addEventListener('resize', fitCardsToScreen);
        });

        async function fetchData() {
            try {
                const response = await fetch("{{ url_for('lottery.api_get_data') }}");
                const data = await response.json();
                document.getElementById('pool-count').innerText = data.available_count;
                document.getElementById('drawn-history').innerText = data.drawn_numbers_list.join(", ");
                return data.drawn_numbers_list;
            } catch (e) { return []; }
        }

        function getFullNumber() {
            let suffix = "";
            if (input100.value) suffix += input100.value;
            if (input10.value || input100.value) suffix += (input10.value || "0"); 
            suffix += input1.value;
            return suffix;
        }

        // 綁定按鈕事件
        btnDrawNormal.addEventListener('click', () => performDraw(false));
        btnDrawAddon.addEventListener('click', () => performDraw(true));

        async function performDraw(isAddon) {
            const suffix = getFullNumber();
            const prizeName = prizeInput.value.trim();
            
            if (!suffix) return alert("請輸入號碼");
            if (!prizeName) return alert("請輸入獎項名稱");
            if (!input1.checkValidity()) return alert("請輸入有效數字");

            // 檢查是否重複
            const drawnList = await fetchData();
            if (drawnList.includes(suffix)) return alert(`號碼 ${suffix} 已經抽過了`);

            if(isAddon) {
                if(!confirm(`確認要【加碼抽出】：${suffix}？\n這將會記錄到資料庫，並變更目前畫面上符合者的顏色。`)) return;
            } else {
                if(!confirm(`確認要【一般抽出】：${suffix}？\n這將會清空畫面並抽出新名單。`)) return;
            }

            setLoading(true);

            try {
                const res = await fetch("{{ url_for('lottery.api_draw') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prize_name: prizeName, 
                        suffix: suffix,
                        is_addon: isAddon  // 傳送模式參數
                    })
                });
                const result = await res.json();

                if (result.success) {
                    // 如果是一般抽出，先清空畫面
                    if (!isAddon) {
                        listHrEl.innerHTML = '';
                        listFacEl.innerHTML = '';
                        resetScale();
                    }

                    if (result.winners.length === 0) {
                        alert(`號碼 ${suffix} 沒有人中獎`);
                    } else {
                        // 處理中獎者
                        result.winners.forEach(w => {
                            if (isAddon) {
                                // 加碼模式：尋找現有卡片變色
                                highlightExistingCard(w.employee_id);
                            } else {
                                // 一般模式：建立新卡片
                                const card = createCard(w);
                                if (w.site && w.site.toUpperCase().includes('HR')) {
                                    listHrEl.appendChild(card);
                                } else {
                                    listFacEl.appendChild(card);
                                }
                            }
                        });

                        // 執行自動縮放
                        setTimeout(fitCardsToScreen, 100);
                    }
                } else {
                    alert(result.message);
                }
                fetchData();
            } catch (err) {
                alert("伺服器錯誤: " + err);
            } finally {
                setLoading(false);
            }
        }

        function createCard(winner) {
            const div = document.createElement('div');
            div.className = 'winner-card';
            div.dataset.eid = winner.employee_id; // 綁定工號以便尋找
            div.innerHTML = `
                <div class="winner-name">${winner.name}</div>
                <div class="winner-info">${winner.employee_id}</div>
                <div class="winner-num">${winner.lottery_number || ''}</div>
            `;
            return div;
        }

        function highlightExistingCard(employeeId) {
            // 在兩個列表中尋找該工號的卡片
            const card = document.querySelector(`.winner-card[data-eid="${employeeId}"]`);
            if (card) {
                card.classList.add('bonus-highlight');
                // 將變色的卡片移到最前面 (選用功能)
                // card.parentElement.prepend(card);
            }
        }

        function setLoading(isLoading) {
            btnDrawNormal.disabled = isLoading;
            btnDrawAddon.disabled = isLoading;
        }

        // --- 自動縮放邏輯 ---
        function resetScale() {
            document.documentElement.style.setProperty('--card-base-size', '1.2rem');
        }

        function fitCardsToScreen() {
            const containerHr = listHrEl;
            const containerFac = listFacEl;
            let size = 1.2;
            const minSize = 0.5;

            // 迴圈縮小直到兩邊都不溢出
            for (let i = 0; i < 30; i++) {
                // 檢查是否有捲軸或內容超出
                const overflowHr = containerHr.scrollHeight > containerHr.clientHeight;
                const overflowFac = containerFac.scrollHeight > containerFac.clientHeight;

                if (!overflowHr && !overflowFac) break;

                size -= 0.05;
                if (size < minSize) { size = minSize; break; }
                document.documentElement.style.setProperty('--card-base-size', `${size}rem`);
            }
        }
    </script>
</body>
</html>
