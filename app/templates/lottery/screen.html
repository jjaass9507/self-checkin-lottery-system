<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運抽獎</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* (*** 1. 華麗的動態漸層背景 ***) */
            background: linear-gradient(270deg, #0f0c29, #302b63, #24243e);
            background-size: 600% 600%;
            animation: gradient-animation 20s ease infinite;
            
            color: #fff;
            text-align: center;
            font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden; /* 隱藏捲軸 */
        }

        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .lottery-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 上中下排列 */
            padding: 2rem;
        }

        /* (*** 2. 標題使用科技字體 ***) */
        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 5rem;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #f09, 0 0 40px #f09;
            margin-top: 1rem;
        }

        /* (*** 3. 狀態列 ***) */
        #status-bar {
            color: #aaa;
            background: rgba(0,0,0,0.2);
            padding: 0.5rem;
            border-radius: 10px;
            display: inline-block;
            margin: auto;
            border: 1px solid #444;
        }
        #pool-count {
            font-weight: 700;
            font-size: 1.25rem;
            color: #00ffea; /* 亮青色 */
            font-family: 'Orbitron', sans-serif;
        }

        /* (*** 4. 控制區 ***) */
        .controls {
            background: rgba(0,0,0,0.3);
            border: 1px solid #555;
            max-width: 700px;
            margin: 1rem auto;
        }
        #draw-button {
            font-size: 2rem;
            padding: 1rem 3rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            background-image: linear-gradient(to right, #d31027 0%, #ea384d 100%);
            border: none;
        }

        /* (*** 5. 中獎者顯示區 (重點) ***) */
        #winner-display {
            min-height: 40vh; /* 確保有足夠空間 */
        }
        #current-prize-name {
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 700;
            font-size: 2.5rem;
            color: #ffd700; /* 金色 */
            text-shadow: 0 0 10px #ffd700;
        }
        
        /* (*** 6. 華麗的中獎卡片 ***) */
        .winner-card {
            background: linear-gradient(145deg, #fefde8, #f8d7a0);
            color: #333;
            padding: 1rem 1.5rem;
            margin: 0.5rem;
            border-radius: 10px;
            font-size: 1.75rem;
            font-weight: 700;
            border: 2px solid #fff;
            box-shadow: 0 0 20px #f8d7a0, 0 5px 15px rgba(0,0,0,0.3);
            display: inline-block;
            
            /* 動畫 */
            opacity: 0;
            transform: scale(0.5) rotate(15deg);
            animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .winner-card small {
            font-size: 1rem;
            font-weight: 500;
        }
        @keyframes pop-in {
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        
        /* (*** 7. 底部連結 ***) */
        .footer-links {
            padding-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="lottery-container">
        
        <header>
            <h1 class="main-title">LUCKY DRAW</h1>
            <div id="status-bar" class="h5">
                目前抽獎池人數： <span id="pool-count">...</span>
            </div>
        </header>

        <main id="winner-display">
            <h2 id="current-prize-name" class="mb-4"></h2>
            <div id="winner-list" class="d-flex flex-wrap justify-content-center">
                </div>
        </main>
        
        <footer>
            <div classs="controls card bg-transparent border-light p-3 mb-3" style="max-width: 700px; margin: auto;">
                <div class="input-group">
                    <select class="form-select form-select-lg" id="prize-select" style="background: rgba(255,255,255,0.9); color: #333;">
                        <option value="">-- 1. 選擇要抽的獎項 --</option>
                    </select>
                    <button class="btn btn-danger" id="draw-button" disabled>
                        <i class="bi bi-gift-fill me-2"></i> DRAW!
                    </button>
                </div>
            </div>
            
            <div class="footer-links">
                <a href="{{ url_for('lottery.winners_list') }}" class="btn btn-outline-secondary btn-sm" target="_blank">
                    <i class="bi bi-card-checklist me-1"></i> 查看完整中獎名單
                </a>
                <a href="{{ url_for('admin.index') }}" class="btn btn-outline-secondary btn-sm" target="_blank">
                    <i class="bi bi-gear-fill me-1"></i> 前往後台
                </a>
            </div>
        </footer>
    </div>

    <script>
        const prizeSelect = document.getElementById('prize-select');
        const drawButton = document.getElementById('draw-button');
        const poolCountEl = document.getElementById('pool-count');
        const winnerListEl = document.getElementById('winner-list');
        const currentPrizeNameEl = document.getElementById('current-prize-name');

        // 1. 載入頁面時，獲取抽獎狀態
        document.addEventListener('DOMContentLoaded', fetchData);

        async function fetchData() {
            try {
                const response = await fetch("{{ url_for('lottery.api_get_data') }}");
                const data = await response.json();

                // data = { 
                //   available_count: 120, 
                //   prizes: [ {id: 1, name: "特獎 (1名)", drawn: false}, ... ] 
                // }

                // 更新抽獎池人數
                poolCountEl.innerText = data.available_count;

                // 填充獎項下拉選單
                prizeSelect.innerHTML = '<option value="">-- 請選擇要抽的獎項 --</option>';
                data.prizes.forEach(prize => {
                    let optionText = `${prize.name} (${prize.quantity}名)`;
                    let disabled = '';
                    if (prize.is_drawn) {
                        optionText += " (已抽出)";
                        disabled = 'disabled';
                    }
                    prizeSelect.innerHTML += `
                        <option value="${prize.id}" ${disabled}>${optionText}</option>
                    `;
                });

            } catch (error) {
                console.error("Error fetching data:", error);
                poolCountEl.innerText = "錯誤：無法載入資料";
            }
        }

        // 2. 監聽下拉選單
        prizeSelect.addEventListener('change', () => {
            if (prizeSelect.value) {
                drawButton.disabled = false;
            } else {
                drawButton.disabled = true;
            }
        });

        // 3. (*** 核心 ***) 監聽抽獎按鈕
        drawButton.addEventListener('click', handleDraw);

        async function handleDraw() {
            const prizeId = prizeSelect.value;
            if (!prizeId) return;

            // 鎖定按鈕
            drawButton.disabled = true;
            drawButton.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 抽獎中...';

            // 清空上一輪的中獎者
            winnerListEl.innerHTML = '';
            currentPrizeNameEl.innerText = '';

            try {
                // 4. 呼叫後端抽獎 API
                const response = await fetch("{{ url_for('lottery.api_draw') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prize_id: prizeId })
                });

                const result = await response.json();
                // result = { 
                //   success: true, 
                //   winners: [ {name: "王大明", id: "K123"}, ... ], 
                //   prize_name: "特獎" 
                // }

                if (result.success) {
                    // 5. 成功！顯示中獎者
                    currentPrizeNameEl.innerText = `恭喜 [${result.prize_name}] 中獎者！`;

                    // 逐個顯示中獎者 (有動畫效果)
                    result.winners.forEach((winner, index) => {
                        setTimeout(() => {
                            const card = document.createElement('div');
                            card.className = 'winner-card shadow';
                            card.innerHTML = `${winner.name}<br><small class="text-muted">(${winner.employee_id})</small>`;
                            winnerListEl.appendChild(card);
                        }, index * 200); // 每個 0.2 秒
                    });

                    // 重新載入資料 (更新抽獎池人數、將獎項標為"已抽出")
                    await fetchData();
                    prizeSelect.value = ''; // 重置下拉選單

                } else {
                    // 6. 失敗 (例如人數不足)
                    alert(`抽獎失敗：${result.message}`);
                }

            } catch (error) {
                console.error("Error drawing:", error);
                alert("抽獎時發生嚴重錯誤！");
            } finally {
                // 解鎖按鈕
                drawButton.disabled = true; // 保持 disabled 直到選了新獎項
                drawButton.innerHTML = '抽獎！';
            }
        }
    </script>
</body>
</html>
