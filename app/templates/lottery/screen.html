<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運抽獎</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* (*** 1. 抽獎按鈕樣式 ***) */
        .btn-draw-number {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 2.5rem;
            margin: 5px;
            width: 100px;
            height: 100px;
            border-radius: 50%; /* 圓形按鈕 */
            background-image: linear-gradient(to right, #007bff 0%, #0056b3 100%);
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0,123,255,0.3);
        }
        .btn-draw-number:disabled {
            background-image: linear-gradient(to right, #6c757d 0%, #343a40 100%);
            border-color: #999;
            opacity: 0.6;
        }
        
        /* (其他 CSS 樣式... 保持原樣) */
        body { background: linear-gradient(270deg, #0f0c29, #302b63, #24243e); background-size: 600% 600%; animation: gradient-animation 20s ease infinite; color: #fff; text-align: center; font-family: 'Noto Sans TC', sans-serif; overflow: hidden; }
        @keyframes gradient-animation { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .lottery-container { min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; }
        .main-title { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 5rem; color: #fff; text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #f09, 0 0 40px #f09; margin-top: 1rem; }
        #status-bar { color: #aaa; background: rgba(0,0,0,0.2); padding: 0.5rem; border-radius: 10px; display: inline-block; margin: auto; border: 1px solid #444; }
        #pool-count { font-weight: 700; font-size: 1.25rem; color: #00ffea; font-family: 'Orbitron', sans-serif; }
        #winner-display { min-height: 40vh; }
        #current-prize-name { font-family: 'Noto Sans TC', sans-serif; font-weight: 700; font-size: 2.5rem; color: #ffd700; text-shadow: 0 0 10px #ffd700; }
        .winner-card { background: linear-gradient(145deg, #fefde8, #f8d7a0); color: #333; padding: 1rem 1.5rem; margin: 0.5rem; border-radius: 10px; font-size: 1.75rem; font-weight: 700; border: 2px solid #fff; box-shadow: 0 0 20px #f8d7a0, 0 5px 15px rgba(0,0,0,0.3); display: inline-block; opacity: 0; transform: scale(0.5) rotate(15deg); animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .winner-card small { font-size: 1rem; font-weight: 500; }
        @keyframes pop-in { to { opacity: 1; transform: scale(1) rotate(0deg); } }
        .footer-links { padding-bottom: 1rem; }
    </style>
</head>
<body>

    <div class="lottery-container">
        <header>
            <h1 class="main-title">LUCKY DRAW</h1>
            <div id="status-bar" class="h5">
                目前抽獎池人數： <span id="pool-count">...</span>
            </div>
        </header>

        <main id="winner-display">
            <h2 id="current-prize-name" class="mb-4"></h2>
            <div id="winner-list" class="d-flex flex-wrap justify-content-center">
                </div>
        </main>
        
        <footer>
            <div class="controls p-3 mb-3" style="max-width: 900px; margin: auto;">
                <h4 class="mb-3">請抽出幸運尾號</h4>
                <div id="draw-button-container" class="d-flex flex-wrap justify-content-center">
                    </div>
            </div>
            
            <div class="footer-links">
                <a href="{{ url_for('lottery.winners_list') }}" class="btn btn-outline-secondary btn-sm" target="_blank">
                    <i class="bi bi-card-checklist me-1"></i> 查看完整中獎名單
                </a>
                <a href="{{ url_for('admin.index') }}" class="btn btn-outline-secondary btn-sm" target="_blank">
                    <i class="bi bi-gear-fill me-1"></i> 前往後台
                </a>
            </div>
        </footer>
    </div>

    <script>
        const poolCountEl = document.getElementById('pool-count');
        const winnerListEl = document.getElementById('winner-list');
        const currentPrizeNameEl = document.getElementById('current-prize-name');
        const drawButtonContainer = document.getElementById('draw-button-container');

        // 1. 載入頁面時，獲取抽獎狀態並生成按鈕
        document.addEventListener('DOMContentLoaded', fetchData);

        async function fetchData() {
            try {
                const response = await fetch("{{ url_for('lottery.api_get_data') }}");
                const data = await response.json();
                
                // data = { available_count: 120, drawn_numbers_list: [3, 7] }

                // 更新抽獎池人數
                poolCountEl.innerText = data.available_count;
                
                // (*** 4. 生成或更新按鈕 ***)
                drawButtonContainer.innerHTML = ''; // 清空
                for (let i = 0; i <= 9; i++) {
                    const isDrawn = data.drawn_numbers_list.includes(i);
                    const button = document.createElement('button');
                    button.className = 'btn btn-primary btn-draw-number';
                    button.innerText = i;
                    button.dataset.number = i;
                    button.disabled = isDrawn;
                    if (isDrawn) {
                        button.innerText = 'X';
                    }
                    // (為按鈕綁定點擊事件)
                    button.addEventListener('click', () => handleDraw(i));
                    drawButtonContainer.appendChild(button);
                }

            } catch (error) {
                console.error("Error fetching data:", error);
                poolCountEl.innerText = "錯誤";
            }
        }
        
        // 3. (*** 核心 ***) 監聽抽獎按鈕
        async function handleDraw(tailNumber) {
            // (*** 5. 確認視窗 ***)
            if (!confirm(`確定要抽出尾號 [ ${tailNumber} ] 嗎？\n(此動作無法復原)`)) {
                return;
            }

            // 鎖定所有按鈕
            document.querySelectorAll('.btn-draw-number').forEach(btn => btn.disabled = true);
            
            winnerListEl.innerHTML = '';
            currentPrizeNameEl.innerText = '抽獎中...';

            try {
                // 4. 呼叫後端抽獎 API
                const response = await fetch("{{ url_for('lottery.api_draw') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tail_number: tailNumber })
                });
                
                const result = await response.json();
                // result = { success: true, message: "...", winners: [...], tail_number: 7 }

                if (result.success) {
                    currentPrizeNameEl.innerText = result.message; // "恭喜尾號 7..."
                    
                    if (result.winners.length > 0) {
                        result.winners.forEach((winner, index) => {
                            setTimeout(() => {
                                const card = document.createElement('div');
                                card.className = 'winner-card shadow';
                                card.innerHTML = `${winner.name}<br><small class="text-muted">(${winner.employee_id} / ${winner.lottery_number})</small>`;
                                winnerListEl.appendChild(card);
                            }, index * 200);
                        });
                    }
                    
                    // (*** 6. 重新載入資料 ***)
                    // (這會自動更新抽獎池人數，並把剛抽的按鈕 disable)
                    await fetchData();

                } else {
                    alert(`抽獎失敗：${result.message}`);
                    // 重新啟用按鈕 (除了已抽過的)
                    await fetchData();
                }

            } catch (error) {
                console.error("Error drawing:", error);
                alert("抽獎時發生嚴重錯誤！");
                await fetchData(); // 發生錯誤時也重載
            }
        }
    </script>
</body>
</html>
