<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運抽獎</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-base-size: 1.2rem; /* 用於動態調整大小的基準 */
        }
        body {
            background: linear-gradient(270deg, #0f0c29, #302b63, #24243e);
            background-size: 600% 600%;
            animation: gradient-animation 20s ease infinite;
            color: #fff;
            font-family: 'Noto Sans TC', sans-serif;
            height: 100vh;
            overflow: hidden; /* 禁止捲動 */
            display: flex;
            flex-direction: column;
        }
        @keyframes gradient-animation { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        /* 1. 頂部區域 */
        header { 
            padding: 0.5rem 1rem; 
            flex-shrink: 0; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
        }
        .main-title { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 2.5rem; color: #fff; text-shadow: 0 0 10px #fff, 0 0 20px #f09; margin: 0; }
        .status-info { color: #ccc; font-size: 1rem; }
        #pool-count { color: #00ffea; font-weight: bold; }

        /* 2. 主顯示區 (左右分欄) */
        main { 
            flex-grow: 1; 
            display: flex; 
            width: 100%;
            height: 100%; /* 佔滿剩餘空間 */
            overflow: hidden;
            position: relative;
            padding: 10px;
        }
        
        .split-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-radius: 10px;
            padding: 10px;
            margin: 0 5px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255, 255, 255, 0.02);
            position: relative;
        }

        /* 中間分隔線 */
        .separator {
            width: 2px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.5), transparent);
            margin: 10px 0;
        }

        .col-header {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            flex-shrink: 0; /* 標題不縮放 */
        }
        .col-header.hr { color: #ff9ff3; text-shadow: 0 0 10px rgba(255, 159, 243, 0.5); }
        .col-header.fac { color: #54a0ff; text-shadow: 0 0 10px rgba(84, 160, 255, 0.5); }

        /* 卡片容器 (自動排版) */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start; /* 從上排到下 */
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            height: 100%; /* 讓它知道高度限制 */
            overflow: hidden; /* 超出隱藏 (靠 JS 縮放) */
        }

        /* 卡片樣式 */
        .winner-card {
            background: linear-gradient(145deg, #fefde8, #f8d7a0);
            color: #333;
            border-radius: 8px;
            border: 2px solid #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            
            /* 關鍵：大小使用 em/rem 相對單位，由 JS 控制父層 font-size 來縮放 */
            width: 10em; 
            padding: 0.5em;
            font-size: var(--card-base-size); 
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.5);
        }
        
        .winner-name { font-weight: 800; font-size: 1.2em; line-height: 1.2; }
        .winner-info { font-size: 0.7em; opacity: 0.8; margin-top: 2px; }
        .winner-num { font-family: 'Orbitron', sans-serif; font-weight: bold; color: #d63031; font-size: 0.9em; margin-top: 4px; }

        @keyframes pop-in { to { opacity: 1; transform: scale(1); } }

        /* (*** 加碼變色樣式 ***) */
        .winner-card.bonus-highlight {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* 紫色系 */
            color: #fff;
            border: 3px solid #ffd700; /* 金框 */
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            transform: scale(1.1);
            z-index: 10;
        }
        .winner-card.bonus-highlight .winner-num { color: #ffd700; }

        /* 3. 底部控制區 */
        footer { 
            padding: 10px; 
            background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(5px); 
            flex-shrink: 0;
        }
        .controls { max-width: 1000px; margin: auto; }
        
        .digit-input-group { display: flex; gap: 5px; justify-content: center; align-items: flex-end; }
        .digit-box label { display: block; color: #ccc; font-size: 0.7rem; margin-bottom: 2px; text-align: center; }
        .digit-box input { 
            width: 60px; height: 60px; 
            font-size: 2rem; text-align: center; 
            background: rgba(0,0,0,0.5); color: #fff; 
            border: 2px solid #555; border-radius: 8px;
        }
        .digit-box input:focus { border-color: #00ffea; outline: none; }
        
        .btn-action { height: 60px; font-weight: bold; border-radius: 8px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1 class="main-title">LUCKY DRAW</h1>
        </div>
        <div class="text-end">
            <div class="status-info">可抽獎: <span id="pool-count">...</span></div>
            <div class="status-info small text-muted">已出: <span id="drawn-history">...</span></div>
        </div>
    </header>

    <main id="display-area">
        <div class="split-pane">
            <div class="col-header hr">HR <small style="font-size:0.5em">行政單位</small></div>
            <div id="list-hr" class="card-container"></div>
        </div>
        
        <div class="separator"></div>

        <div class="split-pane">
            <div class="col-header fac">FAC <small style="font-size:0.5em">廠務單位</small></div>
            <div id="list-fac" class="card-container"></div>
        </div>
    </main>
    
    <footer>
        <div class="controls">
            <form id="draw-form" class="row g-2 align-items-end justify-content-center">
                <div class="col-md-3">
                    <input type="text" class="form-control" id="prize-name" placeholder="輸入獎項名稱" style="height: 60px; font-size: 1.3rem; text-align:center;" required>
                </div>

                <div class="col-md-5">
                    <div class="digit-input-group">
                        <div class="digit-box">
                            <label>百 (選)</label>
                            <input type="text" id="input-100" maxlength="1" pattern="[0-9]*">
                        </div>
                        <div class="digit-box">
                            <label>十 (選)</label>
                            <input type="text" id="input-10" maxlength="1" pattern="[0-9]*">
                        </div>
                        <div class="digit-box">
                            <label>個 (必)</label>
                            <input type="text" id="input-1" maxlength="1" pattern="[0-9]*" required style="border-color: #f5af19;">
                        </div>
                    </div>
                </div>

                <div class="col-md-2">
                    <button type="submit" class="btn btn-warning w-100 btn-action" id="draw-btn">
                        <i class="bi bi-play-fill"></i> 抽出
                    </button>
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-outline-info w-100 btn-action" id="bonus-btn">
                        <i class="bi bi-stars"></i> 加碼比對
                    </button>
                </div>
            </form>
        </div>
    </footer>

    <script>
        const listHrEl = document.getElementById('list-hr');
        const listFacEl = document.getElementById('list-fac');
        const drawBtn = document.getElementById('draw-btn');
        const bonusBtn = document.getElementById('bonus-btn');
        
        const input100 = document.getElementById('input-100');
        const input10 = document.getElementById('input-10');
        const input1 = document.getElementById('input-1');
        const prizeInput = document.getElementById('prize-name');

        // 輸入跳格
        input100.addEventListener('input', (e) => { if(e.target.value) input10.focus(); });
        input10.addEventListener('input', (e) => { if(e.target.value) input1.focus(); });

        // 取得目前畫面上的所有卡片 (用於加碼比對)
        let currentWinnerCards = []; 

        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
            window.addEventListener('resize', fitCardsToScreen); // 視窗變動時重新縮放
        });

        async function fetchData() {
            try {
                const response = await fetch("{{ url_for('lottery.api_get_data') }}");
                const data = await response.json();
                document.getElementById('pool-count').innerText = data.available_count;
                document.getElementById('drawn-history').innerText = data.drawn_numbers_list.join(", ");
                return data.drawn_numbers_list;
            } catch (e) { console.error(e); return []; }
        }

        function getFullNumber() {
            let suffix = "";
            if (input100.value) suffix += input100.value;
            if (input10.value || input100.value) suffix += (input10.value || "0"); // 有百位就要補十位
            suffix += input1.value;
            return suffix;
        }

        // --- 功能 1: 正規抽出 (寫入 DB) ---
        document.getElementById('draw-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const suffix = getFullNumber();
            const prizeName = prizeInput.value.trim();
            
            if (!suffix) return alert("請輸入號碼");

            // 檢查是否重複 (透過 API 檢查更準，這裡前端簡單擋)
            const drawnList = await fetchData();
            if (drawnList.includes(suffix)) return alert(`號碼 ${suffix} 已抽過`);

            drawBtn.disabled = true;
            listHrEl.innerHTML = '';
            listFacEl.innerHTML = '';
            resetScale(); // 重置縮放

            try {
                const res = await fetch("{{ url_for('lottery.api_draw') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prize_name: prizeName, suffix: suffix })
                });
                const result = await res.json();

                if (result.success) {
                    currentWinnerCards = []; // 清空緩存
                    
                    if (result.winners.length === 0) {
                        alert("無人中獎");
                    } else {
                        // 產生卡片
                        result.winners.forEach(w => {
                            const card = createCard(w);
                            // 根據 Site 分流
                            // 假設資料庫 site 為 'HR' 或 'FAC'，若無則預設右邊
                            if (w.site && w.site.toUpperCase().includes('HR')) {
                                listHrEl.appendChild(card);
                            } else {
                                listFacEl.appendChild(card); // FAC 或其他都放右邊
                            }
                            currentWinnerCards.push({ element: card, data: w });
                        });

                        // **關鍵功能：自動縮放以適應螢幕**
                        // 等待 DOM 渲染完畢後執行
                        setTimeout(fitCardsToScreen, 100);
                    }
                } else {
                    alert(result.message);
                }
                fetchData();
            } catch (err) {
                alert("錯誤：" + err);
            } finally {
                drawBtn.disabled = false;
            }
        });

        // --- 功能 2: 加碼比對 (不寫入 DB，純變色) ---
        bonusBtn.addEventListener('click', () => {
            const suffix = getFullNumber();
            if (!suffix) return alert("請輸入加碼號碼");
            if (currentWinnerCards.length === 0) return alert("目前畫面上沒有名單，請先執行「抽出」");

            let matchCount = 0;
            currentWinnerCards.forEach(item => {
                // 檢查該員的抽獎編號是否以輸入的 suffix 結尾
                // 例如: lottery_number "135", suffix "35" -> true
                if (item.data.lottery_number && item.data.lottery_number.endsWith(suffix)) {
                    // 加入特效 class
                    item.element.classList.add('bonus-highlight');
                    matchCount++;
                } else {
                    // 沒中的可以變半透明 (選用)
                    item.element.style.opacity = '0.4';
                    item.element.classList.remove('bonus-highlight');
                }
            });

            if (matchCount > 0) {
                // 有人中獎，播放個音效或提示?
                // alert(`加碼比對完成！共 ${matchCount} 人符合 ${suffix}`);
            } else {
                alert(`可惜！現有名單中沒有人尾號是 ${suffix}`);
                // 復原
                currentWinnerCards.forEach(item => item.element.style.opacity = '1');
            }
        });

        // --- 輔助: 產生卡片 HTML ---
        function createCard(winner) {
            const div = document.createElement('div');
            div.className = 'winner-card';
            div.innerHTML = `
                <div class="winner-name">${winner.name}</div>
                <div class="winner-info">${winner.employee_id}</div>
                <div class="winner-num">${winner.lottery_number || ''}</div>
            `;
            return div;
        }

        // --- 核心: 自動縮放邏輯 (Fit to Screen) ---
        function resetScale() {
            document.documentElement.style.setProperty('--card-base-size', '1.2rem');
        }

        function fitCardsToScreen() {
            const containerHr = listHrEl;
            const containerFac = listFacEl;
            
            // 取得可用高度 (扣除 header padding 等)
            // 這裡直接檢查是否有 overflow
            let size = 1.2; // 初始 rem
            const minSize = 0.4; // 最小縮到多小
            
            // 只要任何一邊有 scrollHeight > clientHeight，就縮小
            // 設一個迴圈嘗試 (最多跑 20 次避免當機)
            for (let i = 0; i < 20; i++) {
                const overflowHr = containerHr.scrollHeight > containerHr.clientHeight;
                const overflowFac = containerFac.scrollHeight > containerFac.clientHeight;

                if (!overflowHr && !overflowFac) break; // 兩邊都塞得下就停止

                size -= 0.05; // 每次縮一點
                if (size < minSize) { size = minSize; break; }

                document.documentElement.style.setProperty('--card-base-size', `${size}rem`);
            }
        }
    </script>
</body>
</html>
