<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運抽獎 - 尾數</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ocean.css') }}?v=20261118">
    <style>
        :root { --card-base-size: 44px; /* JS 會依人數動態調整 */ }
        body { overflow: hidden; }
        .screen { height: 100vh; display: flex; flex-direction: column; }

        header { flex-shrink: 0; margin: 16px 24px 0; padding: 14px 26px; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-radius: 24px; }
        .h-left { display: flex; align-items: center; gap: 28px; min-width: 0; }
        .brand { display: flex; flex-direction: column; flex-shrink: 0; }
        .brand-en { font: 800 32px var(--num-font); letter-spacing: .06em; }
        .brand-zh { font-size: 13px; color: var(--aqua); letter-spacing: .5em; margin-top: 2px; }
        .prize-select { width: min(420px, 32vw); min-width: 220px; height: 56px; padding: 0 22px; border-radius: 999px; background: rgba(242, 196, 109, .1); border: 1px solid rgba(255, 227, 163, .55); color: var(--gold); font: 900 26px 'Noto Sans TC', sans-serif; outline: none; cursor: pointer; }
        .prize-select:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(242, 196, 109, .18); }
        .h-right { display: flex; align-items: center; gap: 22px; flex-shrink: 0; }
        .drawn { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; overflow: hidden; justify-content: flex-end; max-width: 320px; }
        .drawn-label { font-size: 12px; color: var(--dim); margin-right: 2px; flex-shrink: 0; }
        .drawn-chip { flex-shrink: 0; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font: 600 13px var(--num-font); background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, .4), rgba(160, 235, 255, .1) 60%); border: 1px solid rgba(220, 250, 255, .45); }
        .pool { text-align: right; }
        .pool-label { font-size: 12px; color: var(--dim); letter-spacing: .2em; }
        .pool-val { font: 800 30px var(--num-font); }

        main { flex: 1; min-height: 0; display: flex; gap: 18px; padding: 16px 24px; }
        .split-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; border-radius: 26px; padding: 14px 18px; }
        .col-header { flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 14px; padding-bottom: 10px; margin-bottom: 14px; border-bottom: 1px solid rgba(190, 245, 255, .14); }
        .col-code { font: 800 28px var(--num-font); letter-spacing: .1em; }
        .col-label { font-size: 16px; color: var(--muted); letter-spacing: .24em; }
        .col-count { font: 600 13px var(--num-font); color: var(--gold); }
        .card-container { position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: .36em; font-size: var(--card-base-size); }
        .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: rgba(190, 245, 255, .45); font-size: 16px; letter-spacing: .4em; }
        .card-container:not(:empty) + .empty { display: none; }
        .empty-ring { width: 64px; height: 64px; border-radius: 50%; border: 1px dashed rgba(190, 245, 255, .4); animation: spin 14s linear infinite; }

        .winner-card {
            width: 8.6em; padding: .6em .4em .55em; border-radius: .7em;
            background: rgba(8, 50, 80, .72); border: 1px solid rgba(190, 245, 255, .28);
            box-shadow: 0 .35em .7em rgba(0, 8, 22, .35), inset 0 1px 0 rgba(255, 255, 255, .2);
            display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden;
            animation: rise-big .8s cubic-bezier(.2, .9, .25, 1.15) both;
        }
        .winner-card > div { position: relative; }
        .winner-name { font-weight: 900; font-size: 1.45em; line-height: 1.25; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .winner-biz { font-size: .6em; color: #9FD8FF; font-weight: 700; }
        .winner-info { font: 400 .62em var(--num-font); color: var(--muted); }
        .winner-num { font: 800 1em var(--num-font); color: var(--gold); margin-top: .12em; text-shadow: 0 0 .6em rgba(242, 196, 109, .6); }
        .winner-card.bonus-highlight { background: rgba(242, 196, 109, .2); border-color: rgba(255, 227, 163, .9); box-shadow: 0 0 .7em rgba(242, 196, 109, .45), inset 0 1px 0 rgba(255, 255, 255, .3); }

        footer { flex-shrink: 0; margin: 0 24px 16px; padding: 16px 26px; border-radius: 26px; }
        .controls { display: flex; align-items: center; justify-content: center; gap: 26px; flex-wrap: wrap; }
        .digits { display: flex; gap: 18px; align-items: center; }
        .digit-box { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .digit-box span { font-size: 12px; color: var(--dim); letter-spacing: .1em; }
        .digit-box.req span { color: var(--gold); }
        .porthole { width: 92px; height: 92px; border-radius: 50%; padding: 5px; background: conic-gradient(from 40deg, #6f5420, #FFE3A3, #a37a2f, #FFF1C9, #7d5f25, #E9C98A, #6f5420); }
        .digit-box.req .porthole { box-shadow: 0 0 30px rgba(242, 196, 109, .35); }
        .porthole input { width: 100%; height: 100%; border-radius: 50%; text-align: center; font: 800 38px var(--num-font); background: radial-gradient(circle at 35% 30%, #12507A, #04192E 70%); color: #fff; border: 0; outline: none; }
        .porthole input:focus { box-shadow: inset 0 0 0 2px rgba(126, 240, 224, .6); }
        .btn-action { height: 72px; min-width: 220px; padding: 0 30px; border-radius: 999px; font-size: 22px; }
        .btn-addon { position: relative; border: 1px solid rgba(255, 227, 163, .7); background: rgba(242, 196, 109, .1); color: var(--gold); font-weight: 900; letter-spacing: .2em; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: background .2s; }
        .btn-addon:hover:not(:disabled) { background: rgba(242, 196, 109, .2); }
        #msg-area { text-align: center; margin-top: 6px; min-height: 18px; font-size: 14px; color: var(--error); }
    </style>
</head>
<body>
<ocean-scene palette="abyss" intensity="1.1" bubbles="70"></ocean-scene>

<div class="screen ocean-layer">
    <header class="glass">
        <div class="h-left">
            <div class="brand">
                <span class="brand-en shimmer-text">LUCKY DRAW</span>
                <span class="brand-zh">幸運抽獎 · 尾數</span>
            </div>
            <select id="header-prize-name" class="prize-select" required>
                <option value="" disabled selected hidden>請選擇獎項</option>
            </select>
        </div>
        <div class="h-right">
            <div class="drawn"><span class="drawn-label">已出</span><span id="drawn-history" style="display:flex;gap:6px"></span></div>
            <div class="pool"><div class="pool-label">可抽獎</div><div class="pool-val" id="pool-count">...</div></div>
        </div>
    </header>

    <main id="display-area">
        <section id="pane-hr" class="split-pane glass-soft">
            <div class="col-header"><span class="col-code">HR</span><span class="col-label">行政單位</span><span class="col-count" id="count-hr"></span></div>
            <div style="position:relative;flex:1;min-height:0;display:flex">
                <div id="list-hr" class="card-container"></div>
                <div class="empty"><span class="empty-ring"></span>等待抽出</div>
            </div>
        </section>
        <section id="pane-fac" class="split-pane glass-soft">
            <div class="col-header"><span class="col-code">FAC</span><span class="col-label">廠務單位</span><span class="col-count" id="count-fac"></span></div>
            <div style="position:relative;flex:1;min-height:0;display:flex">
                <div id="list-fac" class="card-container"></div>
                <div class="empty"><span class="empty-ring"></span>等待抽出</div>
            </div>
        </section>
    </main>

    <footer class="glass">
        <div class="controls">
            <div class="digits">
                <label class="digit-box"><span>十位 (選填)</span>
                    <span class="porthole"><input type="text" id="input-10" maxlength="1" inputmode="numeric" pattern="[0-9]*" placeholder="-"></span></label>
                <label class="digit-box req"><span>個位 (必填)</span>
                    <span class="porthole"><input type="text" id="input-1" maxlength="1" inputmode="numeric" pattern="[0-9]*" required placeholder="-"></span></label>
            </div>
            <button type="button" class="btn-aqua glow btn-action" id="btn-draw-normal"><span class="sweep"></span><i class="bi bi-play-fill"></i><span>抽出</span></button>
            <button type="button" class="btn-addon btn-action" id="btn-draw-addon"><i class="bi bi-stars"></i><span>加碼抽出</span></button>
        </div>
        <div id="msg-area"></div>
    </footer>
</div>

<script src="{{ url_for('static', filename='js/ocean-fx.js') }}?v=20261118"></script>
<script>
    const listHrEl = document.getElementById('list-hr');
    const listFacEl = document.getElementById('list-fac');
    const paneHr = document.getElementById('pane-hr');
    const paneFac = document.getElementById('pane-fac');
    const countHr = document.getElementById('count-hr');
    const countFac = document.getElementById('count-fac');

    const btnDrawNormal = document.getElementById('btn-draw-normal');
    const btnDrawAddon = document.getElementById('btn-draw-addon');

    const input10 = document.getElementById('input-10');
    const input1 = document.getElementById('input-1');
    const prizeSelect = document.getElementById('header-prize-name');
    const msgArea = document.getElementById('msg-area');

    function esc(v) {
        return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fx(opts) { if (window.OceanFX) OceanFX.burst(innerWidth / 2, innerHeight / 2, opts); }
    function showMsg(text) { msgArea.innerText = text || ''; }

    // 只允許數字；十位輸入後跳到個位
    [input10, input1].forEach(el => el.addEventListener('input', () => { el.value = el.value.replace(/\D/g, '').slice(-1); showMsg(''); }));
    input10.addEventListener('input', e => { if (e.target.value) input1.focus(); });
    input1.addEventListener('keyup', e => { if (e.key === 'Enter') performDraw(false); });

    document.addEventListener('DOMContentLoaded', () => {
        loadPrizes();
        fetchData();
        let resizeTimer = null;
        window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitCardsToScreen, 150); });
        if (prizeSelect) prizeSelect.focus();
    });

    // 監聽獎項切換事件：載入該獎項已開出的名單
    prizeSelect.addEventListener('change', async function() {
        const prizeName = this.value;

        input10.value = '';
        input1.value = '';
        showMsg('');
        listHrEl.innerHTML = '';
        listFacEl.innerHTML = '';
        fitCardsToScreen();

        if (!prizeName) return;

        try {
            const res = await fetch("{{ url_for('lottery.api_query_prize') }}", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ prize_name: prizeName })
            });
            const data = await res.json();

            if (data.success && data.drawn) {
                // 自動帶入號碼 (取該獎項最新開出的一組)
                if (data.tail_numbers && data.tail_numbers.length > 0) {
                    const numStr = data.tail_numbers[0].toString();
                    input1.value = numStr.slice(-1);
                    if (numStr.length >= 2) input10.value = numStr.slice(-2, -1);
                }

                if (data.winners && data.winners.length > 0) {
                    appendWinners(data.winners, w => !!w.is_addon);
                }
            }
        } catch (e) {
            console.error("無法載入獎項紀錄:", e);
        }
    });

    // 載入獎項 (含剩餘數量顯示)
    async function loadPrizes() {
        try {
            const res = await fetch("{{ url_for('lottery.api_get_prizes', type='tail') }}");
            const data = await res.json();

            if (data.success) {
                const currentVal = prizeSelect.value;
                prizeSelect.innerHTML = '<option value="" disabled selected hidden>請選擇獎項</option>';

                if (data.prizes.length === 0) {
                    const opt = document.createElement('option');
                    opt.innerText = "(後台未設定獎項)";
                    opt.disabled = true;
                    prizeSelect.appendChild(opt);
                } else {
                    data.prizes.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.name;
                        opt.dataset.remaining = p.remaining;
                        if (p.remaining > 0) {
                            opt.innerText = `${p.name} (剩 ${p.remaining})`;
                        } else {
                            const over = Math.abs(p.remaining);
                            opt.innerText = `${p.name} (已滿${over > 0 ? ' + 加碼' + over : ''})`;
                        }
                        prizeSelect.appendChild(opt);
                    });
                }

                if (currentVal && Array.from(prizeSelect.options).some(o => o.value === currentVal)) {
                    prizeSelect.value = currentVal;
                }
            }
        } catch (e) { console.error("無法載入獎項", e); }
    }

    async function fetchData() {
        try {
            const response = await fetch("{{ url_for('lottery.api_get_data') }}");
            const data = await response.json();
            document.getElementById('pool-count').innerText = data.available_count;
            document.getElementById('drawn-history').innerHTML = data.drawn_numbers_list.map(n => `<span class="drawn-chip">${esc(n)}</span>`).join('');
            return data.drawn_numbers_list;
        } catch (e) { return []; }
    }

    function getFullNumber() {
        return (input10.value || '') + input1.value;
    }

    btnDrawNormal.addEventListener('click', () => performDraw(false));
    btnDrawAddon.addEventListener('click', () => performDraw(true));

    async function performDraw(isAddon) {
        if (btnDrawNormal.disabled) return;
        const suffix = getFullNumber();
        const prizeName = prizeSelect.value;

        if (!prizeName) { showMsg('請選擇獎項'); prizeSelect.focus(); return; }
        if (!input1.value) { showMsg('請輸入號碼（個位必填）'); input1.focus(); return; }

        // 檢查數量 (若非加碼)
        const selectedOption = prizeSelect.options[prizeSelect.selectedIndex];
        const remaining = parseInt(selectedOption.dataset.remaining || 0);
        if (!isAddon && remaining <= 0) {
            showMsg(`【${prizeName}】數量已全數抽出！如欲加碼，請按「加碼抽出」。`);
            return;
        }

        const drawnList = await fetchData();
        if (drawnList.includes(suffix)) { showMsg(`號碼 ${suffix} 已經抽過了`); return; }

        const confirmMsg = isAddon
            ? `確認要【加碼抽出】獎項：${prizeName} (尾數 ${suffix})？\n這將會記錄到資料庫。`
            : `確認要【一般抽出】獎項：${prizeName} (尾數 ${suffix})？\n這將會清空畫面並抽出新名單。`;
        if (!confirm(confirmMsg)) return;

        setLoading(true);
        showMsg('');

        try {
            const res = await fetch("{{ url_for('lottery.api_draw') }}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prize_name: prizeName, suffix: suffix, is_addon: isAddon })
            });
            const result = await res.json();

            if (result.success) {
                if (!isAddon) {
                    listHrEl.innerHTML = '';
                    listFacEl.innerHTML = '';
                }

                if (result.winners.length === 0) {
                    showMsg(`號碼 ${suffix} 沒有人中獎`);
                    fitCardsToScreen();
                } else if (isAddon) {
                    result.winners.forEach(w => highlightExistingCard(w.employee_id));
                    fx({ count: 120, gold: .9 });
                } else {
                    appendWinners(result.winners, () => false);
                    fx({ count: 170 });
                }
                await loadPrizes();
            } else {
                showMsg(result.message);
            }
            fetchData();
        } catch (err) {
            showMsg("伺服器錯誤: " + err);
        } finally {
            setLoading(false);
        }
    }

    function appendWinners(winners, isBonus) {
        const hr = document.createDocumentFragment(), fac = document.createDocumentFragment();
        let iHr = listHrEl.children.length, iFac = listFacEl.children.length;
        winners.forEach(w => {
            const toHr = !!(w.site && w.site.toUpperCase().includes('HR'));
            const card = createCard(w, toHr ? iHr++ : iFac++);
            if (isBonus(w)) markBonus(card);
            (toHr ? hr : fac).appendChild(card);
        });
        listHrEl.appendChild(hr);
        listFacEl.appendChild(fac);
        fitCardsToScreen();
    }

    function createCard(winner, index) {
        const div = document.createElement('div');
        div.className = 'winner-card';
        div.dataset.eid = winner.employee_id;
        div.style.animationDelay = Math.min(index * 0.06, 1.5).toFixed(2) + 's';
        div.innerHTML = `
            <div class="winner-name">${esc(winner.name)}</div>
            ${winner.is_business_trip ? '<div class="winner-biz">(公差)</div>' : ''}
            <div class="winner-info">${esc(winner.employee_id)}</div>
            <div class="winner-num">${esc(winner.lottery_number || '')}</div>`;
        return div;
    }

    function markBonus(card) {
        if (card.classList.contains('bonus-highlight')) return;
        card.classList.add('bonus-highlight');
        const sheen = document.createElement('span');
        sheen.className = 'sweep soft';
        card.prepend(sheen);
    }

    function highlightExistingCard(employeeId) {
        const card = document.querySelector(`.winner-card[data-eid="${CSS.escape(employeeId)}"]`);
        if (card) markBonus(card);
    }

    function setLoading(isLoading) {
        btnDrawNormal.disabled = isLoading;
        btnDrawAddon.disabled = isLoading;
    }

    // --- 核心縮放：二分搜尋最大可容納字級（約 8 次版面計算，原本最多 55 次） ---
    function fitCardsToScreen() {
        const hrCount = listHrEl.children.length;
        const facCount = listFacEl.children.length;
        countHr.innerText = hrCount ? `${hrCount} 人` : '';
        countFac.innerText = facCount ? `${facCount} 人` : '';

        // 若某一邊完全沒人，隱藏它，讓另一邊獨佔
        paneHr.hidden = hrCount === 0 && facCount > 0;
        paneFac.hidden = facCount === 0 && hrCount > 0;

        const root = document.documentElement.style;
        const over = el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;
        const overflow = () => (!paneHr.hidden && over(listHrEl)) || (!paneFac.hidden && over(listFacEl));

        let lo = 8, hi = 96; // px
        root.setProperty('--card-base-size', hi + 'px');
        if (!overflow()) return;
        while (hi - lo > 1) {
            const mid = Math.floor((lo + hi) / 2);
            root.setProperty('--card-base-size', mid + 'px');
            if (overflow()) hi = mid; else lo = mid;
        }
        root.setProperty('--card-base-size', lo + 'px');
    }
    fitCardsToScreen();
</script>
</body>
</html>
