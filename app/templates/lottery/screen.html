<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運抽獎 (尾數)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-base-size: 1.2rem; /* JS 會動態調整這個數值 */
        }
        /* 修改後的尾數獎背景樣式 */
        body {
            background: linear-gradient(270deg, #8b0000, #d32f2f, #b71c1c, #fdb931);
            background-size: 400% 400%;
            animation: gradient-animation 15s ease infinite;
            color: #fff;
            font-family: 'Noto Sans TC', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 讓漸層流動感更平滑 */
        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 建議同步微調 header 背景透明度，讓紅色透出來 */
        header { 
            padding: 0.8rem 1.5rem; 
            flex-shrink: 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: rgba(0, 0, 0, 0.3); /* 加深一點透明黑 */
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .header-left { display: flex; align-items: center; gap: 20px; }

        .main-title { 
            font-family: 'Orbitron', sans-serif; 
            font-weight: 900; font-size: 2rem; 
            color: #fff; text-shadow: 0 0 10px #fff; margin: 0; 
        }

        /* 下拉選單樣式 */
        .prize-input-header {
            background: transparent;
            border: none;
            border-bottom: 2px solid #ffd700;
            color: #ffd700;
            font-size: 2rem;
            font-weight: bold;
            width: 450px;
            text-align: center;
            padding: 0 10px;
            font-family: 'Noto Sans TC', sans-serif;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align-last: center; 
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFD700%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 10px top 50%;
            background-size: 15px auto;
        }
        .prize-input-header:focus { outline: none; background: rgba(255, 215, 0, 0.1); }
        .prize-input-header option { background-color: #302b63; color: #fff; font-size: 1.2rem; padding: 10px; }

        .status-info { color: #ccc; font-size: 0.9rem; text-align: right; }
        #pool-count { color: #00ffea; font-weight: bold; }

        /* 主顯示區 */
        main { 
            flex-grow: 1; 
            display: flex; 
            width: 100%; height: 100%;
            overflow: hidden;
            position: relative;
            padding: 10px 20px;
            gap: 15px;
        }
        
        .split-pane {
            flex: 1; /* 預設平分 */
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.5s ease; /* 加入過渡效果 */
        }
        
        /* 當某個區塊隱藏時，另一個會自動 flex-grow 佔滿 */
        .split-pane[style*="display: none"] { flex: 0; padding: 0; border: 0; }

        .col-header {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 2px solid rgba(255,255,255,0.15);
            flex-shrink: 0; 
        }
        .col-header.hr { color: #ff9ff3; }
        .col-header.fac { color: #54a0ff; }

        /* 卡片容器 */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start; /* 讓內容從上面開始排 */
            justify-content: center;   /* 水平置中 */
            gap: 0.5em;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 超出隱藏，由 JS 控制字體大小來適應 */
        }

        /* 卡片本體 */
        .winner-card {
            background: linear-gradient(145deg, #fefde8, #f8d7a0);
            color: #333;
            border-radius: 8px;
            border: 2px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            
            /* 關鍵：寬度與內距都跟著字體大小縮放 */
            width: 9em; 
            padding: 0.5em 0.2em;
            
            /* 字體大小由 CSS 變數控制 */
            font-size: var(--card-base-size); 
            
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            
            animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0; transform: scale(0.5);
        }
        
        .winner-name { 
            font-weight: 800; 
            /* (*** 修改 1：將字體從 1.2em 加大到 1.5em ***) */
            font-size: 1.5em; 
            line-height: 1.2; 
            width: 100%; 
            text-align: center; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .winner-info { font-size: 0.7em; opacity: 0.8; margin-top: 0.1em; }
        .winner-num { font-family: 'Orbitron', sans-serif; font-weight: bold; color: #d63031; font-size: 0.9em; margin-top: 0.1em; }

        @keyframes pop-in { to { opacity: 1; transform: scale(1); } }

        .winner-card.bonus-highlight {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: #fff !important;
            border: 3px solid #ffd700 !important;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            transform: scale(1.05);
            z-index: 10;
        }
        .winner-card.bonus-highlight .winner-num { color: #ffd700; }

        /* 底部控制區 */
        footer { 
            padding: 10px; 
            background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(10px); 
            flex-shrink: 0;
        }
        .controls { max-width: 800px; margin: auto; }
        
        .digit-input-group { display: flex; gap: 15px; justify-content: center; align-items: flex-end; }
        .digit-box label { display: block; color: #ccc; font-size: 0.9rem; margin-bottom: 5px; text-align: center; }
        .digit-box input { 
            width: 80px; height: 80px; 
            font-size: 2.5rem; text-align: center; 
            background: rgba(0,0,0,0.5); color: #fff; 
            border: 2px solid #555; border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
        }
        .digit-box input:focus { border-color: #00ffea; outline: none; box-shadow: 0 0 15px rgba(0, 255, 234, 0.3); }
        .btn-action { height: 60px; font-weight: bold; border-radius: 8px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <h1 class="main-title">LUCKY DRAW</h1>
            <select id="header-prize-name" class="prize-input-header" required>
                <option value="" disabled selected hidden>請選擇獎項</option>
            </select>
        </div>
        
        <div class="status-info">
            <div>可抽獎: <span id="pool-count">...</span></div>
            <div class="small text-muted" style="max-width: 400px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">已出: <span id="drawn-history">...</span></div>
        </div>
    </header>

    <main id="display-area">
        <div id="pane-hr" class="split-pane">
            <div class="col-header hr">HR <small style="font-size:0.5em">行政單位</small></div>
            <div id="list-hr" class="card-container"></div>
        </div>
        
        <div id="pane-fac" class="split-pane">
            <div class="col-header fac">FAC <small style="font-size:0.5em">廠務單位</small></div>
            <div id="list-fac" class="card-container"></div>
        </div>
    </main>
    
    <footer>
        <div class="controls">
            <form id="draw-form" class="row g-3 align-items-end justify-content-center">
                <div class="col-md-6">
                    <div class="digit-input-group">
                        <div class="digit-box">
                            <label>十位 (選填)</label>
                            <input type="text" id="input-10" maxlength="1" pattern="[0-9]*" placeholder="-">
                        </div>
                        <div class="digit-box">
                            <label>個位 (必填)</label>
                            <input type="text" id="input-1" maxlength="1" pattern="[0-9]*" required style="border-color: #f5af19;" placeholder="-">
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <button type="button" class="btn btn-warning w-100 btn-action" id="btn-draw-normal">
                        <i class="bi bi-play-fill"></i> 抽出
                    </button>
                </div>
                <div class="col-md-3">
                    <button type="button" class="btn btn-outline-info w-100 btn-action" id="btn-draw-addon">
                        <i class="bi bi-stars"></i> 加碼抽出
                    </button>
                </div>
            </form>
        </div>
    </footer>

    <script>
        const listHrEl = document.getElementById('list-hr');
        const listFacEl = document.getElementById('list-fac');
        const paneHr = document.getElementById('pane-hr');
        const paneFac = document.getElementById('pane-fac');
        
        const btnDrawNormal = document.getElementById('btn-draw-normal');
        const btnDrawAddon = document.getElementById('btn-draw-addon');
        
        const input10 = document.getElementById('input-10');
        const input1 = document.getElementById('input-1');
        const prizeSelect = document.getElementById('header-prize-name');

        // 輸入跳格邏輯 (從十位跳個位)
        input10.addEventListener('input', (e) => { if(e.target.value) input1.focus(); });

        document.addEventListener('DOMContentLoaded', () => {
            loadPrizes();
            fetchData();
            window.addEventListener('resize', fitCardsToScreen);
            if(prizeSelect) prizeSelect.focus();
        });

        // (*** 新增：監聽獎項切換事件 ***)
    prizeSelect.addEventListener('change', async function() {
        const prizeName = this.value;
        
        // 1. 重置畫面 (清空輸入框與名單)
        input10.value = '';
        input1.value = '';
        listHrEl.innerHTML = '';
        listFacEl.innerHTML = '';
        
        // 強制重設版面配置 (顯示兩欄)
        paneHr.style.display = 'flex';
        paneFac.style.display = 'flex';
        
        if (!prizeName) return;

        // 2. 呼叫 API 查詢該獎項歷史
        try {
            const res = await fetch("{{ url_for('lottery.api_query_prize') }}", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ prize_name: prizeName })
            });
            const data = await res.json();

            if (data.success && data.drawn) {
                console.log(`載入獎項 [${prizeName}] 紀錄:`, data);

                // A. 自動帶入號碼 (取該獎項最新開出的一組)
                if (data.tail_numbers && data.tail_numbers.length > 0) {
                    const latestNum = data.tail_numbers[0];
                    const numStr = latestNum.toString();
                    
                    if (numStr.length === 1) {
                        input1.value = numStr;
                    } else if (numStr.length >= 2) {
                        input1.value = numStr.slice(-1);       // 個位
                        input10.value = numStr.slice(-2, -1);  // 十位
                    }
                }

                // B. 重新渲染中獎名單
                if (data.winners && data.winners.length > 0) {
                    data.winners.forEach(w => {
                        const card = createCard(w);
                        
                        // (*** 關鍵：如果是加碼中獎者，加上特效類別 ***)
                        if (w.is_addon) {
                            card.classList.add('bonus-highlight');
                        }

                        // 依照站點分流
                        if (w.site && w.site.toUpperCase().includes('HR')) {
                            listHrEl.appendChild(card);
                        } else {
                            listFacEl.appendChild(card);
                        }
                    });
                    
                    // C. 執行縮放
                    setTimeout(fitCardsToScreen, 100);
                }
            }
        } catch (e) {
            console.error("無法載入獎項紀錄:", e);
        }
    });


        // 載入獎項 (含剩餘數量顯示)
        async function loadPrizes() {
            try {
                const res = await fetch("{{ url_for('lottery.api_get_prizes', type='tail') }}");
                const data = await res.json();
                
                if(data.success) {
                    const currentVal = prizeSelect.value;
                    prizeSelect.innerHTML = '<option value="" disabled selected hidden>請選擇獎項</option>';
                    
                    if (data.prizes.length === 0) {
                        const opt = document.createElement('option');
                        opt.innerText = "(後台未設定獎項)";
                        opt.disabled = true;
                        prizeSelect.appendChild(opt);
                    } else {
                        data.prizes.forEach(p => {
                            const opt = document.createElement('option');
                            opt.value = p.name;
                            opt.dataset.remaining = p.remaining; 

                            if (p.remaining > 0) {
                                opt.innerText = `${p.name} (剩 ${p.remaining})`;
                            } else {
                                const over = Math.abs(p.remaining);
                                opt.innerText = `${p.name} (已滿${over > 0 ? ' + 加碼'+over : ''})`;
                            }
                            prizeSelect.appendChild(opt);
                        });
                    }

                    if (currentVal) {
                        const exists = Array.from(prizeSelect.options).some(o => o.value === currentVal);
                        if (exists) prizeSelect.value = currentVal;
                    }
                }
            } catch (e) { console.error("無法載入獎項", e); }
        }

        async function fetchData() {
            try {
                const response = await fetch("{{ url_for('lottery.api_get_data') }}");
                const data = await response.json();
                document.getElementById('pool-count').innerText = data.available_count;
                document.getElementById('drawn-history').innerText = data.drawn_numbers_list.join(", ");
                return data.drawn_numbers_list;
            } catch (e) { return []; }
        }

        function getFullNumber() {
            let suffix = "";
            if (input10.value) suffix += input10.value;
            suffix += input1.value;
            return suffix;
        }

        btnDrawNormal.addEventListener('click', () => performDraw(false));
        btnDrawAddon.addEventListener('click', () => performDraw(true));

        async function performDraw(isAddon) {
            const suffix = getFullNumber();
            const prizeName = prizeSelect.value;
            
            if (!suffix) return alert("請輸入號碼");
            if (!prizeName) return alert("請選擇獎項");
            if (!input1.checkValidity()) return alert("請輸入有效數字");

            // 檢查數量 (若非加碼)
            const selectedOption = prizeSelect.options[prizeSelect.selectedIndex];
            const remaining = parseInt(selectedOption.dataset.remaining || 0);

            if (!isAddon && remaining <= 0) {
                return alert(`【${prizeName}】數量已全數抽出！\n\n如欲加碼，請點擊右側藍色的「加碼抽出」按鈕。`);
            }

            const drawnList = await fetchData();
            if (drawnList.includes(suffix)) return alert(`號碼 ${suffix} 已經抽過了`);

            let confirmMsg = isAddon 
                ? `確認要【加碼抽出】獎項：${prizeName} (尾數 ${suffix})？\n這將會記錄到資料庫。`
                : `確認要【一般抽出】獎項：${prizeName} (尾數 ${suffix})？\n這將會清空畫面並抽出新名單。`;

            if(!confirm(confirmMsg)) return;

            setLoading(true);

            try {
                const res = await fetch("{{ url_for('lottery.api_draw') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prize_name: prizeName, 
                        suffix: suffix,
                        is_addon: isAddon 
                    })
                });
                const result = await res.json();

                if (result.success) {
                    if (!isAddon) {
                        listHrEl.innerHTML = '';
                        listFacEl.innerHTML = '';
                    }

                    if (result.winners.length === 0) {
                        alert(`號碼 ${suffix} 沒有人中獎`);
                    } else {
                        result.winners.forEach(w => {
                            if (isAddon) {
                                highlightExistingCard(w.employee_id);
                            } else {
                                const card = createCard(w);
                                if (w.site && w.site.toUpperCase().includes('HR')) {
                                    listHrEl.appendChild(card);
                                } else {
                                    listFacEl.appendChild(card);
                                }
                            }
                        });
                        // 確保畫面更新後再執行縮放
                        setTimeout(fitCardsToScreen, 50);
                    }
                    await loadPrizes(); 
                } else {
                    alert(result.message);
                }
                fetchData();
            } catch (err) {
                alert("伺服器錯誤: " + err);
            } finally {
                setLoading(false);
            }
        }

        function createCard(winner) {
            const div = document.createElement('div');
            div.className = 'winner-card';
            div.dataset.eid = winner.employee_id;
            
            // (*** 修改：加入公差標示邏輯 ***)
            let bizHtml = '';
            if (winner.is_business_trip) {
                // 使用深藍色或對比色顯示
                bizHtml = '<div style="font-size:0.6em; color:#0056b3; font-weight:bold; margin-bottom:2px;">(公差)</div>';
            }

            div.innerHTML = `
                <div class="winner-name">${winner.name}</div>
                ${bizHtml} <div class="winner-info">${winner.employee_id}</div>
                <div class="winner-num">${winner.lottery_number || ''}</div>
            `;
            return div;
        }

        function highlightExistingCard(employeeId) {
            const card = document.querySelector(`.winner-card[data-eid="${employeeId}"]`);
            if (card) card.classList.add('bonus-highlight');
        }

        function setLoading(isLoading) {
            btnDrawNormal.disabled = isLoading;
            btnDrawAddon.disabled = isLoading;
        }

        // --- 核心縮放邏輯 ---
        function fitCardsToScreen() {
            // 1. 偵測單欄/雙欄模式
            const hrCount = listHrEl.children.length;
            const facCount = listFacEl.children.length;

            // 預設全部顯示
            paneHr.style.display = 'flex';
            paneFac.style.display = 'flex';

            // 若某一邊完全沒人，隱藏它，讓另一邊獨佔
            if (hrCount === 0 && facCount > 0) {
                paneHr.style.display = 'none';
            } else if (facCount === 0 && hrCount > 0) {
                paneFac.style.display = 'none';
            }

            // 2. 由大到小嘗試字體大小
            // (*** 修改 2：將起始最大字體從 4.0 調整到 6.0，讓少人時更巨大 ***)
            let size = 6.0; 
            const minSize = 0.5; // 最小字體
            
            // 強制重設為最大，準備開始測量
            document.documentElement.style.setProperty('--card-base-size', `${size}rem`);

            while (size > minSize) {
                let hasOverflow = false;

                // 檢查顯示中的區塊是否溢位
                if (paneHr.style.display !== 'none' && listHrEl.scrollHeight > listHrEl.clientHeight) hasOverflow = true;
                if (paneFac.style.display !== 'none' && listFacEl.scrollHeight > listFacEl.clientHeight) hasOverflow = true;

                if (!hasOverflow) break; // 塞得下，停止縮小

                size -= 0.1;
                document.documentElement.style.setProperty('--card-base-size', `${size}rem`);
            }
        }
    </script>
</body>
</html>
