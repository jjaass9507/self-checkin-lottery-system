<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站點暫停服務</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ocean.css') }}?v=20261118">
    <style>
        .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .box { width: 100%; max-width: 440px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .orb-wrap { position: relative; width: 170px; height: 170px; margin-bottom: 36px; animation: bob 5s ease-in-out infinite; }
        .orb-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(190, 245, 255, .5); animation: ring 3s ease-out infinite; }
        .orb {
            position: absolute; inset: 0; border-radius: 50%;
            background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .55), rgba(160, 235, 255, .12) 30%, rgba(6, 42, 68, .6) 65%, rgba(190, 245, 255, .4) 100%);
            border: 1px solid rgba(220, 250, 255, .55);
            box-shadow: inset 0 -14px 30px rgba(126, 240, 224, .25), 0 30px 60px rgba(0, 8, 22, .5);
            display: flex; align-items: center; justify-content: center; font-size: 64px; color: var(--ink);
        }
        .station-name { font: 900 40px 'Noto Sans TC', sans-serif; margin: 16px 0; letter-spacing: .1em; }
        .notice { margin: 0; color: var(--muted); font-size: 18px; line-height: 1.9; }
    </style>
</head>
<body>
<ocean-scene palette="lagoon" intensity="1"></ocean-scene>

<div class="page ocean-layer">
    <div class="box">
        <div class="orb-wrap">
            <div class="orb-ring"></div>
            <div class="orb"><i class="bi bi-pause-fill"></i></div>
        </div>
        <div class="eyebrow">STATION PAUSED</div>
        <div class="station-name">{{ station }}</div>
        <p class="notice">本站點目前暫停服務<br>請洽現場管理人員</p>
    </div>
</div>

<script src="{{ url_for('static', filename='js/ocean-fx.js') }}?v=20261118"></script>
</body>
</html>
