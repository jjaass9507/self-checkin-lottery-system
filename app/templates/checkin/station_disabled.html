<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站點暫停服務</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(160deg, #e0f2fe 0%, #f0fdf4 50%, #fef9c3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .card-disabled {
            background: #fff;
            border: 1px solid #bae6fd;
            border-radius: 20px;
            padding: 56px 48px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(2, 132, 199, 0.1);
        }
        .icon-wrap {
            font-size: 4rem;
            color: #94a3b8;
            margin-bottom: 16px;
        }
        .station-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0369a1;
            margin-bottom: 8px;
        }
        .notice {
            color: #64748b;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="card-disabled">
        <div class="icon-wrap"><i class="bi bi-pause-circle"></i></div>
        <div class="station-name">{{ station }}</div>
        <p class="notice mb-0">本站點目前暫停服務<br>請洽現場管理人員</p>
    </div>
</body>
</html>
