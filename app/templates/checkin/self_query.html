<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>座位/中獎查詢站</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* 背景改為稍微不同的色調 (例如偏藍綠)，以區分報到站 */
        body {
            background: linear-gradient(135deg, #000428, #004e92);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-family: 'Noto Sans TC', sans-serif; overflow: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .checkin-card {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px; padding: 40px;
            width: 90%; max-width: 480px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center; position: relative; overflow: hidden;
        }
        .title-icon {
            font-size: 3.5rem;
            background: linear-gradient(to bottom, #00c6ff, #0072ff); /* 藍色系圖示 */
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .main-title { font-weight: 700; margin-bottom: 30px; letter-spacing: 2px; text-transform: uppercase; }
        .form-control-lg {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff !important; text-align: center; font-size: 1.5rem; letter-spacing: 2px; border-radius: 12px;
        }
        .form-control-lg:focus { background: rgba(255, 255, 255, 0.2); border-color: #00c6ff; outline: none; }
        
        .btn-query {
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            border: none; color: #fff; font-weight: 800; font-size: 1.2rem;
            padding: 12px; border-radius: 12px; margin-top: 20px; width: 100%;
        }
        .btn-query:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 198, 255, 0.4); }

        .result-box {
            margin-top: 30px; padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1);
            display: none; animation: slideUp 0.5s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .lottery-badge-container {
            margin: 15px 0; padding: 10px;
            background: rgba(0, 255, 234, 0.1); border-radius: 10px; border: 1px solid rgba(0, 255, 234, 0.3);
        }
        .lottery-num-display { font-family: 'Orbitron'; font-size: 2.5rem; color: #00ffea; font-weight: bold; }
        .table-badge { font-family: 'Orbitron'; font-size: 4rem; font-weight: 900; color: #FFD700; margin: 10px 0 20px 0; }
        .res-label { font-size: 0.9rem; color: #aaa; margin-bottom: 5px; }
        .prize-card { background: linear-gradient(45deg, #e52d27, #b31217); color: white; padding: 15px; border-radius: 10px; font-weight: bold; margin-top:10px;}
        .prize-card.no-prize { background: rgba(255,255,255,0.1); color: #ccc; font-weight: normal; }
    </style>
</head>
<body>
    <div class="checkin-card">
        <i class="bi bi-search title-icon"></i>
        <h2 class="main-title">資訊查詢站</h2>
        
        <div class="mb-3">
            <input type="text" id="emp-id" class="form-control form-control-lg" placeholder="請輸入工號" autocomplete="off" autofocus>
        </div>
        
        <button class="btn btn-query" id="btn-submit">
            <i class="bi bi-search me-1"></i> 開始查詢
        </button>

        <div id="msg-area" class="text-warning fw-bold mt-3"></div>

        <div id="result-area" class="result-box">
            <h3 id="res-name" class="fw-bold text-white mb-1"></h3>
            <div id="res-id" class="text-white-50 small mb-3"></div>
            
            <div class="lottery-badge-container">
                <div class="res-label" style="color: #00ffea;">抽獎編號</div>
                <div class="lottery-num-display" id="res-lottery-num">---</div>
            </div>

            <div class="border-top border-secondary pt-3">
                <div class="res-label">您的桌次</div>
                <div class="table-badge"><span id="res-table">-</span></div>
            </div>

            <div id="prize-container"></div>
        </div>
    </div>

    <script>
        const empInput = document.getElementById('emp-id');
        const btnSubmit = document.getElementById('btn-submit');
        const msgArea = document.getElementById('msg-area');
        const resultArea = document.getElementById('result-area');
        const resName = document.getElementById('res-name');
        const resId = document.getElementById('res-id');
        const resLotteryNum = document.getElementById('res-lottery-num');
        const resTable = document.getElementById('res-table');
        const prizeContainer = document.getElementById('prize-container');

        // 監聽 Enter
        empInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') doSearch(); });
        btnSubmit.addEventListener('click', doSearch);

        async function doSearch() {
            const empId = empInput.value.trim();
            if (!empId) { msgArea.innerText = "請輸入工號！"; return; }

            msgArea.innerText = "查詢中...";
            resultArea.style.display = 'none';
            btnSubmit.disabled = true;

            try {
                // *** 關鍵：呼叫純查詢 API ***
                const res = await fetch("{{ url_for('checkin.api_search_by_id') }}", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ employee_id: empId })
                });
                const data = await res.json();

                if (data.success) {
                    msgArea.innerText = "";
                    resName.innerText = data.name;
                    resId.innerText = data.employee_id;
                    resLotteryNum.innerText = data.lottery_number || "---";
                    resTable.innerText = data.table_number || "未分配";
                    
                    if (data.is_winner) {
                        prizeContainer.innerHTML = `<div class="prize-card"><i class="bi bi-gift-fill me-2"></i>${data.prize_info}</div>`;
                    } else {
                        prizeContainer.innerHTML = `<div class="prize-card no-prize">${data.prize_info}</div>`;
                    }

                    resultArea.style.display = 'block';
                    
                    // 查詢模式下，資料顯示 8 秒後消失，比報到久一點
                    setTimeout(resetForm, 8000);
                } else {
                    msgArea.innerText = data.message;
                    setTimeout(() => { msgArea.innerText = ''; }, 2000);
                }
            } catch (e) {
                msgArea.innerText = "連線錯誤";
            } finally {
                btnSubmit.disabled = false;
                empInput.focus(); // 保持焦點
            }
        }

        function resetForm() {
            empInput.value = '';
            resultArea.style.display = 'none';
            msgArea.innerText = '';
            empInput.focus();
        }
    </script>
</body>
</html>
