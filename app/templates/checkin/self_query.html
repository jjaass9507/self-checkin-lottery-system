<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資訊查詢</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ocean.css') }}?v=20261118">
    <style>
        .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 96px 20px 64px; }
        .form-col { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        h1 { margin: 18px 0 10px; font: 900 64px/1.05 'Noto Sans TC', sans-serif; letter-spacing: .1em; }
        .lead { margin: 0 0 34px; color: var(--muted); font-size: 16px; letter-spacing: .06em; }

        .search-bar { width: 100%; display: flex; gap: 10px; padding: 8px; border-radius: 28px; background: rgba(6, 40, 66, .72); border: 1px solid rgba(190, 245, 255, .26); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 20px 50px rgba(0, 12, 30, .35); transition: border-color .2s; }
        .search-bar:focus-within { border-color: var(--aqua); }
        .search-bar.is-invalid { border-color: var(--error); animation: shake .3s; }
        #emp-id { flex: 1; min-width: 0; height: 64px; background: transparent; border: 0; color: #fff; text-align: center; font: 600 24px var(--num-font); letter-spacing: .16em; outline: none; }
        #emp-id::placeholder { letter-spacing: .14em; font-family: 'Noto Sans TC', sans-serif; }
        #btn-submit { flex-shrink: 0; height: 64px; padding: 0 26px; border-radius: 20px; font-size: 17px; letter-spacing: .1em; white-space: nowrap; gap: 8px; }
        #msg-area { min-height: 26px; margin-top: 14px; font-size: 16px; font-weight: 700; color: var(--error); }

        .result { width: 100%; max-width: 860px; margin-top: 8px; display: flex; flex-direction: column; gap: 30px; }
        .ticket-wrap { perspective: 1400px; animation: rise .7s cubic-bezier(.2, .9, .25, 1.1) both; }
        .q-grid { position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; padding: 20px; }
        .q-info { padding: 10px 12px; text-align: left; }
        .pill-wait { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(190, 245, 255, .25); color: var(--dim); font-size: 13px; font-weight: 700; }
        .q-name { font: 900 38px/1.15 'Noto Sans TC', sans-serif; margin: 14px 0 8px; letter-spacing: .06em; word-break: break-all; }
        .q-id { font: 600 14px var(--num-font); color: var(--muted); }
        .q-grid .num-box { padding: 18px 16px; }
        .q-grid .num-val { font-size: 60px; }
        .q-grid .num-val.small { font-size: 36px; line-height: 1.7; }
        .q-cut { margin: 0 30px; }
        .q-foot { position: relative; padding: 18px 30px 24px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .q-foot .prize { flex: 1; min-width: 240px; }

        .dep-header { display: flex; align-items: center; gap: 14px; color: var(--ink-2); font-size: 16px; font-weight: 700; letter-spacing: .12em; }
        .dep-header .rule { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(190, 245, 255, .45)); }
        .dep-header .rule.r { background: linear-gradient(90deg, rgba(190, 245, 255, .45), transparent); }
        .dep-header i { color: var(--aqua); margin-right: 8px; }
        .dep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-top: 18px; }
        .dep-card { border-radius: 24px; padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 12px; animation: rise .7s cubic-bezier(.2, .9, .25, 1.1) both; }
        .dep-top { display: flex; justify-content: space-between; align-items: center; }
        .dep-idx { font: 600 10px var(--num-font); letter-spacing: .3em; color: var(--aqua); }
        .dep-status { font-size: 12px; font-weight: 700; }
        .dep-name { font: 900 24px 'Noto Sans TC', sans-serif; letter-spacing: .04em; }
        .dep-id { font: 400 12px var(--num-font); color: var(--dim); margin-top: 4px; }
        .dep-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .dep-nums > div { padding: 10px; border-radius: 14px; background: rgba(255, 255, 255, .06); text-align: center; }
        .dep-nums > div.gold { background: rgba(242, 196, 109, .08); }
        .dep-nums .lbl { font-size: 11px; color: var(--dim); letter-spacing: .16em; }
        .dep-nums .gold .lbl { color: var(--gold-2); }
        .dep-nums .val { font: 800 30px var(--num-font); }
        .dep-nums .val.small { font-size: 18px; line-height: 1.9; }
        .dep-nums .gold .val { color: var(--gold); }
        .dep-tags { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 700; color: var(--ink-2); }
        .dep-tags span { padding: 5px 10px; border-radius: 10px; background: rgba(255, 255, 255, .08); }
        .dep-tags i { color: var(--aqua); margin-right: 6px; }
        .dep-prize { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
        .dep-prize.win { color: var(--gold); font-weight: 700; }

        @media (max-width: 560px) {
            h1 { font-size: 48px; }
            .q-name { font-size: 30px; }
        }
    </style>
</head>
<body>
<ocean-scene palette="lagoon" intensity="1"></ocean-scene>

<div class="page ocean-layer">
    <div class="form-col">
        <div class="eyebrow"><i class="bi bi-compass"></i>QUERY INFO</div>
        <h1 class="shimmer-text">資訊查詢</h1>
        <p class="lead">查詢報到狀態、桌次與抽獎資訊，不會觸發報到</p>

        <div class="search-bar" id="search-bar">
            <input type="text" id="emp-id" placeholder="請輸入工號查詢" autocomplete="off" autofocus>
            <button class="btn-aqua" id="btn-submit" type="button"><i class="bi bi-search"></i><span id="btn-label">開始查詢</span></button>
        </div>

        <div id="msg-area"></div>
    </div>

    <div id="result-section" class="result" hidden>
        <div class="ticket-wrap" id="ticket-wrap">
            <div class="ticket glass" id="ticket">
                <div class="holo"><div class="holo-band"></div><div class="holo-spot"></div></div>

                <div class="q-grid">
                    <div class="q-info">
                        <div id="res-status"></div>
                        <div class="q-name" id="res-name"></div>
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                            <span class="q-id" id="res-id"></span>
                            <span class="type-chip" id="res-type" hidden></span>
                        </div>
                        <div class="linked" id="res-linked" hidden></div>
                    </div>
                    <div class="num-box" id="res-table-section">
                        <div class="box-label">您的桌次</div>
                        <div class="num-val" id="res-table">-</div>
                    </div>
                    <div class="num-box gold" id="res-lottery-box">
                        <div class="box-label">抽獎號碼</div>
                        <div class="num-val" id="res-lottery-num">---</div>
                    </div>
                </div>

                <div id="res-foot-wrap">
                    <div class="t-cut q-cut"></div>
                    <div class="q-foot">
                        <div class="chip" id="res-meal-box" hidden><i class="bi bi-egg-fried"></i><span id="res-meal-text"></span></div>
                        <div class="chip" id="res-group-box" hidden><i class="bi bi-people-fill"></i><span id="res-group-text"></span></div>
                        <div class="prize" id="prize-container" hidden></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="dep-section" hidden>
            <div class="dep-header">
                <span class="rule"></span>
                <span><i class="bi bi-people-fill"></i>眷屬資訊（<span id="dep-count">0</span> 位）</span>
                <span class="rule r"></span>
            </div>
            <div class="dep-grid" id="dep-grid"></div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/ocean-fx.js') }}?v=20261118"></script>
<script>
    const empInput    = document.getElementById('emp-id');
    const searchBar   = document.getElementById('search-bar');
    const btnSubmit   = document.getElementById('btn-submit');
    const btnLabel    = document.getElementById('btn-label');
    const msgArea     = document.getElementById('msg-area');
    const resultSection = document.getElementById('result-section');
    const ticketWrap  = document.getElementById('ticket-wrap');
    const ticket      = document.getElementById('ticket');

    const resName       = document.getElementById('res-name');
    const resId         = document.getElementById('res-id');
    const resType       = document.getElementById('res-type');
    const resLinked     = document.getElementById('res-linked');
    const resStatus     = document.getElementById('res-status');
    const resLotteryBox = document.getElementById('res-lottery-box');
    const resLotteryNum = document.getElementById('res-lottery-num');
    const resTableSec   = document.getElementById('res-table-section');
    const resTable      = document.getElementById('res-table');
    const resFootWrap   = document.getElementById('res-foot-wrap');
    const resMealBox    = document.getElementById('res-meal-box');
    const resMealText   = document.getElementById('res-meal-text');
    const resGroupBox   = document.getElementById('res-group-box');
    const resGroupText  = document.getElementById('res-group-text');
    const prizeContainer = document.getElementById('prize-container');

    const depSection = document.getElementById('dep-section');
    const depCount   = document.getElementById('dep-count');
    const depGrid    = document.getElementById('dep-grid');

    const TYPE_LABELS = { employee: '員工', dependent: '眷屬', vendor_contact: '外部廠商主要窗口', vendor: '外部廠商' };
    const tilt = window.OceanFX ? OceanFX.tilt(ticketWrap, ticket) : { reset() {} };

    empInput.addEventListener('keyup', e => { if (e.key === 'Enter') doSearch(); });
    btnSubmit.addEventListener('click', doSearch);

    function esc(v) {
        return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function mealLabel(v) { return /^[A-Z]$/i.test(v) ? v.toUpperCase() + ' 餐' : v; }

    async function doSearch() {
        if (btnSubmit.disabled) return;
        const empId = empInput.value.trim();
        if (!empId) { msgArea.innerText = '請輸入工號！'; shakeInput(); return; }

        msgArea.innerText = '';
        resultSection.hidden = true;
        btnSubmit.disabled = true;
        btnLabel.innerText = '查詢中…';

        try {
            const res  = await fetch("{{ url_for('checkin.api_search_by_id') }}", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({employee_id: empId})
            });
            const data = await res.json();

            if (data.success) {
                const fs = data.field_settings || {};
                renderMainCard(data, fs);

                if (data.dependents && data.dependents.length > 0) {
                    depCount.innerText = data.dependents.length;
                    depGrid.innerHTML  = data.dependents.map((dep, i) => buildDepCard(dep, i + 1, fs)).join('');
                    depSection.hidden = false;
                } else {
                    depGrid.innerHTML = '';
                    depSection.hidden = true;
                }

                resultSection.hidden = false;
                ticketWrap.style.animation = 'none';
                void ticketWrap.offsetWidth;
                ticketWrap.style.animation = '';
                tilt.reset();

                rollTo([
                    [resTable, data.table_number || '未分配'],
                    [resLotteryNum, data.lottery_number || '---']
                ]);
                if (window.OceanFX) OceanFX.burst(innerWidth / 2, innerHeight * 0.62, { count: 70, gold: .25, power: 8 });

                resetBtn();
                empInput.select();
            } else {
                msgArea.innerText = data.message;
                shakeInput();
                resetBtn();
            }
        } catch (e) {
            msgArea.innerText = '連線錯誤，請重試';
            resetBtn();
            console.error(e);
        }
    }

    function renderMainCard(data, fs) {
        resName.innerText = data.name;
        resId.innerText = data.employee_id;
        resId.hidden = fs.employee_id === false;

        if (fs.status !== false) {
            resStatus.innerHTML = data.status === 'CheckedIn'
                ? '<span class="pill-ok"><i class="bi bi-check-circle-fill"></i>已報到</span>'
                : '<span class="pill-wait"><i class="bi bi-hourglass-split"></i>未報到</span>';
            resStatus.hidden = false;
        } else {
            resStatus.hidden = true;
        }

        const showType = fs.participant_type !== false;
        const typeLabel = showType ? (data.participant_type_label || TYPE_LABELS[data.participant_type] || '') : '';
        resType.innerText = typeLabel;
        resType.hidden = !typeLabel;
        const linked = showType && data.participant_type === 'dependent' && data.linked_employee_id;
        resLinked.innerText = linked ? `綁定員工：${data.linked_employee_id}` : '';
        resLinked.hidden = !linked;

        resLotteryBox.hidden = fs.lottery_number === false;
        const table = data.table_number || '未分配';
        resTable.classList.toggle('small', table.length > 3);
        resTableSec.hidden = fs.table_number === false;

        const showMeal = fs.meal_type !== false && !!data.meal_type;
        resMealText.innerText = showMeal ? mealLabel(data.meal_type) : '';
        resMealBox.hidden = !showMeal;

        const showGroup = fs.group_name !== false && !!data.group_name;
        resGroupText.innerText = showGroup ? data.group_name : '';
        resGroupBox.hidden = !showGroup;

        if (fs.prize_info !== false) {
            prizeContainer.className = 'prize' + (data.is_winner ? ' win' : '');
            prizeContainer.innerHTML = data.is_winner
                ? `<span class="sweep soft"></span><i class="bi bi-gift-fill"></i><span>恭喜獲得　${esc(data.prize_info)}</span>`
                : `<i class="bi bi-stars"></i><span>${esc(data.prize_info)}</span>`;
            prizeContainer.hidden = false;
        } else {
            prizeContainer.hidden = true;
        }

        resFootWrap.hidden = resMealBox.hidden && resGroupBox.hidden && prizeContainer.hidden;
    }

    function buildDepCard(dep, index, fs) {
        const delay = (0.25 + (index - 1) * 0.15).toFixed(2);
        let html = `<div class="dep-card glass" style="animation-delay:${delay}s">`;
        html += `<div class="dep-top"><span class="dep-idx">DEPENDENT ${index}</span>`;
        if (fs.status !== false) {
            html += dep.status === 'CheckedIn'
                ? '<span class="dep-status" style="color:var(--aqua-2)"><i class="bi bi-check-circle-fill"></i> 已報到</span>'
                : '<span class="dep-status" style="color:var(--dim)"><i class="bi bi-hourglass-split"></i> 未報到</span>';
        }
        html += '</div><div>';
        html += `<div class="dep-name">${esc(dep.name)}</div>`;
        if (fs.employee_id !== false) html += `<div class="dep-id">${esc(dep.employee_id)}</div>`;
        html += '</div>';

        const cells = [];
        if (fs.table_number !== false) {
            const t = dep.table_number || '未分配';
            cells.push(`<div><div class="lbl">桌次</div><div class="val${t.length > 3 ? ' small' : ''}">${esc(t)}</div></div>`);
        }
        if (fs.lottery_number !== false) {
            cells.push(`<div class="gold"><div class="lbl">抽獎號碼</div><div class="val">${esc(dep.lottery_number || '---')}</div></div>`);
        }
        if (cells.length) html += `<div class="dep-nums"${cells.length === 1 ? ' style="grid-template-columns:1fr"' : ''}>${cells.join('')}</div>`;

        const tags = [];
        if (fs.meal_type !== false && dep.meal_type) tags.push(`<span><i class="bi bi-egg-fried"></i>${esc(mealLabel(dep.meal_type))}</span>`);
        if (fs.group_name !== false && dep.group_name) tags.push(`<span><i class="bi bi-people-fill"></i>${esc(dep.group_name)}</span>`);
        if (tags.length) html += `<div class="dep-tags">${tags.join('')}</div>`;

        if (fs.prize_info !== false) {
            html += dep.is_winner
                ? `<div class="dep-prize win"><i class="bi bi-gift-fill"></i>${esc(dep.prize_info)}</div>`
                : `<div class="dep-prize"><i class="bi bi-stars"></i>${esc(dep.prize_info)}</div>`;
        }
        return html + '</div>';
    }

    // 數字先亂跳再定格（只改文字，不重排版面）
    let rollTimer = null;
    function rollTo(pairs) {
        clearInterval(rollTimer);
        const rand = s => String(s).replace(/[0-9]/g, () => Math.floor(Math.random() * 10));
        const end = performance.now() + 1100;
        rollTimer = setInterval(() => {
            const done = performance.now() >= end;
            pairs.forEach(([el, v]) => { el.textContent = done ? v : rand(v); });
            if (done) clearInterval(rollTimer);
        }, 50);
    }

    function resetBtn() {
        btnSubmit.disabled = false;
        btnLabel.innerText = '開始查詢';
    }

    function shakeInput() {
        searchBar.classList.remove('is-invalid');
        void searchBar.offsetWidth;
        searchBar.classList.add('is-invalid');
        setTimeout(() => searchBar.classList.remove('is-invalid'), 600);
    }
</script>
</body>
</html>
