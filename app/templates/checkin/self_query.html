<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資訊查詢站</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            /* 與報到頁面相同的星空背景，維持風格一致 */
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 主卡片：完全沿用報到頁面的毛玻璃設計 */
        .checkin-card {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 裝飾光暈：改為冷色系 (Cyan) 以區別報到的金色 */
        .checkin-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.1) 0%, transparent 60%);
            animation: rotate 10s linear infinite;
            pointer-events: none;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 標題圖示：改為科技藍漸層 */
        .title-icon {
            font-size: 3.5rem;
            background: linear-gradient(to bottom, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(0, 198, 255, 0.3));
        }

        .main-title {
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* 輸入框：維持樣式，但 Focus 改為藍色光暈 */
        .form-control-lg {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff !important;
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 2px;
            border-radius: 12px;
            transition: all 0.3s;
        }
        .form-control-lg:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00c6ff;
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.3);
            outline: none;
        }
        .form-control::placeholder { color: rgba(255, 255, 255, 0.4); }

        /* 按鈕：改為藍色系漸層 */
        .btn-query {
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            border: none;
            color: #fff; /* 藍底白字 */
            font-weight: 800;
            font-size: 1.2rem;
            padding: 12px;
            border-radius: 12px;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            z-index: 1;
        }
        .btn-query:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 198, 255, 0.4);
            color: #fff;
        }
        .btn-query:active { transform: scale(0.98); }

        /* 結果顯示區 */
        .result-box {
            margin-top: 30px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .res-label { font-size: 0.9rem; color: #aaa; margin-bottom: 5px; }
        
        /* 抽獎號碼區域：維持藍色系 */
        .lottery-badge-container {
            margin: 15px 0;
            padding: 10px;
            background: rgba(0, 255, 234, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 234, 0.3);
        }
        .lottery-num-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #00ffea;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 255, 234, 0.5);
        }

        /* 桌號特大顯示：使用明亮的青色/白色，區別於報到的金色 */
        .table-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: #fff; /* 改為白色以配合藍底 */
            line-height: 1;
            margin: 10px 0 20px 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }

        /* 中獎資訊卡 */
        .prize-card {
            background: linear-gradient(45deg, #e52d27, #b31217);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(229, 45, 39, 0.4);
            animation: pulse 2s infinite;
        }
        .prize-card.no-prize {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
            box-shadow: none;
            animation: none;
            font-weight: normal;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        #msg-area { min-height: 24px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="checkin-card">
        <i class="bi bi-search title-icon"></i>
        <h2 class="main-title">SEARCH INFO</h2>
        
        <div class="mb-3">
            <input type="text" id="emp-id" class="form-control form-control-lg" 
                   placeholder="請輸入工號查詢" autocomplete="off" autofocus>
        </div>
        
        <div class="d-grid gap-2">
            <button class="btn btn-query" id="btn-submit">
                <i class="bi bi-search me-1"></i> 開始查詢
            </button>
        </div>

        <div id="msg-area" class="text-info fw-bold"></div>

        <div id="result-area" class="result-box">
            <h3 id="res-name" class="fw-bold text-white mb-1"></h3>
            <div id="res-id" class="text-white-50 small mb-3"></div>
            
            <div class="lottery-badge-container">
                <div class="res-label" style="color: #00ffea;">抽獎編號</div>
                <div class="lottery-num-display" id="res-lottery-num">---</div>
            </div>

            <div class="border-top border-secondary pt-3">
                <div class="res-label">您的桌次</div>
                <div class="table-badge"><span id="res-table">-</span></div>
            </div>

            <div id="prize-container"></div>
        </div>
    </div>

    <script>
        const empInput = document.getElementById('emp-id');
        const btnSubmit = document.getElementById('btn-submit');
        const msgArea = document.getElementById('msg-area');
        const resultArea = document.getElementById('result-area');
        const resName = document.getElementById('res-name');
        const resId = document.getElementById('res-id');
        const resTable = document.getElementById('res-table');
        const prizeContainer = document.getElementById('prize-container');
        const resLotteryNum = document.getElementById('res-lottery-num');

        // 監聽 Enter 鍵
        empInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        btnSubmit.addEventListener('click', doSearch);

        async function doSearch() {
            const empId = empInput.value.trim();
            if (!empId) {
                msgArea.innerText = "請輸入工號！";
                shakeInput();
                return;
            }

            // UI 狀態切換
            msgArea.innerText = "查詢中...";
            resultArea.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 查詢中...';

            try {
                // 指向 純查詢 API
                const res = await fetch("{{ url_for('checkin.api_search_by_id') }}", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ employee_id: empId })
                });
                const data = await res.json();

                if (data.success) {
                    msgArea.innerText = ""; 
                    
                    // 填入資料
                    resName.innerText = data.name;
                    resId.innerText = data.employee_id;
                    resLotteryNum.innerText = data.lottery_number || "---"; 
                    resTable.innerText = data.table_number || "未分配";

                    // 處理中獎顯示
                    if (data.is_winner) {
                        prizeContainer.innerHTML = `
                            <div class="prize-card">
                                <i class="bi bi-gift-fill me-2"></i>恭喜獲得<br>
                                <span style="color:#FFD700">${data.prize_info}</span>
                            </div>`;
                    } else {
                        prizeContainer.innerHTML = `
                            <div class="prize-card no-prize">
                                <i class="bi bi-stars me-1"></i> ${data.prize_info}
                            </div>`;
                    }

                    // 顯示結果區
                    resultArea.style.display = 'block';
                    
                    // 查詢模式下顯示 8 秒，比報到稍微長一點點 (方便閱讀)
                    setTimeout(() => {
                        resetForm();
                    }, 8000);

                } else {
                    msgArea.innerText = data.message;
                    shakeInput();
                    resetBtn();
                }
            } catch (e) {
                msgArea.innerText = "連線錯誤，請重試";
                resetBtn();
                console.error(e);
            }
        }

        function resetForm() {
            empInput.value = '';
            resultArea.style.display = 'none';
            msgArea.innerText = '';
            resetBtn();
            empInput.focus();
        }

        function resetBtn() {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<i class="bi bi-search me-1"></i> 開始查詢';
        }

        function shakeInput() {
            empInput.classList.add('is-invalid');
            // 自訂 shake 動畫效果可選，這裡沿用 bootstrap is-invalid 紅框
            setTimeout(() => empInput.classList.remove('is-invalid'), 500);
        }
    </script>
</body>
</html>
