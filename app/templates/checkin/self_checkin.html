<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自助報到</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ocean:       #0284c7;
            --ocean-dark:  #0369a1;
            --ocean-light: #38bdf8;
            --nature:      #059669;
            --sand:        #d97706;
            --bg-page:     #f0f9ff;
        }

        body {
            background: linear-gradient(160deg, #e0f2fe 0%, #f0fdf4 50%, #fef9c3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
            padding: 20px 0;
        }

        .checkin-card {
            background: #ffffff;
            border: 2px solid #bae6fd;
            border-radius: 24px;
            padding: 40px 36px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 16px 48px rgba(2, 132, 199, 0.13);
            text-align: center;
        }

        .title-icon {
            font-size: 3rem;
            color: var(--ocean);
            display: block;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 8px rgba(2,132,199,0.25));
        }
        .main-title {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            font-weight: 900;
            font-size: 0.88rem;
            letter-spacing: 4px;
            color: #64748b;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .wave-deco {
            font-size: 1.4rem;
            letter-spacing: 4px;
            opacity: 0.4;
            margin-bottom: 18px;
        }

        /* 輸入框 */
        .form-control-lg {
            border: 2px solid #bae6fd !important;
            background: #f8fafc !important;
            color: #0c4a6e !important;
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 3px;
            border-radius: 12px;
            transition: all 0.3s;
        }
        .form-control-lg:focus {
            border-color: var(--ocean) !important;
            box-shadow: 0 0 0 0.2rem rgba(2,132,199,0.18) !important;
            background: #ffffff !important;
            outline: none;
        }
        .form-control-lg::placeholder { color: #94a3b8; }

        /* 報到按鈕 */
        .btn-checkin {
            background: linear-gradient(90deg, var(--ocean-dark), var(--ocean));
            border: none;
            color: #fff;
            font-weight: 800;
            font-size: 1.05rem;
            padding: 13px;
            border-radius: 12px;
            margin-top: 14px;
            transition: all 0.2s;
        }
        .btn-checkin:hover {
            background: linear-gradient(90deg, var(--ocean), var(--ocean-light));
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(2,132,199,0.3);
        }
        .btn-checkin:active { transform: scale(0.98); }

        /* 結果區 */
        .result-box {
            margin-top: 24px;
            padding: 24px 20px;
            background: #f8fafc;
            border-radius: 16px;
            border: 1px solid #e0f2fe;
            display: none;
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .res-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }
        .res-name { color: #0c4a6e; font-size: 1.5rem; font-weight: 800; }

        /* 抽獎號碼框 */
        .lottery-box {
            margin: 14px 0;
            padding: 12px;
            background: #e0f2fe;
            border-radius: 12px;
            border: 1px solid #bae6fd;
        }
        .lottery-num {
            font-family: 'Nunito', sans-serif;
            font-size: 2.4rem;
            color: var(--ocean-dark);
            font-weight: 900;
            letter-spacing: 4px;
        }

        /* 桌次 */
        .table-badge {
            font-family: 'Nunito', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--sand);
            line-height: 1;
            margin: 8px 0 14px 0;
        }

        /* 餐點區塊 */
        .meal-box {
            display: none;
            margin: 10px 0;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 1.3rem;
            font-weight: 800;
        }
        .meal-box.meal-a {
            background: #d1fae5;
            border: 1px solid #6ee7b7;
            color: #065f46;
        }
        .meal-box.meal-b {
            background: #dbeafe;
            border: 1px solid #93c5fd;
            color: #1e3a8a;
        }

        /* 組別區塊 */
        .group-box {
            display: none;
            margin: 8px 0;
            padding: 8px 14px;
            border-radius: 10px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            font-size: 1rem;
            font-weight: 700;
            color: #065f46;
        }

        /* 身分徽章 */
        .type-badge-employee  {
            background: #eff6ff; color: #1d4ed8;
            border: 1px solid #bfdbfe; border-radius: 6px;
            padding: 3px 10px; font-size: 0.8rem; font-weight: 600;
        }
        .type-badge-dependent {
            background: #faf5ff; color: #7c3aed;
            border: 1px solid #ddd6fe; border-radius: 6px;
            padding: 3px 10px; font-size: 0.8rem; font-weight: 600;
        }
        .linked-text { color: #7c3aed; font-size: 0.82rem; }

        /* 中獎卡 */
        .prize-card {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 6px 18px rgba(220,38,38,0.3);
            animation: pulse 2s infinite;
        }
        .prize-card.no-prize {
            background: #f1f5f9;
            color: #94a3b8;
            box-shadow: none;
            animation: none;
            font-weight: 400;
            border: 1px solid #e2e8f0;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%       { transform: scale(1.02); }
        }

        .divider { border-color: #e0f2fe; margin: 14px 0; }
        #msg-area { min-height: 22px; margin-top: 8px; font-size: 0.95rem; color: #dc2626; font-weight: 700; }
        #msg-area.msg-success { color: var(--nature); }
    </style>
</head>
<body>

<div class="checkin-card">
    <i class="bi bi-qr-code-scan title-icon"></i>
    <div class="main-title">Guest Check-In</div>
    <div class="wave-deco">🌊 🌿 🌊</div>

    <div class="mb-3">
        <input type="text" id="emp-id" class="form-control form-control-lg"
               placeholder="請輸入工號" autocomplete="off" autofocus>
    </div>

    <div class="d-grid">
        <button class="btn btn-checkin" id="btn-submit">
            確認報到 <i class="bi bi-arrow-right-circle-fill ms-1"></i>
        </button>
    </div>

    <div id="msg-area"></div>

    <div id="result-area" class="result-box">
        <!-- 姓名 + 身分 -->
        <div class="res-name mb-1" id="res-name"></div>
        <div class="d-flex align-items-center justify-content-center gap-2 mb-1">
            <span id="res-id" class="text-muted small"></span>
            <span id="res-type-badge"></span>
        </div>
        <div id="res-linked" class="small mb-3 linked-text"></div>

        <!-- 報到流水號（有值才顯示） -->
        <div id="res-seq-box" style="display:none;margin:10px 0;padding:10px 14px;border-radius:10px;background:#faf5ff;border:1px solid #ddd6fe;text-align:center;">
            <div class="res-label" style="color:#7c3aed;">報到序號</div>
            <div style="font-family:'Nunito',sans-serif;font-size:2rem;font-weight:900;color:#7c3aed;letter-spacing:3px;" id="res-seq">-</div>
        </div>

        <!-- 抽獎號碼 -->
        <div class="lottery-box">
            <div class="res-label">抽獎號碼</div>
            <div class="lottery-num" id="res-lottery-num">---</div>
        </div>

        <!-- 桌次 -->
        <hr class="divider">
        <div class="res-label">您的桌次</div>
        <div class="table-badge"><span id="res-table">-</span></div>

        <!-- 餐點（有值才顯示） -->
        <div id="res-meal-box" class="meal-box">
            <i class="bi bi-egg-fried me-2"></i>
            <span id="res-meal-text">-</span>
        </div>

        <!-- 組別（有值才顯示） -->
        <div id="res-group-box" class="group-box">
            <i class="bi bi-people-fill me-2"></i>
            <span id="res-group-text">-</span>
        </div>

        <hr class="divider">

        <!-- 中獎資訊 -->
        <div id="prize-container"></div>
    </div>
</div>

<script>
    const empInput    = document.getElementById('emp-id');
    const btnSubmit   = document.getElementById('btn-submit');
    const msgArea     = document.getElementById('msg-area');
    const resultArea  = document.getElementById('result-area');
    const resName     = document.getElementById('res-name');
    const resId       = document.getElementById('res-id');
    const resTypeBadge= document.getElementById('res-type-badge');
    const resLinked   = document.getElementById('res-linked');
    const resTable    = document.getElementById('res-table');
    const resSeqBox   = document.getElementById('res-seq-box');
    const resSeq      = document.getElementById('res-seq');
    const resLotteryNum = document.getElementById('res-lottery-num');
    const resMealBox  = document.getElementById('res-meal-box');
    const resMealText = document.getElementById('res-meal-text');
    const resGroupBox = document.getElementById('res-group-box');
    const resGroupText= document.getElementById('res-group-text');
    const prizeContainer = document.getElementById('prize-container');

    empInput.addEventListener('keyup', e => { if (e.key === 'Enter') checkin(); });
    btnSubmit.addEventListener('click', checkin);

    async function checkin() {
        const empId = empInput.value.trim();
        if (!empId) { msgArea.innerText = '請輸入工號！'; msgArea.className = ''; shakeInput(); return; }

        msgArea.innerText = '查詢中…';
        msgArea.className = '';
        resultArea.style.display = 'none';
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 處理中…';

        try {
            const res  = await fetch("{{ url_for('checkin.api_checkin_by_id') }}", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({employee_id: empId})
            });
            const data = await res.json();

            if (data.success) {
                msgArea.innerText = '';

                // 基本資訊
                resName.innerText = data.name;
                resId.innerText   = data.employee_id;
                resLotteryNum.innerText = data.lottery_number || '---';
                resTable.innerText = data.table_number || '未分配';

                // 報到流水號
                if (data.checkin_seq) {
                    resSeq.innerText = data.checkin_seq;
                    resSeqBox.style.display = 'block';
                } else {
                    resSeqBox.style.display = 'none';
                }

                // 身分徽章
                if (data.participant_type === 'employee') {
                    resTypeBadge.innerHTML = '<span class="type-badge-employee">員工</span>';
                    resLinked.innerText = '';
                } else if (data.participant_type === 'dependent') {
                    resTypeBadge.innerHTML = '<span class="type-badge-dependent">眷屬</span>';
                    resLinked.innerText = data.linked_employee_id ? `綁定員工：${data.linked_employee_id}` : '';
                } else {
                    resTypeBadge.innerHTML = '';
                    resLinked.innerText = '';
                }

                // 餐點
                if (data.meal_type === 'A') {
                    resMealBox.className = 'meal-box meal-a';
                    resMealText.innerText = 'A 餐';
                    resMealBox.style.display = 'block';
                } else if (data.meal_type === 'B') {
                    resMealBox.className = 'meal-box meal-b';
                    resMealText.innerText = 'B 餐';
                    resMealBox.style.display = 'block';
                } else {
                    resMealBox.style.display = 'none';
                }

                // 組別
                if (data.group_name) {
                    resGroupText.innerText = data.group_name;
                    resGroupBox.style.display = 'block';
                } else {
                    resGroupBox.style.display = 'none';
                }

                // 中獎資訊
                if (data.is_winner) {
                    prizeContainer.innerHTML = `
                        <div class="prize-card">
                            <i class="bi bi-gift-fill me-2"></i>恭喜獲得<br>
                            <span style="color:#fde68a;font-size:1.1em;">${data.prize_info}</span>
                        </div>`;
                } else {
                    prizeContainer.innerHTML = `
                        <div class="prize-card no-prize">
                            <i class="bi bi-stars me-1"></i> ${data.prize_info}
                        </div>`;
                }

                resultArea.style.display = 'block';
                setTimeout(resetForm, 12000);

            } else {
                msgArea.innerText = data.message;
                msgArea.className = '';
                shakeInput();
                resetBtn();
            }
        } catch (e) {
            msgArea.innerText = '連線錯誤，請重試';
            resetBtn();
            console.error(e);
        }
    }

    function resetForm() {
        empInput.value = '';
        resultArea.style.display = 'none';
        msgArea.innerText = '';
        resTypeBadge.innerHTML = '';
        resLinked.innerText = '';
        resMealBox.style.display = 'none';
        resGroupBox.style.display = 'none';
        resSeqBox.style.display = 'none';
        resetBtn();
        empInput.focus();
    }

    function resetBtn() {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '確認報到 <i class="bi bi-arrow-right-circle-fill ms-1"></i>';
    }

    function shakeInput() {
        empInput.classList.add('is-invalid');
        setTimeout(() => empInput.classList.remove('is-invalid'), 500);
    }
</script>
</body>
</html>
