<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自助報到</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ocean.css') }}?v=20261118">
    <style>
        .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px 20px; }
        .form-col { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        h1 { margin: 18px 0 10px; font: 900 76px/1.05 'Noto Sans TC', sans-serif; letter-spacing: .1em; }
        .lead { margin: 0 0 40px; color: var(--muted); font-size: 17px; letter-spacing: .1em; }

        #emp-id {
            width: 100%; height: 84px; border-radius: 24px; outline: none;
            background: rgba(6, 40, 66, .72); border: 1px solid rgba(190, 245, 255, .3);
            color: #fff; text-align: center; font: 600 30px var(--num-font); letter-spacing: .2em;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 20px 50px rgba(0, 12, 30, .35);
            transition: border-color .2s, box-shadow .2s;
        }
        #emp-id::placeholder { letter-spacing: .14em; font-family: 'Noto Sans TC', sans-serif; }
        #emp-id:focus { border-color: var(--aqua); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 0 0 6px rgba(94, 234, 212, .16), 0 20px 60px rgba(94, 234, 212, .25); }
        #emp-id.is-invalid { border-color: var(--error); animation: shake .3s; }

        #btn-submit { margin-top: 16px; width: 100%; height: 70px; border-radius: 24px; font-size: 21px; }
        #btn-submit i { font-size: 22px; }
        #msg-area { min-height: 26px; margin-top: 14px; font-size: 16px; font-weight: 700; color: var(--error); }

        /* 票卡版面 */
        .ticket-wrap { width: 100%; max-width: 500px; margin-top: 6px; perspective: 1100px; animation: rise .7s cubic-bezier(.2, .9, .25, 1.1) both; }
        .t-head { position: relative; padding: 28px 30px 22px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
        .t-name { font: 900 40px/1.15 'Noto Sans TC', sans-serif; margin: 14px 0 8px; letter-spacing: .06em; word-break: break-all; }
        .t-id { font: 600 14px var(--num-font); color: var(--muted); letter-spacing: .08em; }
        .seq-label { font-size: 12px; color: var(--dim); letter-spacing: .24em; }
        .seq-val { font: 600 26px var(--num-font); color: var(--ink-2); margin-top: 6px; }
        .t-grid { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 18px; }
        .t-foot { position: relative; padding: 18px 30px 26px; display: flex; flex-direction: column; gap: 12px; }
        .drain { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, #7EF0E0, #FFE3A3); transform-origin: left; animation: drain 12s linear both; }

        @media (max-width: 560px) {
            h1 { font-size: 52px; }
            .num-val { font-size: 48px; }
            .t-name { font-size: 32px; }
        }
    </style>
</head>
<body>
<ocean-scene palette="lagoon" intensity="1"></ocean-scene>

<div class="page ocean-layer">
    <div class="form-col">
        <div class="eyebrow"><i class="bi bi-water"></i>GUEST CHECK-IN</div>
        <h1 class="shimmer-text">活動報到</h1>
        <p class="lead">請輸入工號完成報到</p>

        <input type="text" id="emp-id" placeholder="請輸入工號" autocomplete="off" autofocus>

        <button class="btn-aqua glow" id="btn-submit" type="button">
            <span class="sweep"></span>
            <span id="btn-label">確認報到</span><i class="bi bi-arrow-right-circle-fill"></i>
        </button>

        <div id="msg-area"></div>
    </div>

    <div id="result-area" class="ticket-wrap" hidden>
        <div class="ticket glass" id="ticket">
            <div class="holo"><div class="holo-band"></div><div class="holo-spot"></div></div>

            <div class="t-head">
                <div style="text-align:left;min-width:0">
                    <div class="pill-ok"><i class="bi bi-check-circle-fill"></i>報到成功</div>
                    <div class="t-name" id="res-name"></div>
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                        <span class="t-id" id="res-id"></span>
                        <span class="type-chip" id="res-type" hidden></span>
                    </div>
                    <div class="linked" id="res-linked" hidden></div>
                </div>
                <div id="res-seq-box" style="text-align:right;flex-shrink:0" hidden>
                    <div class="seq-label">報到序號</div>
                    <div class="seq-val" id="res-seq"></div>
                </div>
            </div>

            <div class="t-grid">
                <div class="num-box">
                    <div class="box-label">您的桌次</div>
                    <div class="num-val" id="res-table">-</div>
                </div>
                <div class="num-box gold">
                    <div class="box-label">抽獎號碼</div>
                    <div class="num-val" id="res-lottery-num">---</div>
                </div>
            </div>

            <div class="t-cut"></div>
            <div class="t-foot">
                <div class="chips">
                    <div class="chip" id="res-meal-box" hidden><i class="bi bi-egg-fried"></i><span id="res-meal-text"></span></div>
                    <div class="chip" id="res-group-box" hidden><i class="bi bi-people-fill"></i><span id="res-group-text"></span></div>
                </div>
                <div class="prize" id="prize-container"></div>
            </div>
            <div class="drain" id="drain"></div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/ocean-fx.js') }}?v=20261118"></script>
<script>
    const empInput    = document.getElementById('emp-id');
    const btnSubmit   = document.getElementById('btn-submit');
    const btnLabel    = document.getElementById('btn-label');
    const msgArea     = document.getElementById('msg-area');
    const resultArea  = document.getElementById('result-area');
    const ticket      = document.getElementById('ticket');
    const resName     = document.getElementById('res-name');
    const resId       = document.getElementById('res-id');
    const resType     = document.getElementById('res-type');
    const resLinked   = document.getElementById('res-linked');
    const resTable    = document.getElementById('res-table');
    const resSeqBox   = document.getElementById('res-seq-box');
    const resSeq      = document.getElementById('res-seq');
    const resLotteryNum = document.getElementById('res-lottery-num');
    const resMealBox  = document.getElementById('res-meal-box');
    const resMealText = document.getElementById('res-meal-text');
    const resGroupBox = document.getElementById('res-group-box');
    const resGroupText= document.getElementById('res-group-text');
    const prizeContainer = document.getElementById('prize-container');
    const drain       = document.getElementById('drain');

    const TYPE_LABELS = { employee: '員工', dependent: '眷屬', vendor_contact: '外部廠商主要窗口', vendor: '外部廠商' };
    let resetTimer = null;

    empInput.addEventListener('keyup', e => { if (e.key === 'Enter') checkin(); });
    btnSubmit.addEventListener('click', checkin);

    async function checkin() {
        if (btnSubmit.disabled) return;
        const empId = empInput.value.trim();
        if (!empId) { msgArea.innerText = '請輸入工號！'; shakeInput(); return; }

        msgArea.innerText = '';
        resultArea.hidden = true;
        btnSubmit.disabled = true;
        btnLabel.innerHTML = '<span class="spinner"></span> 處理中…';

        try {
            const res  = await fetch("{{ url_for('checkin.api_checkin_by_id') }}", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({employee_id: empId})
            });
            const data = await res.json();

            if (data.success) {
                showResult(data);
                clearTimeout(resetTimer);
                resetTimer = setTimeout(resetForm, 12000);
            } else {
                msgArea.innerText = data.message;
                shakeInput();
                resetBtn();
            }
        } catch (e) {
            msgArea.innerText = '連線錯誤，請重試';
            resetBtn();
            console.error(e);
        }
    }

    function showResult(data) {
        resName.innerText = data.name;
        resId.innerText   = data.employee_id;

        const typeLabel = data.participant_type_label || TYPE_LABELS[data.participant_type] || '';
        resType.innerText = typeLabel;
        resType.hidden = !typeLabel;
        const linked = data.participant_type === 'dependent' && data.linked_employee_id;
        resLinked.innerText = linked ? `綁定員工：${data.linked_employee_id}` : '';
        resLinked.hidden = !linked;

        resSeqBox.hidden = !data.checkin_seq;

        const table = data.table_number || '未分配';
        resTable.classList.toggle('small', table.length > 3);

        if (data.meal_type) {
            resMealText.innerText = /^[A-Z]$/i.test(data.meal_type) ? data.meal_type.toUpperCase() + ' 餐' : data.meal_type;
            resMealBox.hidden = false;
        } else {
            resMealBox.hidden = true;
        }

        if (data.group_name) {
            resGroupText.innerText = data.group_name;
            resGroupBox.hidden = false;
        } else {
            resGroupBox.hidden = true;
        }

        prizeContainer.className = 'prize' + (data.is_winner ? ' win' : '');
        prizeContainer.innerHTML = data.is_winner
            ? '<span class="sweep soft"></span><i class="bi bi-gift-fill"></i><span></span>'
            : '<i class="bi bi-stars"></i><span></span>';
        prizeContainer.lastElementChild.innerText = data.is_winner ? `恭喜獲得　${data.prize_info}` : data.prize_info;

        // 重新觸發進場與倒數動畫
        resultArea.hidden = false;
        resultArea.style.animation = 'none'; drain.style.animation = 'none';
        void resultArea.offsetWidth;
        resultArea.style.animation = ''; drain.style.animation = '';

        rollTo([
            [resSeq, data.checkin_seq ? String(data.checkin_seq) : ''],
            [resTable, table],
            [resLotteryNum, data.lottery_number || '---']
        ]);
        if (window.OceanFX) OceanFX.burst(innerWidth / 2, innerHeight * 0.62, { count: 170, gold: .65, power: 12 });
    }

    // 數字先亂跳再定格（只改文字，不重排版面）
    let rollTimer = null;
    function rollTo(pairs) {
        clearInterval(rollTimer);
        const rand = s => String(s).replace(/[0-9]/g, () => Math.floor(Math.random() * 10));
        const end = performance.now() + 1100;
        rollTimer = setInterval(() => {
            const done = performance.now() >= end;
            pairs.forEach(([el, v]) => { el.textContent = done ? v : rand(v); });
            if (done) clearInterval(rollTimer);
        }, 50);
    }

    const tilt = window.OceanFX ? OceanFX.tilt(resultArea, ticket) : { reset() {} };

    function resetForm() {
        empInput.value = '';
        resultArea.hidden = true;
        msgArea.innerText = '';
        tilt.reset();
        resetBtn();
        empInput.focus();
    }

    function resetBtn() {
        btnSubmit.disabled = false;
        btnLabel.innerText = '確認報到';
    }

    function shakeInput() {
        empInput.classList.remove('is-invalid');
        void empInput.offsetWidth;
        empInput.classList.add('is-invalid');
        setTimeout(() => empInput.classList.remove('is-invalid'), 600);
    }
</script>
</body>
</html>
