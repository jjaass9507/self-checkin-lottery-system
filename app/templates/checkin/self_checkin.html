<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自助報到系統</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            /* (*** 1. 更活潑的漸層背景 ***) */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden; /* 確保背景填滿 */
        }
        /* (*** 2. 毛玻璃特效卡片 ***) */
        .checkin-container {
            width: 100%;
            max-width: 550px;
            padding: 3rem;
            /* (A) 半透明背景 */
            background: rgba(255, 255, 255, 0.95);
            /* (B) 背景模糊 (關鍵) */
            backdrop-filter: blur(10px);
            /* (C) 漂亮的邊框 */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            color: #333; /* 文字改回深色 */
        }
        
        /* (*** 3. 頂部新增一個大圖示 ***) */
        .kiosk-icon {
            font-size: 5rem; /* 大小 */
            color: #0d6efd; /* 主題藍 */
            margin-bottom: 1rem;
        }

        #employee-id-input {
            font-size: 1.75rem;
            height: 4.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #ddd; /* 讓輸入框更明顯 */
        }
        /* (*** 4. 按鈕改為更活潑的綠色 ***) */
        #checkin-button {
            font-size: 1.5rem;
            font-weight: 700; /* 加粗 */
            height: 4.5rem;
            background-image: linear-gradient(to right, #28a745 0%, #218838 100%);
            border: none;
            transition: all 0.3s ease;
        }
        #checkin-button:hover {
            transform: translateY(-2px); /* 輕微上浮 */
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3);
        }
        
        #checkin-result .alert {
            font-size: 1.1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="checkin-container text-center">
        
        <i class="bi bi-person-badge-fill kiosk-icon"></i>

        <h1 class="mb-3" style="font-weight: 700;">歡迎報到</h1>
        <p class="lead text-muted mb-4">請在下方輸入您的工號以完成報到</p>

        <form id="checkin-form">
            <div class="mb-3">
                <input type="text" class="form-control text-center" id="employee-id-input" placeholder="請輸入工號" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="checkin-button">
                <i class="bi bi-check-circle-fill me-2"></i> 確認報到
            </button>
        </form>
        
        <div id="checkin-result" class="mt-4" style="height: 70px;">
            </div>
    </div>

    <script>
        const checkinForm = document.getElementById('checkin-form');
        const idInput = document.getElementById('employee-id-input');
        const checkinButton = document.getElementById('checkin-button');
        const resultEl = document.getElementById('checkin-result');
        
        checkinForm.addEventListener('submit', function(event) {
            event.preventDefault(); 
            const employeeId = idInput.value;
            if (!employeeId) {
                setResult("請輸入工號", "warning");
                return;
            }
            setLoading(true);
            fetch("{{ url_for('checkin.api_checkin_by_id') }}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ employee_id: employeeId })
            })
            .then(response => response.json())
            .then(data => {
                setResult(data.message, data.status);
                if (data.success) {
                    setTimeout(resetForm, 5000);
                } else {
                    setTimeout(resetForm, 3000);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                setResult("發生網路或伺服器錯誤，請洽工作人員", "danger");
                setTimeout(resetForm, 3000);
            });
        });

        function setResult(message, status) {
            resultEl.innerHTML = `
                <div class="alert alert-${status} h5">
                    ${message}
                </div>`;
        }

        function setLoading(isLoading) {
            if (isLoading) {
                checkinButton.disabled = true;
                checkinButton.innerHTML = `
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    處理中...`;
                idInput.disabled = true;
            } else {
                checkinButton.disabled = false;
                // (*** 修正按鈕圖示 ***)
                checkinButton.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i> 確認報到';
                idInput.disabled = false;
            }
        }
        
        function resetForm() {
            setLoading(false);
            idInput.value = '';
            resultEl.innerHTML = '';
            idInput.focus();
        }
    </script>
</body>
</html>
