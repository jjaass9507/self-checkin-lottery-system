<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時報到儀表板</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f4f7f6;
        }
        .stat-card {
            border-left: 5px solid;
        }
        .stat-card.border-primary { border-color: #0d6efd; }
        .stat-card.border-success { border-color: #198754; }
        .stat-card.border-warning { border-color: #ffc107; }

        /* (*** 關鍵：讓表格的頭部固定 ***) */
        .table-container {
            max-height: 70vh; /* 限制高度 */
            overflow-y: auto; /* 加上垂直捲軸 */
        }
        .table thead {
            position: sticky; /* 關鍵 */
            top: 0; /* 關鍵 */
            background: #fff; /* 必須有背景色 */
            z-index: 10;
        }
        /* (*** 狀態標籤 ***) */
        .status-badge {
            padding: 0.4em 0.7em;
            border-radius: 0.25rem;
            font-size: 0.85em;
            font-weight: 700;
        }
        .status-badge-checkedin {
            color: #198754;
            background-color: #d1e7dd;
        }
        .status-badge-registered {
            color: #6c757d;
            background-color: #e9ecef;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-speedometer2 me-2"></i> 即時報到儀表板
            </a>
            <span class="navbar-text" id="last-updated">
                <span class="spinner-border spinner-border-sm"></span> 載入中...
            </span>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <div class="card shadow-sm stat-card border-primary">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="card-title text-primary">總報到人數</h5>
                                <h2 class="mb-0 fw-bold" id="stat-total">...</h2>
                            </div>
                            <i class="bi bi-people-fill fs-1 text-muted"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm stat-card border-success">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="card-title text-success">已報到</h5>
                                <h2 class="mb-0 fw-bold" id="stat-checkedin">...</h2>
                            </div>
                            <i class="bi bi-person-check-fill fs-1 text-success"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm stat-card border-warning">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="card-title text-warning">未報到</h5>
                                <h2 class="mb-0 fw-bold" id="stat-pending">...</h2>
                            </div>
                            <i class="bi bi-person-x-fill fs-1 text-warning"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">報到名單</h5>
                <div class="w-50">
                    <input type="text" class="form-control" id="search-box" placeholder="搜尋工號或姓名...">
                </div>
            </div>
            <div class="card-body p-0 table-container">
                <table class="table table-hover table-striped mb-0" id="status-table">
                    <thead>
                        <tr>
                            <th scope="col">姓名</th>
                            <th scope="col">工號</th>
                            <th scope="col">狀態</th>
                            <th scope="col">報到時間</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr><td colspan="4" class="text-center p-5"><div class="spinner-border"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const statTotalEl = document.getElementById('stat-total');
        const statCheckedInEl = document.getElementById('stat-checkedin');
        const statPendingEl = document.getElementById('stat-pending');
        const tableBodyEl = document.getElementById('table-body');
        const lastUpdatedEl = document.getElementById('last-updated');
        const searchBoxEl = document.getElementById('search-box');

        let fullDataCache = []; // 用來緩存完整資料，方便搜尋

        // 1. (*** 核心 ***) 獲取資料並更新畫面的函式
        async function fetchData() {
            try {
                const response = await fetch("{{ url_for('checkin.api_status_list') }}");
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                if (data.success) {
                    // (A) 更新統計卡片
                    const total = data.total_count;
                    const checkedIn = data.checked_in_count;
                    const pending = total - checkedIn;

                    statTotalEl.innerText = total;
                    statCheckedInEl.innerText = checkedIn;
                    statPendingEl.innerText = pending;

                    // (B) 緩存資料
                    fullDataCache = data.checkin_list;

                    // (C) 根據搜尋框內容，渲染表格
                    renderTable();

                    // (D) 更新時間戳
                    lastUpdatedEl.innerText = `最後更新: ${new Date().toLocaleTimeString()}`;
                } else {
                    console.error('API Error:', data.message);
                }
            } catch (error) {
                console.error('Fetch Error:', error);
                lastUpdatedEl.innerText = "更新失敗";
            }
        }

        // 2. (*** 核心 ***) 渲染表格的函式
        function renderTable() {
            const filter = searchBoxEl.value.toLowerCase();

            // 根據搜尋框過濾資料
            const filteredData = fullDataCache.filter(person => {
                return person.name.toLowerCase().includes(filter) || 
                       person.employee_id.toLowerCase().includes(filter);
            });

            // 產生 HTML
            let html = '';
            if (filteredData.length === 0) {
                html = '<tr><td colspan="4" class="text-center p-5 text-muted">查無資料</td></tr>';
            } else {
                filteredData.forEach(person => {
                    let statusBadge;
                    if (person.status === 'CheckedIn') {
                        statusBadge = '<span class="status-badge status-badge-checkedin">已報到</span>';
                    } else {
                        statusBadge = '<span class="status-badge status-badge-registered">未報到</span>';
                    }

                    html += `
                        <tr>
                            <td><b>${person.name}</b></td>
                            <td>${person.employee_id}</td>
                            <td>${statusBadge}</td>
                            <td>${person.check_in_time}</td>
                        </tr>
                    `;
                });
            }
            tableBodyEl.innerHTML = html;
        }

        // 3. (*** 核心 ***) 啟動！
        document.addEventListener('DOMContentLoaded', () => {
            fetchData(); // 立即載入一次

            // (*** 每 5 秒自動刷新一次 ***)
            setInterval(fetchData, 5000); 

            // 監聽搜尋框的輸入
            searchBoxEl.addEventListener('input', renderTable);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
